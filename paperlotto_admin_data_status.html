<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>데이터 현황판 — PaperLotto 관리자</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --board:#0c1020; --board-2:#111731; --board-line:#242c4d;
  --paper:#f6f1e4; --paper-2:#efe8d6; --ink:#1c2130; --ink-dim:#5b5646;
  --gold:#b8862e; --gold-bright:#e0aa4e;
  --text-hi:#f2efe4; --text-mid:#a7adc7; --text-dim:#6b7195;
  --ok:#1f7a4f; --warn:#b8862e; --bad:#b23b3b;
}
*{box-sizing:border-box;}
body{ margin:0; background:var(--board); color:var(--text-hi); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
h1,h2{ font-family:'Fraunces',serif; margin:0; }
.mono{ font-family:'IBM Plex Mono',monospace; }
.wrap{ max-width:1180px; margin:0 auto; padding:36px 24px 70px; }
.eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; letter-spacing:1.6px; color:var(--gold-bright); }
.title{ font-size:clamp(24px,3.6vw,32px); font-weight:600; margin-top:8px; }
.sub{ color:var(--text-mid); font-size:13.5px; margin-top:8px; line-height:1.6; }
.refresh-btn{ margin-top:14px; background:var(--gold); color:var(--ink); border:none; padding:9px 18px; border-radius:8px; font-weight:700; font-size:12.5px; cursor:pointer; font-family:inherit; }
.refresh-btn:hover{ background:var(--gold-bright); }
.refresh-btn:disabled{ opacity:0.5; cursor:not-allowed; }

.section{ margin-top:36px; }
.section-title{ font-size:16px; font-weight:600; margin-bottom:14px; display:flex; align-items:center; gap:8px; }

.status-table-wrap{ background:var(--paper); color:var(--ink); border-radius:14px; overflow-x:auto; box-shadow:0 14px 30px -18px rgba(0,0,0,0.55); }
table{ width:100%; border-collapse:collapse; font-size:13px; min-width:760px; }
th{ text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.03em; color:var(--ink-dim); font-weight:700; padding:11px 12px; border-bottom:2px solid rgba(28,33,48,0.15); background:var(--paper-2); white-space:nowrap; }
td{ padding:10px 12px; border-bottom:1px solid rgba(28,33,48,0.08); vertical-align:middle; white-space:nowrap; }
tr:last-child td{ border-bottom:none; }
.flag{ margin-right:6px; }
.stale-ok{ color:var(--ok); font-weight:700; }
.stale-warn{ color:var(--warn); font-weight:700; }
.stale-bad{ color:var(--bad); font-weight:700; }
.pill{ display:inline-block; padding:2px 9px; border-radius:10px; font-size:10.5px; font-weight:700; }
.pill.ok{ background:rgba(31,122,79,0.14); color:var(--ok); }
.pill.warn{ background:rgba(184,134,46,0.14); color:#8a5b1c; }
.pill.bad{ background:rgba(178,59,59,0.14); color:var(--bad); }

.week-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:10px; }
.week-day{ background:var(--paper); color:var(--ink); border-radius:12px; padding:14px; min-height:130px; }
.week-day-name{ font-family:'Fraunces',serif; font-weight:700; font-size:14px; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid rgba(28,33,48,0.12); }
.week-day-name.today{ color:#8a5b1c; }
.week-game-item{ font-size:11.5px; margin-bottom:8px; line-height:1.4; }
.week-game-item .wg-name{ font-weight:700; }
.week-game-item .wg-time{ color:var(--ink-dim); font-family:'IBM Plex Mono',monospace; font-size:10.5px; }
.week-empty{ color:var(--ink-dim); font-size:11px; font-style:italic; }

@media (max-width:900px){
  .week-grid{ grid-template-columns:repeat(2,1fr); }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">ADMIN · DATA STATUS</div>
  <h1 class="title">데이터 현황판</h1>
  <p class="sub">12개 게임의 현재 보유 데이터 최신회차와, 한국시간(KST) 기준 요일별 추첨 스케줄을 한눈에 봅니다.<br>이 페이지는 내부 관리용이며, 사이트 이용자에게는 노출하지 않는 것을 권장합니다.</p>
  <button class="refresh-btn" id="refreshBtn" onclick="loadStatus()">🔄 새로고침</button>

  <div class="section">
    <div class="section-title">📋 게임별 최신 데이터 현황</div>
    <div class="status-table-wrap">
      <table>
        <thead>
          <tr>
            <th>게임</th>
            <th>최신 보유 회차</th>
            <th>그 회차 추첨일</th>
            <th>경과일수</th>
            <th>정상적으로 다음 추첨 시각(KST)</th>
            <th>상태</th>
          </tr>
        </thead>
        <tbody id="statusBody">
          <tr><td colspan="6" style="text-align:center; padding:30px; color:var(--ink-dim);">불러오는 중…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="section">
    <div class="section-title">📅 요일별 추첨 스케줄 (한국시간 KST 기준)</div>
    <div class="week-grid" id="weekGrid"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://wzrqaozlbfyejsbvnrxk.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_3KrYMzwrVlbYr-e9d8UiLA_KgvSs8tC";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

// 게임별 정기 추첨 스케줄 (현지시각 기준) — race-advance.ts / 티커와 동일 데이터로 유지
const GAMES = [
  { id:'kr_lotto645',     flag:'🇰🇷', name:'한국 로또 6/45',    drawDays:[6],     h:20, min:35, tz:'Asia/Seoul' },
  { id:'us_powerball',    flag:'🇺🇸', name:'미국 파워볼',       drawDays:[1,3,6], h:22, min:59, tz:'America/New_York' },
  { id:'us_megamillions', flag:'🇺🇸', name:'미국 메가밀리언스', drawDays:[2,5],   h:23, min:0,  tz:'America/New_York' },
  { id:'eu_euromillions', flag:'🇪🇺', name:'유로밀리언스',      drawDays:[2,5],   h:20, min:45, tz:'Europe/Paris' },
  { id:'jp_miniloto',     flag:'🇯🇵', name:'일본 미니로또',     drawDays:[2],     h:18, min:45, tz:'Asia/Tokyo' },
  { id:'jp_loto7',        flag:'🇯🇵', name:'일본 로또7',        drawDays:[5],     h:18, min:45, tz:'Asia/Tokyo' },
  { id:'jp_loto6',        flag:'🇯🇵', name:'일본 로또6',        drawDays:[1,4],   h:18, min:30, tz:'Asia/Tokyo' },
  { id:'ca_lottomax',     flag:'🇨🇦', name:'캐나다 로또맥스',   drawDays:[2,5],   h:22, min:30, tz:'America/Toronto' },
  { id:'ca_lotto649',     flag:'🇨🇦', name:'캐나다 로또649',    drawDays:[3,6],   h:22, min:30, tz:'America/Toronto' },
  { id:'au_powerball',    flag:'🇦🇺', name:'호주 파워볼',       drawDays:[4],     h:20, min:30, tz:'Australia/Sydney' },
  { id:'au_ozlotto',      flag:'🇦🇺', name:'호주 오즈로또',     drawDays:[2],     h:20, min:30, tz:'Australia/Sydney' },
  { id:'au_tattslotto',   flag:'🇦🇺', name:'호주 새터데이로또', drawDays:[6],     h:20, min:30, tz:'Australia/Sydney' },
];

const WEEKDAY_NUM = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };
const KST_WEEKDAY_LABEL = ['일','월','화','수','목','금','토'];

function zonedTimeToUtc(dateStr, hour, minute, timeZone){
  const naiveUtc = new Date(`${dateStr}T${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}:00Z`);
  const tzDate = new Date(naiveUtc.toLocaleString('en-US', { timeZone }));
  const utcDate = new Date(naiveUtc.toLocaleString('en-US', { timeZone: 'UTC' }));
  const offset = utcDate.getTime() - tzDate.getTime();
  return new Date(naiveUtc.getTime() + offset);
}

// 게임의 "다음 정기 추첨 시각"을 계산 (오늘부터 최대 8일 이내에서 drawDays/시각과 일치하는 가장 이른 시점)
function nextDrawDate(g){
  const now = new Date();
  let best = null;
  for (let addDays = 0; addDays < 8; addDays++){
    const candidate = new Date(now.getTime() + addDays * 86400000);
    const wdName = new Intl.DateTimeFormat('en-US', { timeZone:g.tz, weekday:'short' }).format(candidate);
    const wd = WEEKDAY_NUM[wdName];
    if (!g.drawDays.includes(wd)) continue;
    const dateStr = new Intl.DateTimeFormat('en-CA', { timeZone:g.tz }).format(candidate);
    const drawUtc = zonedTimeToUtc(dateStr, g.h, g.min, g.tz);
    if (drawUtc > now && (!best || drawUtc < best)) best = drawUtc;
  }
  return best;
}

function fmtKst(date){
  if (!date) return '-';
  const dateStr = new Intl.DateTimeFormat('ko-KR', { timeZone:'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit' }).format(date);
  const wdName = new Intl.DateTimeFormat('en-US', { timeZone:'Asia/Seoul', weekday:'short' }).format(date);
  const wd = KST_WEEKDAY_LABEL[WEEKDAY_NUM[wdName]];
  const timeStr = new Intl.DateTimeFormat('ko-KR', { timeZone:'Asia/Seoul', hour:'2-digit', minute:'2-digit', hour12:false }).format(date);
  return `${dateStr}(${wd}) ${timeStr}`;
}

async function loadStatus(){
  const btn = document.getElementById('refreshBtn');
  const body = document.getElementById('statusBody');
  btn.disabled = true;
  body.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px; color:var(--ink-dim);">불러오는 중…</td></tr>`;

  const rows = await Promise.all(GAMES.map(async (g) => {
    const { data, error } = await sb
      .from('draw_results').select('round_no, draw_date')
      .eq('game_id', g.id).order('round_no', { ascending:false }).limit(1).maybeSingle();
    return { g, latest: (!error && data) ? data : null };
  }));

  const now = new Date();
  body.innerHTML = rows.map(({ g, latest }) => {
    const nextDraw = nextDrawDate(g);
    let daysAgo = '-', statusPill = '<span class="pill bad">데이터 없음</span>', dateCell = '-', roundCell = '-';
    if (latest) {
      roundCell = `#${latest.round_no}`;
      dateCell = latest.draw_date || '-';
      if (latest.draw_date) {
        const drawnAt = new Date(latest.draw_date + 'T00:00:00+09:00');
        const diffDays = Math.floor((now - drawnAt) / 86400000);
        daysAgo = diffDays + '일 전';
        // 그 게임의 정기 추첨 주기(가장 짧은 간격) 대비 얼마나 지났는지로 상태 판정
        const cyclesPerWeek = g.drawDays.length;
        const avgCycleDays = 7 / cyclesPerWeek;
        if (diffDays <= avgCycleDays + 1) statusPill = '<span class="pill ok">최신</span>';
        else if (diffDays <= avgCycleDays * 2 + 1) statusPill = '<span class="pill warn">확인 필요</span>';
        else statusPill = '<span class="pill bad">누락 의심</span>';
      }
    }
    return `<tr>
      <td><span class="flag">${g.flag}</span>${g.name}</td>
      <td class="mono">${roundCell}</td>
      <td class="mono">${dateCell}</td>
      <td class="mono">${daysAgo}</td>
      <td class="mono">${fmtKst(nextDraw)}</td>
      <td>${statusPill}</td>
    </tr>`;
  }).join('');

  btn.disabled = false;
}

function renderWeekGrid(){
  const grid = document.getElementById('weekGrid');
  const todayWd = WEEKDAY_NUM[new Intl.DateTimeFormat('en-US', { timeZone:'Asia/Seoul', weekday:'short' }).format(new Date())];
  const order = [1,2,3,4,5,6,0]; // 월~일 순서로 표시
  grid.innerHTML = order.map(wd => {
    // 이 KST 요일에 해당하는 게임들을 찾는다: 각 게임의 다음 4주 추첨 후보를 계산해서 KST 요일이 wd인 것들을 모음
    const matches = [];
    GAMES.forEach(g => {
      // g의 각 drawDay(현지 요일)이 KST로 변환했을 때 무슨 요일이 되는지 계산
      g.drawDays.forEach(localWd => {
        // 현지 요일이 localWd인 가까운 날짜를 하나 잡아서 KST로 변환
        const base = new Date();
        for (let i = 0; i < 14; i++){
          const cand = new Date(base.getTime() + i*86400000);
          const wdName = new Intl.DateTimeFormat('en-US', { timeZone:g.tz, weekday:'short' }).format(cand);
          if (WEEKDAY_NUM[wdName] === localWd) {
            const dateStr = new Intl.DateTimeFormat('en-CA', { timeZone:g.tz }).format(cand);
            const drawUtc = zonedTimeToUtc(dateStr, g.h, g.min, g.tz);
            const kstWdName = new Intl.DateTimeFormat('en-US', { timeZone:'Asia/Seoul', weekday:'short' }).format(drawUtc);
            const kstWd = WEEKDAY_NUM[kstWdName];
            const kstTime = new Intl.DateTimeFormat('ko-KR', { timeZone:'Asia/Seoul', hour:'2-digit', minute:'2-digit', hour12:false }).format(drawUtc);
            if (kstWd === wd) matches.push({ name: g.name, flag: g.flag, time: kstTime });
            break;
          }
        }
      });
    });
    const isToday = wd === todayWd;
    return `<div class="week-day">
      <div class="week-day-name${isToday?' today':''}">${KST_WEEKDAY_LABEL[wd]}요일${isToday?' (오늘)':''}</div>
      ${matches.length === 0 ? '<div class="week-empty">추첨 없음</div>' : matches.map(m => `
        <div class="week-game-item"><span class="wg-name">${m.flag} ${m.name}</span><br><span class="wg-time">${m.time} KST</span></div>
      `).join('')}
    </div>`;
  }).join('');
}

loadStatus();
renderWeekGrid();
</script>
</body>
</html>
