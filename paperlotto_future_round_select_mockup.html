<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>추첨대기중 복권 — PaperLotto</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --board:#0c1020; --board-2:#111731; --board-line:#242c4d;
  --paper:#f6f1e4; --ink:#1c2130; --ink-dim:#5b5646;
  --gold:#b8862e; --gold-bright:#e0aa4e;
  --text-hi:#f2efe4; --text-mid:#a7adc7; --text-dim:#6b7195;
  --err:#c65a2e;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--board); color:var(--text-hi); min-height:100vh;
  font-family:'Inter',sans-serif; word-break:keep-all;
  background-image:linear-gradient(var(--board-line) 1px, transparent 1px), linear-gradient(90deg, var(--board-line) 1px, transparent 1px);
  background-size:64px 64px;
}
h1,h2{ font-family:'Fraunces',serif; margin:0; }
a{ color:inherit; text-decoration:none; }
.mono{ font-family:'IBM Plex Mono',monospace; }

header{
  position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between;
  padding:18px 32px; border-bottom:1px solid var(--board-line); flex-wrap:wrap; gap:10px;
  background:rgba(12,16,32,0.9); backdrop-filter:blur(6px);
}
.brand{ display:flex; align-items:center; gap:10px; text-decoration:none; cursor:pointer; }
.brand-mark{ width:30px; height:30px; border-radius:6px; background:linear-gradient(135deg,var(--gold-bright),var(--gold)); display:flex; align-items:center; justify-content:center; color:var(--ink); font-weight:700; font-family:'Fraunces',serif; transform:rotate(-4deg); }
.brand-name{ font-size:17px; font-weight:600; }
.brand-name em{ font-style:normal; color:var(--gold-bright); }
nav{ display:flex; align-items:center; gap:18px; font-size:13.5px; color:var(--text-mid); }
.header-right{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
.lang-toggle{ display:flex; border:1px solid var(--board-line); border-radius:20px; overflow:hidden; flex-shrink:0; }
.lang-toggle button{ border:none; background:transparent; color:var(--text-dim); font-size:12px; font-weight:600; padding:6px 12px; cursor:pointer; font-family:'Inter',sans-serif; }
.lang-toggle button.active{ background:var(--gold); color:var(--ink); }

main{ max-width:900px; margin:0 auto; padding:28px 24px 90px; }

.page-title{ font-size:24px; font-weight:600; margin-bottom:6px; }
.page-sub{ font-size:13.5px; color:var(--text-mid); margin-bottom:22px; line-height:1.6; }

.game-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
.fr-card{
  background:var(--paper); color:var(--ink); border-radius:14px; padding:20px 22px; position:relative;
  display:flex; flex-direction:column; gap:10px; text-decoration:none;
}
.fr-card:hover{ box-shadow:0 14px 30px -18px rgba(0,0,0,0.55); }
.fr-card-top{ display:flex; align-items:center; gap:10px; }
.fr-card .flag{ font-size:22px; }
.fr-card .name{ font-size:15px; font-weight:700; }
.fr-deadline-label{ font-size:10.5px; color:var(--ink-dim); }
.fr-deadline-abs{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600; color:#8a5b1c; }
.fr-countdown{ font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:700; }
.fr-countdown.urgent{ color:var(--err); }
.fr-btn{ margin-top:4px; padding:10px; border-radius:8px; background:var(--ink); color:var(--paper); font-size:12.5px; font-weight:700; text-align:center; }

.notice{ font-size:11.5px; color:var(--text-dim); background:var(--board-2); border:1px solid var(--board-line); border-radius:8px; padding:10px 14px; margin-top:24px; line-height:1.6; }

@media (max-width:640px){
  header{ padding:14px 16px; }
  .header-right{ width:100%; align-items:flex-end; }
  nav{ width:100%; justify-content:space-between; gap:6px; font-size:11px; flex-wrap:wrap; }
  .lang-toggle button{ padding:5px 9px; font-size:11px; }
  header{ padding:14px 16px; }
  nav{ gap:10px; }
  main{ padding:20px 14px 70px; }
  .page-title{ font-size:20px; }
  .game-list{ grid-template-columns:1fr; }
}
</style>
</head>
<body>

<header>
  <a class="brand" href="paperlotto_hub_mockup.html" aria-label="PaperLotto — 홈으로">
    <div class="brand-mark">P</div>
    <div class="brand-name">Paper<em>Lotto</em></div>
  </a>
  <div class="header-right">
    <div class="lang-toggle">
      <button data-lang="ko" type="button">KR</button>
      <button data-lang="en" class="active" type="button">EN</button>
      <button data-lang="ja" type="button">JA</button>
    </div>
    <nav>
    <a href="paperlotto_hub_mockup.html" data-i18n="navBack">← 전체 게임</a>
    <div id="authWidget"></div></nav>
  </div>
</header>

<main>
  <div class="page-title" data-i18n="pageTitle">현재 판매중 · 추첨대기중</div>
  <div class="page-sub" data-i18n="pageSub">아직 추첨 전인 회차에 도전합니다. 게임을 골라 등록마감까지 남은 시간을 확인하고 번호를 등록하세요.</div>

  <div class="game-list" id="gameList"></div>

  <div class="notice" data-i18n="notice">등록마감시각은 PaperLotto가 안내하는 참고용 기준이며, 실제 판매처의 마감시각과 다를 수 있습니다.</div>
</main>

<script>
// ─── 언어 ───────────────────────────────────────────────
let currentLang = localStorage.getItem('paperlotto_lang') || 'en';
const i18n = {
  ko: {
    navBack:"← 전체 게임",
    pageTitle:"현재 판매중 · 추첨대기중",
    pageSub:"아직 추첨 전인 회차에 도전합니다. 게임을 골라 등록마감까지 남은 시간을 확인하고 번호를 등록하세요.",
    notice:"등록마감시각은 PaperLotto가 안내하는 참고용 기준이며, 실제 판매처의 마감시각과 다를 수 있습니다.",
    deadlineLabel:"등록마감", btnRegister:"번호 등록하기 →", unitDay:"일", unitHour:"시간", unitMin:"분",
    tzLabel:"현지시간",
  },
  en: {
    navBack:"← All Games",
    pageTitle:"On Sale · Awaiting Draw",
    pageSub:"Challenge a round that hasn't been drawn yet. Pick a game, check the time left to register, and enter your numbers.",
    notice:"Deadline times are PaperLotto's own reference estimates and may differ from the actual retailer cutoff.",
    deadlineLabel:"Registration closes", btnRegister:"Register numbers →", unitDay:"d", unitHour:"h", unitMin:"m",
    tzLabel:"local time",
  },
  ja: {
    navBack:"← 全ゲーム",
    pageTitle:"販売中・抽選待ち",
    pageSub:"まだ抽選されていない回に挑戦します。ゲームを選んで登録締切までの残り時間を確認し、番号を登録しましょう。",
    notice:"登録締切時刻はPaperLottoが案内する参考基準であり、実際の販売元の締切時刻と異なる場合があります。",
    deadlineLabel:"登録締切", btnRegister:"番号を登録する →", unitDay:"日", unitHour:"時間", unitMin:"分",
    tzLabel:"現地時間",
  },
};

function applyLang(lang){
  currentLang = i18n[lang] ? lang : 'en';
  localStorage.setItem('paperlotto_lang', currentLang);
  document.documentElement.lang = currentLang;
  const t = i18n[currentLang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (typeof t[key] === 'string') el.innerHTML = t[key];
  });
  document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
  renderGameList();
}
document.querySelectorAll('.lang-toggle button').forEach(btn => btn.addEventListener('click', () => applyLang(btn.dataset.lang)));

// ─── 게임별 추첨요일/추첨시각/등록마감시각 (12개 상세페이지의 GAME 객체와 동일한 값) ───
const GAMES = [
  { id:'kr_lotto645',     flag:'🇰🇷', nameKo:'한국 로또 6/45',              nameEn:'Korea Lotto 6/45',            nameJa:'韓国ロト6/45',              drawDays:[6],   drawTime:{h:20,min:35}, cutoffTime:{h:20,min:0},  timeZone:'Asia/Seoul' },
  { id:'us_powerball',    flag:'🇺🇸', nameKo:'파워볼',                       nameEn:'Powerball',                    nameJa:'パワーボール',                drawDays:[1,3,6], drawTime:{h:22,min:59}, cutoffTime:{h:22,min:0},  timeZone:'America/New_York' },
  { id:'us_megamillions', flag:'🇺🇸', nameKo:'메가밀리언스',                  nameEn:'Mega Millions',                nameJa:'メガミリオンズ',              drawDays:[2,5], drawTime:{h:23,min:0},  cutoffTime:{h:22,min:45}, timeZone:'America/New_York' },
  { id:'eu_euromillions', flag:'🇪🇺', nameKo:'유로밀리언스',                  nameEn:'EuroMillions',                 nameJa:'ユーロミリオンズ',            drawDays:[2,5], drawTime:{h:21,min:0},  cutoffTime:{h:19,min:30}, timeZone:'Europe/Paris' },
  { id:'jp_loto6',        flag:'🇯🇵', nameKo:'일본 로또6',                   nameEn:'Japan Loto 6',                 nameJa:'ロト6',                     drawDays:[1,4], drawTime:{h:18,min:30}, cutoffTime:{h:18,min:20}, timeZone:'Asia/Tokyo' },
  { id:'jp_loto7',        flag:'🇯🇵', nameKo:'일본 로또7',                   nameEn:'Japan Loto 7',                 nameJa:'ロト7',                     drawDays:[5],   drawTime:{h:18,min:45}, cutoffTime:{h:18,min:30}, timeZone:'Asia/Tokyo' },
  { id:'jp_miniloto',     flag:'🇯🇵', nameKo:'일본 미니로또',                 nameEn:'Japan Mini Loto',              nameJa:'ミニロト',                   drawDays:[2],   drawTime:{h:18,min:45}, cutoffTime:{h:18,min:20}, timeZone:'Asia/Tokyo' },
  { id:'ca_lotto649',     flag:'🇨🇦', nameKo:'캐나다 로또 6/49',              nameEn:'Canada Lotto 6/49',            nameJa:'カナダ ロト6/49',            drawDays:[3,6], drawTime:{h:22,min:30}, cutoffTime:{h:22,min:30}, timeZone:'America/Toronto' },
  { id:'ca_lottomax',     flag:'🇨🇦', nameKo:'캐나다 로또맥스',               nameEn:'Canada Lotto Max',             nameJa:'カナダ ロトマックス',        drawDays:[2,5], drawTime:{h:22,min:30}, cutoffTime:{h:22,min:30}, timeZone:'America/Toronto' },
  { id:'au_powerball',    flag:'🇦🇺', nameKo:'호주 파워볼',                   nameEn:'Australia Powerball',          nameJa:'豪パワーボール',              drawDays:[4],   drawTime:{h:20,min:30}, cutoffTime:{h:19,min:30}, timeZone:'Australia/Sydney' },
  { id:'au_ozlotto',      flag:'🇦🇺', nameKo:'호주 오즈로또',                 nameEn:'Australia Oz Lotto',           nameJa:'オズロト',                   drawDays:[2],   drawTime:{h:20,min:30}, cutoffTime:{h:19,min:30}, timeZone:'Australia/Sydney' },
  { id:'au_tattslotto',   flag:'🇦🇺', nameKo:'새터데이로또(Tatts Lotto)',      nameEn:'Saturday Lotto (Tatts Lotto)', nameJa:'サタデーロト（Tatts Lotto）', drawDays:[6],   drawTime:{h:20,min:30}, cutoffTime:{h:19,min:30}, timeZone:'Australia/Sydney' },
];

function nameKey(){ return currentLang === 'ko' ? 'nameKo' : currentLang === 'ja' ? 'nameJa' : 'nameEn'; }

// ─── 다음 추첨/마감 시각 계산 (12개 상세페이지의 로직과 동일) ───
function zonedTodayParts(timeZone){
  const dtf = new Intl.DateTimeFormat('en-US', { timeZone, year:'numeric', month:'2-digit', day:'2-digit' });
  const p = Object.fromEntries(dtf.formatToParts(new Date()).map(x => [x.type, x.value]));
  return { y:+p.year, m:+p.month, d:+p.day };
}
function zonedToUtc(y, m, d, h, min, timeZone){
  const guess = new Date(Date.UTC(y, m-1, d, h, min));
  const dtf = new Intl.DateTimeFormat('en-US', { timeZone, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false });
  const p = Object.fromEntries(dtf.formatToParts(guess).map(x => [x.type, x.value]));
  const observed = Date.UTC(+p.year, +p.month-1, +p.day, +p.hour === 24 ? 0 : +p.hour, +p.minute);
  const diff = guess.getTime() - observed;
  return new Date(guess.getTime() + diff);
}
function findOccurrences(drawDays, h, min, timeZone){
  const today = zonedTodayParts(timeZone);
  const base = new Date(Date.UTC(today.y, today.m-1, today.d));
  const list = [];
  for (let off=-8; off<=8; off++){
    const cand = new Date(base.getTime() + off*86400000);
    const wd = cand.getUTCDay();
    if (drawDays.includes(wd)) {
      const y = cand.getUTCFullYear(), m = cand.getUTCMonth()+1, d = cand.getUTCDate();
      list.push(zonedToUtc(y, m, d, h, min, timeZone));
    }
  }
  return list.sort((a,b)=>a-b);
}
function fmtCountdown(diffMs){
  const t = i18n[currentLang];
  if (diffMs <= 0) return '0:00:00';
  const d = Math.floor(diffMs/86400000), h = Math.floor((diffMs%86400000)/3600000);
  const m = Math.floor((diffMs%3600000)/60000), s = Math.floor((diffMs%60000)/1000);
  return d>0 ? `${d}${t.unitDay} ${h}${t.unitHour} ${m}${t.unitMin}` : `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function fmtAbsolute(dt, timeZone, tzLabel){
  const locale = currentLang === 'ko' ? 'ko-KR' : currentLang === 'ja' ? 'ja-JP' : 'en-US';
  const dtf = new Intl.DateTimeFormat(locale, { timeZone, month:'long', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false });
  return `${dtf.format(dt)} (${tzLabel})`;
}

function computeNextCutoff(game){
  const now = Date.now();
  const draws = findOccurrences(game.drawDays, game.drawTime.h, game.drawTime.min, game.timeZone);
  const cutoffs = findOccurrences(game.drawDays, game.cutoffTime.h, game.cutoffTime.min, game.timeZone);
  let idx = draws.findIndex(d => d.getTime() > now);
  if (idx === -1) idx = draws.length - 1;
  let cutoff = cutoffs[idx];
  // 이미 이번 회차 마감이 지났으면 다음 회차 마감으로 넘어감
  if (cutoff.getTime() <= now && idx < draws.length - 1) {
    idx += 1;
    cutoff = cutoffs[idx];
  }
  return cutoff;
}

function renderGameList(){
  const t = i18n[currentLang];
  const list = document.getElementById('gameList');
  list.innerHTML = GAMES.map(g => {
    const cutoff = computeNextCutoff(g);
    const diff = cutoff.getTime() - Date.now();
    const urgent = diff < 3 * 3600000; // 3시간 이내면 강조
    return `<a class="fr-card" href="paperlotto_register_mockup.html?game=${g.id}" data-id="${g.id}">
      <div class="fr-card-top"><span class="flag">${g.flag}</span><span class="name">${g[nameKey()]}</span></div>
      <div class="fr-deadline-label">${t.deadlineLabel}</div>
      <div class="fr-deadline-abs">${fmtAbsolute(cutoff, g.timeZone, t.tzLabel)}</div>
      <div class="fr-countdown mono ${urgent?'urgent':''}" data-id="${g.id}">${fmtCountdown(diff)}</div>
      <div class="fr-btn">${t.btnRegister}</div>
    </a>`;
  }).join('');
}

function tickCountdowns(){
  GAMES.forEach(g => {
    const el = document.querySelector(`.fr-countdown[data-id="${g.id}"]`);
    if (!el) return;
    const cutoff = computeNextCutoff(g);
    const diff = cutoff.getTime() - Date.now();
    el.textContent = fmtCountdown(diff);
    el.classList.toggle('urgent', diff < 3 * 3600000);
  });
}

applyLang(currentLang);
setInterval(tickCountdowns, 1000);
</script>
</body>
</html>
