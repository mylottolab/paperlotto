const PAYOUT_NOTE_TRANSLATIONS = [
  {

    build: (m) => ({
      en: `No one bet on the higher-ranked horses ahead of it, so the payout went to the highest rank that actually had bettors — rank ${m[1]} (horse #${m[2]}).`,
      ja: `それより上位の馬には誰もベットしていなかったため、実際にベットがあった最上位の順位（${m[1]}着馬・#${m[2]}）に配当されました。`,
    }),
  },
  {
    // 구버전(2026-08-10 이전) 정산 기록 호환용 — 예전에 이 문구로 이미 정산된 과거 베팅내역이
    // 남아있을 수 있어 계속 지원한다 (신규 정산에는 더 이상 쓰이지 않음).
    match: /1등마에\s*베팅한\s*사람이\s*없/,
    en: 'No one bet on the winning horse, so the entire prize pool was refunded to all participants of this race in proportion to their bets.',
    ja: '1着馬にベットした人がいなかったため、賞金プール全額がこのレースの全参加者にベット比率に応じて返金されました。',
  },
];
function translatePayoutNote(note){
  if (!note) return note;
  if (currentLang === 'ko') return note;
  for (const item of PAYOUT_NOTE_TRANSLATIONS) {
    const m = item.match.exec(note);
    if (m) {
      if (item.build) { const r = item.build(m); return r[currentLang] || note; }
      return item[currentLang] || note;
    }
  }
  return note; // 알려지지 않은 문구는 원문 그대로(폴백)
}
function nameKey(){ return currentLang === 'ko' ? 'nameKo' : currentLang === 'ja' ? 'nameJa' : 'nameEn'; }

function applyStaticI18n(){
  const tt = t();
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (typeof tt[key] === 'string') el.textContent = tt[key];
  });
}

async function loadMyBets(){
  const tt = t();
  const statusEl = document.getElementById('boardStatus');
  const bodyEl = document.getElementById('boardBody');
  statusEl.textContent = tt.loading;
  bodyEl.innerHTML = '';

  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    document.getElementById('summaryRow').style.display = 'none';
    bodyEl.innerHTML = `<tr><td colspan="8"><div class="login-note">${tt.loginRequired}<br><a href="paperlotto_login_mockup.html">${tt.loginLink}</a></div></td></tr>`;
    statusEl.textContent = '';
    return;
  }

  try {
    const { data: bets, error: betErr } = await sb
      .from('race_bets')
      .select('*, races(game_id, round_no, status)')
      .eq('user_id', session.user.id)
      .order('created_at', { ascending: false });
    if (betErr) throw betErr;

    // 표시에 필요한 (game_id, horse_no) 조합의 말 이름을 한 번에 조회
    const pairs = [...new Set((bets || []).map(b => `${b.races?.game_id}::${b.horse_no}`))];
    const horseNameMap = {};
    if (pairs.length > 0) {
      const gameIds = [...new Set((bets || []).map(b => b.races?.game_id).filter(Boolean))];
      const { data: horses } = await sb.from('race_horses').select('game_id, horse_no, name').in('game_id', gameIds);
      (horses || []).forEach(h => { horseNameMap[`${h.game_id}::${h.horse_no}`] = h.name; });
    }

    allBets = (bets || []).map(b => ({
      ...b,
      game_id: b.races?.game_id,
      round_no: b.races?.round_no,
      horse_name: horseNameMap[`${b.races?.game_id}::${b.horse_no}`] || `#${b.horse_no}`,
    }));

    renderSummary();
    renderTable();
  } catch (e) {
    console.error(e);
    statusEl.textContent = tt.loadError;
  }
}

function renderSummary(){
  const tt = t();
  const totalBets = allBets.length;
  const totalSpent = allBets.reduce((s,b) => s + (b.amount_points||0), 0);
  const totalWon = allBets.reduce((s,b) => s + (b.payout_points||0), 0);
  const net = totalWon - totalSpent;
  document.getElementById('summaryRow').style.display = totalBets > 0 ? 'grid' : 'none';
  document.getElementById('scTotalBets').textContent = totalBets.toLocaleString();
  document.getElementById('scTotalSpent').textContent = totalSpent.toLocaleString() + 'P';
  document.getElementById('scTotalWon').textContent = totalWon.toLocaleString() + 'P';
  const netEl = document.getElementById('scNet');
  netEl.textContent = (net >= 0 ? '+' : '') + net.toLocaleString() + 'P';
  netEl.className = 'sc-value ' + (net >= 0 ? 'pos' : 'neg');
}

function renderTable(){
  const tt = t();
  const rows = allBets.filter(b => currentFilter === 'all' || b.status === currentFilter || (currentFilter === 'placed' && b.status === 'placed'));
  const bodyEl = document.getElementById('boardBody');
  const statusEl = document.getElementById('boardStatus');
  statusEl.textContent = tt.statusLine(rows.length);

  if (rows.length === 0) {
    bodyEl.innerHTML = `<tr><td colspan="8" class="empty-note">${tt.noData}</td></tr>`;
    return;
  }
  bodyEl.innerHTML = rows.map(b => {
    const meta = GAME_META[b.game_id] || { flag:'🎟️', nameKo:b.game_id, nameEn:b.game_id, nameJa:b.game_id };
    const dateStr = new Date(b.created_at).toLocaleString(currentLang === 'ko' ? 'ko-KR' : currentLang === 'ja' ? 'ja-JP' : 'en-US');
    const statusCls = b.status === 'won' ? 'won' : b.status === 'lost' ? 'lost' : 'pending';
    const statusLabel = b.status === 'won' ? tt.statusWon : b.status === 'lost' ? tt.statusLost : tt.statusPending;
    const payoutCell = b.status === 'won'
      ? `<span class="payout-cell win">+${(b.payout_points||0).toLocaleString()}P</span>${b.payout_note ? `<div class="payout-note">${translatePayoutNote(b.payout_note)}</div>` : ''}`
      : (b.status === 'lost' ? '<span class="payout-cell">0P</span>' : '-');
    return `<tr class="${b.status==='won'?'is-win':''}">
      <td class="mono">${dateStr}</td>
      <td><span class="flag">${meta.flag}</span>${meta[nameKey()]}</td>
      <td class="mono">#${b.round_no ?? '-'}</td>
      <td class="horse-name"><span class="no">#${b.horse_no}</span>${b.horse_name}</td>
      <td class="mono">${b.units}</td>
      <td class="mono">${(b.amount_points||0).toLocaleString()}P</td>
      <td><span class="status-pill ${statusCls}">${statusLabel}</span></td>
      <td>${payoutCell}</td>
    </tr>`;
  }).join('');
}

document.getElementById('statusFilter').addEventListener('change', (e) => {
  currentFilter = e.target.value;
  renderTable();
});

function applyLang(lang){
  currentLang = I18N[lang] ? lang : 'ko';
  localStorage.setItem('paperlotto_lang', currentLang);
  document.documentElement.lang = currentLang;
  applyStaticI18n();
  document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
  if (allBets.length > 0 || document.getElementById('boardBody').children.length === 0) loadMyBets();
  if (typeof renderTicker === 'function') renderTicker();
}
document.querySelectorAll('.lang-toggle button').forEach(btn => {
  btn.addEventListener('click', () => applyLang(btn.dataset.lang));
});

const TICKER_WEEKDAY_NUM = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };
function tkZonedTimeToUtc(dateStr, hour, minute, timeZone){
  const naiveUtc = new Date(`${dateStr}T${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}:00Z`);
  const tzDate = new Date(naiveUtc.toLocaleString('en-US', { timeZone }));
  const utcDate = new Date(naiveUtc.toLocaleString('en-US', { timeZone: 'UTC' }));
  const offset = utcDate.getTime() - tzDate.getTime();
  return new Date(naiveUtc.getTime() + offset);
}
function tkNextDrawDate(days, hour, minute, timeZone){
  const now = new Date();
  let best = null;
  for (let addDays = 0; addDays < 8; addDays++){
    const candidate = new Date(now.getTime() + addDays * 86400000);
    const wdName = new Intl.DateTimeFormat('en-US', { timeZone, weekday: 'short' }).format(candidate);
    const wd = TICKER_WEEKDAY_NUM[wdName];
    if (!days.includes(wd)) continue;
    const dateStr = new Intl.DateTimeFormat('en-CA', { timeZone }).format(candidate);
    const drawUtc = tkZonedTimeToUtc(dateStr, hour, minute, timeZone);
    if (drawUtc > now && (!best || drawUtc < best)) best = drawUtc;
  }
  return best;
}
function tkFmtCountdown(target){
  const dayLabel = currentLang === 'ko' ? '일' : currentLang === 'ja' ? '日' : 'd';
  const hourLabel = currentLang === 'ko' ? '시간' : currentLang === 'ja' ? '時間' : 'h';
  const diff = Math.max(0, target - new Date());
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  return d > 0 ? `${d}${dayLabel} ${h}${hourLabel}` : `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
TICKER_GAMES.forEach(g => { g.next = tkNextDrawDate(g.days, g.drawHour, g.drawMinute, g.tz); });

      <span class="odds mono">1/${g.odds}</span>
      <span class="cd mono" data-tcd="${g.id}">${tkFmtCountdown(g.next)}</span>
    </div>`).join('');
  const track = document.getElementById('tickerTrack');
  if (track) track.innerHTML = items + items;
}
