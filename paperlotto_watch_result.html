<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>당첨결과 — PaperLotto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --board:#0c1020; --board-2:#111731; --board-line:#242c4d;
  --gold:#b8862e; --gold-bright:#e0aa4e;
  --text-hi:#f2efe4; --text-mid:#a7adc7; --text-dim:#6b7195;
  --ok:#3f9d6d; --bad:#d15b48;
}
body.light-mode{
  --board:#f2efe4; --board-2:#e8e2d0; --board-line:#d9d1ba;
  --gold:#a8781f; --gold-bright:#c9932e;
  --text-hi:#1c2130; --text-mid:#4c5372; --text-dim:#7a7f9a;
}
*{box-sizing:border-box;}
body{ margin:0; background:var(--board); color:var(--text-hi); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }

.header{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--board-line); flex-wrap:wrap; gap:10px; }
.brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; }
.brand-mark{ width:32px; height:32px; border-radius:9px; background:var(--gold); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-family:'Fraunces',serif; }
.brand-name{ font-size:15px; font-weight:700; }
.header-right{ display:flex; align-items:center; gap:8px; }
.lang-toggle{ display:flex; border:1px solid var(--board-line); border-radius:20px; overflow:hidden; }
.lang-toggle button{ border:none; background:transparent; color:var(--text-dim); font-size:12px; font-weight:600; padding:5px 10px; cursor:pointer; font-family:'Inter',sans-serif; }
.lang-toggle button.active{ background:var(--gold); color:#fff; }
.theme-toggle{ border:1px solid var(--board-line); background:transparent; color:var(--text-mid); width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:13px; }

main{ max-width:720px; margin:0 auto; padding:24px 16px 80px; }
.card{ background:var(--board-2); border:1px solid var(--board-line); border-radius:16px; padding:18px; margin-bottom:14px; }

/* ── 집계표 — 맨 위 ──
   푸시나 메일을 누르고 들어온 손님은 "됐어? 안 됐어?"만 급합니다.
   50줄이면 스크롤이 길어 아래에 두면 못 찾습니다. */
.verdict{ text-align:center; padding:26px 18px; }
.verdict.jackpot{ background:linear-gradient(160deg, rgba(184,134,46,.22), rgba(184,134,46,.06)); border-color:var(--gold); }
.verdict-icon{ font-size:34px; line-height:1; margin-bottom:10px; }
.verdict-title{ font-family:'Fraunces',serif; font-size:23px; font-weight:700; margin-bottom:8px; }
.verdict-sub{ font-size:13.5px; color:var(--text-mid); line-height:1.7; }

.tally{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:16px; }
.tally-chip{ border:1px solid var(--board-line); border-radius:999px; padding:6px 13px; font-size:12.5px; font-family:'IBM Plex Mono',monospace; color:var(--text-mid); }
.tally-chip.win{ border-color:var(--gold); color:var(--gold-bright); font-weight:700; }

.meta{ font-size:13px; color:var(--text-dim); line-height:2; }
.meta .row{ display:flex; justify-content:space-between; gap:12px; }
.meta .v{ color:var(--text-hi); font-family:'IBM Plex Mono',monospace; }

.sec-title{ font-size:13px; font-weight:600; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
.sort-btn{ border:1px solid var(--board-line); background:transparent; color:var(--text-mid); border-radius:999px; padding:5px 12px; font-size:11.5px; font-weight:600; cursor:pointer; font-family:inherit; }

/* ── 번호 동그라미 ──
   🔴 색만으로 구분하지 않습니다. 색약이 스무 명 중 한 명입니다.
      채우기·테두리·굵기를 함께 바꿔 색을 못 봐도 구분되게 합니다. */
.ball{ width:32px; height:32px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
       font-size:13px; font-weight:600; font-family:'IBM Plex Mono',monospace;
       background:transparent; border:1.5px solid var(--board-line); color:var(--text-dim); }
.ball.hit{ background:var(--gold); border:2px solid var(--gold); color:#fff; font-weight:800; }
.ball.bonushit{ background:transparent; border:2px dashed var(--gold-bright); color:var(--gold-bright); font-weight:800; }
.ball.sep{ border-style:dashed; }

.line-row{ display:flex; align-items:center; gap:6px; padding:9px 0; border-bottom:1px solid var(--board-line); flex-wrap:wrap; }
.line-row:last-child{ border-bottom:none; }
.line-row.won{ background:rgba(184,134,46,.07); border-radius:10px; padding-left:8px; padding-right:8px; }
.line-tag{ width:20px; flex-shrink:0; font-size:11px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace; }
.plus{ color:var(--text-dim); font-size:15px; padding:0 2px; }
.grade-tag{ margin-left:auto; font-size:12px; font-weight:700; font-family:'IBM Plex Mono',monospace; color:var(--gold-bright); white-space:nowrap; }
.grade-tag.lose{ color:var(--text-dim); font-weight:500; }
.prize{ font-size:11px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace; margin-left:6px; }

.win-nums{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }

.notice{ font-size:12px; color:var(--text-dim); line-height:1.7; margin-top:14px; padding:12px 14px; border:1px dashed var(--board-line); border-radius:10px; }
.msg{ font-size:13.5px; padding:14px; border-radius:10px; line-height:1.7; }
.msg.bad{ background:rgba(209,91,72,.12); color:var(--bad); border:1px solid rgba(209,91,72,.3); }
button.ghost{ width:100%; border:1px solid var(--board-line); border-radius:12px; padding:13px; font-size:14px; font-weight:600; cursor:pointer; background:transparent; color:var(--text-mid); font-family:inherit; margin-top:10px; text-decoration:none; display:block; text-align:center; }
.hidden{ display:none !important; }
.loading{ text-align:center; color:var(--text-dim); font-size:13px; padding:40px 0; }

@media (max-width:430px){
  .ball{ width:28px; height:28px; font-size:12px; }
}
</style>
</head>
<body>
<script>(function(){ if (localStorage.getItem('paperlotto_theme') === 'light') document.body.classList.add('light-mode'); })();</script>

<div class="header">
  <a class="brand" href="index.html">
    <div class="brand-mark">P</div>
    <div class="brand-name">PaperLotto</div>
  </a>
  <div class="header-right">

      <button data-lang="ja" type="button">JA</button>

</div>

<main>
  <div class="loading" id="loadingBox">…</div>

  <div id="content" class="hidden">
    <!-- 집계표 -->

      <div class="verdict-sub" id="verdictSub"></div>

    <div class="card">
      <div class="sec-title" id="winTitle"></div>
      <div class="win-nums" id="winNums"></div>
    </div>

    <!-- 내 번호 -->
    <div class="card">
      <div class="sec-title">
        <span id="myTitle"></span>
        <button class="sort-btn" id="sortBtn"></button>
      </div>
      <div id="linesBox"></div>
    </div>

    <div class="card meta" id="metaBox"></div>

  </div>
</main>

<script>
// =====================================================
// PaperLotto — 당첨결과 확인 화면
// 2026-08-30 (15차) 신설
//
// 알림 메일의 단추가 이 화면으로 옵니다: ?entry=<watch_entries.id>
//
// 🔴 화면 구성 (설계문서 8절):
//   · 집계표를 맨 위에 둡니다. 알림을 누르고 온 손님은 "됐어? 안 됐어?"만 급합니다.
//     50줄이면 스크롤이 길어 아래에 두면 결론을 못 찾습니다.
//   · 당첨된 줄을 위로 올립니다. 3등이 37번째 줄에 있으면 못 찾습니다.
//     원래 순서를 보고 싶은 분을 위해 "등록순으로 보기"를 함께 둡니다.
//   · 색만으로 구분하지 않습니다(색약 대비). 채우기·테두리·굵기를 함께 바꿉니다.
//
// ⚠ 채점은 하지 않습니다. watch_results에 저장된 결과를 보여줄 뿐입니다.
//   채점 규칙 복사본을 늘리지 않기 위해서입니다(이미 네 곳).
//   여기서 다시 채점하면 메일과 화면이 다른 답을 낼 수 있습니다.
// =====================================================

const SUPABASE_URL = 'https://wzrqaozlbfyejsbvnrxk.supabase.co';
const SUPABASE_ANON = 'sb_publishable_3KrYMzwrVlbYr-e9d8UiLA_KgvSs8tC';

// 회차를 쓰지 않는 종목은 추첨일로 부릅니다 (그 나라 손님은 회차를 모릅니다)
const GAMES = {
  kr_lotto645:     { bonus:0, roundLabel:true,  ko:'한국 로또 6/45',   en:'Korea Lotto 6/45',   ja:'韓国ロト6/45' },
  us_powerball:    { bonus:1, roundLabel:false, ko:'미국 파워볼',       en:'US Powerball',       ja:'アメリカ・パワーボール' },
  us_megamillions: { bonus:1, roundLabel:false, ko:'메가밀리언스',      en:'Mega Millions',      ja:'メガミリオンズ' },
  eu_euromillions: { bonus:2, roundLabel:false, ko:'유로밀리언스',      en:'EuroMillions',       ja:'ユーロミリオンズ' },
  jp_miniloto:     { bonus:0, roundLabel:true,  ko:'일본 미니로또',     en:'Mini Loto',          ja:'ミニロト' },
  jp_loto7:        { bonus:0, roundLabel:true,  ko:'일본 로또7',        en:'Loto 7',             ja:'ロト7' },
  jp_loto6:        { bonus:0, roundLabel:true,  ko:'일본 로또6',        en:'Loto 6',             ja:'ロト6' },
  ca_lottomax:     { bonus:0, roundLabel:true,  ko:'캐나다 로또맥스',   en:'Lotto Max',          ja:'ロトマックス' },
  ca_lotto649:     { bonus:0, roundLabel:true,  ko:'캐나다 로또 6/49',  en:'Lotto 6/49',         ja:'カナダ・ロト6/49' },
  au_powerball:    { bonus:1, roundLabel:false, ko:'호주 파워볼',       en:'Australia Powerball',ja:'豪パワーボール' },
  au_ozlotto:      { bonus:0, roundLabel:true,  ko:'오즈로또',          en:'Oz Lotto',           ja:'オズロト' },
  au_tattslotto:   { bonus:0, roundLabel:true,  ko:'새터데이 로또',     en:'Saturday Lotto',     ja:'サタデーロト' },
};

const CURRENCY = {
  kr_lotto645:'원', us_powerball:'USD', us_megamillions:'USD', eu_euromillions:'EUR',
  jp_loto6:'엔', jp_loto7:'엔', jp_miniloto:'엔',
  ca_lotto649:'CAD', ca_lottomax:'CAD',
  au_powerball:'AUD', au_ozlotto:'AUD', au_tattslotto:'AUD',
};

const T = {
  ko: {
    jackpotIcon:'🎉', smallIcon:'🎯', noneIcon:'📋',
    jackpotTitle:'{g}등 당첨입니다!', smallTitle:'{g}등 당첨', noneTitle:'결과를 확인해드렸습니다',
    subWin:'등록하신 {total}줄 중 {win}줄이 맞았습니다.',
    subNone:'등록하신 {total}줄을 모두 확인해드렸습니다. 이번엔 아쉽네요.',
    chipGrade:'{g}등 {n}줄', chipLose:'나머지 {n}줄',
    winTitle:'당첨번호', myTitle:'내 번호',
    sortByGrade:'등록순으로 보기', sortByOrder:'당첨순으로 보기',
    lose:'—', gradeTag:'{g}등',
    metaGame:'종목', metaRound:'추첨', metaLines:'줄 수', metaPoints:'차감 포인트', metaWhen:'등록일',
    roundValue:'{n}회차',
    notice:'당첨금은 회차마다 다르고 발표가 늦어질 수 있습니다. 정확한 금액과 수령 방법은 복권 발행처를 확인해주세요.<br>PaperLotto는 복권을 판매하거나 상금을 지급하지 않습니다.',
    again:'다른 복권도 등록하기',
    errNoEntry:'등록 내역을 찾을 수 없습니다. 주소가 올바른지 확인해주세요.',
    errLogin:'로그인이 필요합니다. 로그인 후 다시 열어주세요.',
    errNoResult:'아직 채점 전입니다. 추첨 결과가 확인되면 알려드립니다.',
    errEtc:'결과를 불러오지 못했습니다: {msg}',
    loading:'불러오는 중…',
  },
  en: {
    jackpotIcon:'🎉', smallIcon:'🎯', noneIcon:'📋',
    jackpotTitle:'Tier {g} winner!', smallTitle:'Tier {g}', noneTitle:'We checked your numbers',
    subWin:'{win} of your {total} line(s) won.',
    subNone:'We checked all {total} of your line(s). No luck this time.',
    chipGrade:'Tier {g} × {n}', chipLose:'{n} no win',
    winTitle:'Winning numbers', myTitle:'Your numbers',
    sortByGrade:'Show in entry order', sortByOrder:'Show winners first',
    lose:'—', gradeTag:'Tier {g}',
    metaGame:'Game', metaRound:'Draw', metaLines:'Lines', metaPoints:'Points', metaWhen:'Registered',
    roundValue:'Draw #{n}',
    notice:'Prize amounts vary by draw and may be announced late. Please check with the official lottery operator for exact amounts and how to claim.<br>PaperLotto does not sell tickets or pay out prizes.',
    again:'Register another ticket',
    errNoEntry:'We could not find that registration. Please check the link.',
    errLogin:'Please sign in and open this page again.',
    errNoResult:'Not graded yet. We will let you know once the draw result is confirmed.',
    errEtc:'Could not load the result: {msg}',
    loading:'Loading…',
  },
  ja: {
    jackpotIcon:'🎉', smallIcon:'🎯', noneIcon:'📋',
    jackpotTitle:'{g}等当選です！', smallTitle:'{g}等当選', noneTitle:'結果を確認しました',
    subWin:'ご登録の{total}行のうち{win}行が的中しました。',
    subNone:'ご登録の{total}行すべてを確認しました。今回は残念でした。',
    chipGrade:'{g}等 {n}行', chipLose:'残り{n}行',
    winTitle:'当選番号', myTitle:'自分の番号',
    sortByGrade:'登録順で見る', sortByOrder:'当選順で見る',
    lose:'—', gradeTag:'{g}等',
    metaGame:'種目', metaRound:'抽選', metaLines:'行数', metaPoints:'消費ポイント', metaWhen:'登録日',
    roundValue:'第{n}回',
    notice:'賞金額は回ごとに異なり、発表が遅れることがあります。正確な金額と受取方法は宝くじ発行元にご確認ください。<br>PaperLottoは宝くじの販売や賞金の支払いを行いません。',
    again:'ほかの宝くじも登録する',
    errNoEntry:'登録内容が見つかりません。リンクをご確認ください。',
    errLogin:'ログインが必要です。ログイン後にもう一度開いてください。',
    errNoResult:'まだ採点前です。抽選結果が確認でき次第お知らせします。',
    errEtc:'結果を読み込めませんでした: {msg}',
    loading:'読み込み中…',
  },
};

let lang = localStorage.getItem('paperlotto_lang') || 'ko';
if (!T[lang]) lang = 'ko';

const entryId = new URLSearchParams(location.search).get('entry');
let entry = null, result = null, draw = null;
let sortByGrade = true;   // 기본은 당첨된 줄 먼저

const $ = (id) => document.getElementById(id);
const t = () => T[lang];
function fill(tpl, v){ return String(tpl).replace(/\{(\w+)\}/g, (_, k) => (v[k] !== undefined ? v[k] : '')); }

function getAccessToken(){
  try {
    const key = Object.keys(localStorage).find(k => k.startsWith('sb-') && k.endsWith('-auth-token'));
    if (!key) return null;
    const obj = JSON.parse(localStorage.getItem(key));
    return obj.access_token || (obj.currentSession && obj.currentSession.access_token) || null;
  } catch (e) { return null; }
}

async function rest(path, token){
  const headers = { apikey: SUPABASE_ANON };
  if (token) headers.Authorization = 'Bearer ' + token;
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, { headers });
  if (!res.ok) throw new Error(res.status + ' ' + (await res.text()).slice(0, 160));
  return res.json();
}

function showError(text){
  $('loadingBox').classList.add('hidden');
  $('content').classList.add('hidden');
  $('errBox').classList.remove('hidden');
  $('errMsg').innerHTML = text;
}

// ── 표시용 이름 ──
function gameName(id){ const g = GAMES[id]; return g ? g[lang] : id; }

function formatDate(ymd){
  if (!ymd) return null;
  const d = new Date(String(ymd).slice(0,10) + 'T00:00:00Z');
  if (isNaN(d.getTime())) return null;
  const locale = lang === 'ko' ? 'ko-KR' : (lang === 'ja' ? 'ja-JP' : 'en-US');
  return d.toLocaleDateString(locale, { timeZone:'UTC', year:'numeric', month:'long', day:'numeric', weekday:'short' });
}

function drawLabel(){
  const g = GAMES[entry.game_id];
  const dateTxt = formatDate(draw ? draw.draw_date : entry.draw_date);
  const roundTxt = fill(t().roundValue, { n: Number(entry.round_no).toLocaleString() });
  if (g && !g.roundLabel) return dateTxt || roundTxt;
  return dateTxt ? roundTxt + ' · ' + dateTxt : roundTxt;
}

// ── 당첨금 ──
// draw_results.tiers 에서 등수별 1인당 금액을 꺼냅니다.
// ⚠ 저장 형식이 제각각일 수 있어 여러 키 이름에 대응합니다
//   (admin-save-draw-result.ts의 getPrizePerWinner와 같은 방식)
function prizeOf(grade){
  const tiers = draw && Array.isArray(draw.tiers) ? draw.tiers : [];
  const row = tiers.find(x => Number(x.tier ?? x.rank ?? x.grade) === Number(grade));
  if (!row) return null;
  const p = Number(row.prize ?? row.prizePerWinner ?? row.amount ?? row.prize_money ?? 0);
  return p > 0 ? p : null;
}
function prizeText(grade){
  const p = prizeOf(grade);
  if (p === null) return '';
  const locale = lang === 'ko' ? 'ko-KR' : (lang === 'ja' ? 'ja-JP' : 'en-US');
  return p.toLocaleString(locale) + ' ' + (CURRENCY[entry.game_id] || '');
}

// ── 동그라미 ──
function ball(n, cls){ return '<span class="ball ' + (cls || '') + '">' + n + '</span>'; }

function ballFor(n, mains, bonuses){
  if (mains.includes(n)) return ball(n, 'hit');
  if (bonuses.includes(n)) return ball(n, 'bonushit');   // 보너스와 일치 (2등 판정에 쓰임)
  return ball(n, '');
}

// ── 집계표 ──
function renderVerdict(){
  const per = result.per_line || [];
  const total = entry.line_count || per.length;
  const wins = per.filter(l => l && l.grade);
  const tier = result.tier_class || 'none';

  $('verdictCard').classList.toggle('jackpot', tier === 'jackpot');
  $('verdictIcon').textContent = tier === 'jackpot' ? t().jackpotIcon : (tier === 'small' ? t().smallIcon : t().noneIcon);

  if (tier === 'none') {
    $('verdictTitle').textContent = t().noneTitle;
    $('verdictSub').textContent = fill(t().subNone, { total });
  } else {
    const tpl = tier === 'jackpot' ? t().jackpotTitle : t().smallTitle;
    $('verdictTitle').textContent = fill(tpl, { g: result.best_grade });
    $('verdictSub').textContent = fill(t().subWin, { total, win: wins.length });
  }

  // 등수별 몇 줄인지
  const byGrade = {};
  wins.forEach(l => { byGrade[l.grade] = (byGrade[l.grade] || 0) + 1; });
  const chips = Object.keys(byGrade).map(Number).sort((a,b) => a-b)
    .map(g => '<span class="tally-chip win">' + fill(t().chipGrade, { g, n: byGrade[g] }) + '</span>');
  const loseCount = total - wins.length;
  if (loseCount > 0) chips.push('<span class="tally-chip">' + fill(t().chipLose, { n: loseCount }) + '</span>');
  $('tallyBox').innerHTML = chips.join('');
}

// ── 당첨번호 ──
function renderWinning(){
  const mains = (draw && draw.main_numbers) || [];
  const bonuses = (draw && draw.bonus_numbers) || [];
  let html = mains.map(n => ball(n, 'hit')).join('');
  if (bonuses.length) html += '<span class="plus">+</span>' + bonuses.map(n => ball(n, 'bonushit')).join('');
  $('winNums').innerHTML = html;
}

// ── 내 번호 ──
function renderLines(){
  const mains = (draw && draw.main_numbers) || [];
  const bonuses = (draw && draw.bonus_numbers) || [];
  const spec = GAMES[entry.game_id] || { bonus: 0 };
  const lines = entry.lines || [];
  const bonusLines = entry.bonus_lines || [];
  const per = result.per_line || [];

  // 원래 순서를 기억한 채 정렬합니다
  let idx = lines.map((_, i) => i);
  if (sortByGrade) {
    // 🔴 당첨된 줄을 위로. 3등이 37번째 줄에 있으면 손님이 못 찾습니다.
    idx.sort((a, b) => {
      const ga = (per[a] && per[a].grade) || 999;
      const gb = (per[b] && per[b].grade) || 999;
      if (ga !== gb) return ga - gb;
      return a - b;
    });
  }

  $('linesBox').innerHTML = idx.map((i) => {
    const line = lines[i] || [];
    const bl = bonusLines[i] || [];
    const g = (per[i] && per[i].grade) || null;

    let cells = line.map(n => ballFor(n, mains, bonuses)).join('');
    if (spec.bonus > 0 && bl.length) {
      // 보너스는 반드시 떼어놓습니다. 본번호와 나란히 그리면 헷갈립니다.
      cells += '<span class="plus">+</span>' + bl.map(n => ball(n, bonuses.includes(n) ? 'bonushit' : 'sep')).join('');
    }

    const tag = g
      ? '<span class="grade-tag">' + fill(t().gradeTag, { g }) + (prizeText(g) ? '<span class="prize">' + prizeText(g) + '</span>' : '') + '</span>'
      : '<span class="grade-tag lose">' + t().lose + '</span>';

    const label = i < 26 ? String.fromCharCode(65 + i) : String(i + 1);
    return '<div class="line-row' + (g ? ' won' : '') + '">'
         + '<span class="line-tag">' + label + '</span>' + cells + tag + '</div>';
  }).join('');

  $('sortBtn').textContent = sortByGrade ? t().sortByGrade : t().sortByOrder;
}

function renderMeta(){
  const rows = [
    [t().metaGame, gameName(entry.game_id)],
    [t().metaRound, drawLabel()],
    [t().metaLines, entry.line_count],
    [t().metaPoints, Number(entry.points_charged || 0).toLocaleString() + ' P'],
  ];
  if (entry.created_at) {
    const d = new Date(entry.created_at);
    if (!isNaN(d.getTime())) {
      const locale = lang === 'ko' ? 'ko-KR' : (lang === 'ja' ? 'ja-JP' : 'en-US');
      rows.push([t().metaWhen, d.toLocaleDateString(locale)]);
    }
  }
  $('metaBox').innerHTML = rows.map(r =>
    '<div class="row"><span>' + r[0] + '</span><span class="v">' + r[1] + '</span></div>').join('');
}

function renderAll(){
  document.documentElement.lang = lang;
  document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  $('winTitle').textContent = t().winTitle;
  $('myTitle').textContent = t().myTitle;
  $('noticeBox').innerHTML = t().notice;
  $('againBtn').textContent = t().again;
  renderVerdict();
  renderWinning();
  renderLines();
  renderMeta();
}

// ── 불러오기 ──
async function load(){
  $('loadingBox').textContent = t().loading;

  if (!entryId) { showError(t().errNoEntry); return; }

  const token = getAccessToken();
  if (!token) { showError(t().errLogin); return; }

  try {
    // ⚠ RLS로 본인 것만 보입니다. 남의 등록번호를 넣어도 빈 결과가 옵니다.
    const rows = await rest('watch_entries?select=id,game_id,round_no,draw_date,lines,bonus_lines,line_count,points_charged,status,created_at&id=eq.' + encodeURIComponent(entryId), token);
    if (!rows || rows.length === 0) { showError(t().errNoEntry); return; }
    entry = rows[0];

    const res = await rest('watch_results?select=per_line,best_grade,tier_class,win_count&entry_id=eq.' + encodeURIComponent(entryId), token);
    if (!res || res.length === 0) { showError(t().errNoResult); return; }
    result = res[0];

    // 당첨번호는 공개 자료라 토큰 없이 부릅니다
    const dr = await rest('draw_results?select=main_numbers,bonus_numbers,draw_date,tiers&game_id=eq.'
      + encodeURIComponent(entry.game_id) + '&round_no=eq.' + encodeURIComponent(entry.round_no) + '&limit=1');
    draw = (dr && dr[0]) || null;

    $('loadingBox').classList.add('hidden');
    $('content').classList.remove('hidden');
    renderAll();
  } catch (e) {
    console.error('[watch-result] 불러오기 실패', e);
    showError(fill(t().errEtc, { msg: String(e.message || e) }));
  }
}

// ── 이벤트 ──
$('langToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-lang]');
  if (!btn || btn.dataset.lang === lang) return;
  lang = btn.dataset.lang;
  localStorage.setItem('paperlotto_lang', lang);
  if (entry && result) renderAll();
  else { $('loadingBox').textContent = t().loading; }
});
$('themeToggleBtn').addEventListener('click', function(){
  document.body.classList.toggle('light-mode');
  const light = document.body.classList.contains('light-mode');
  localStorage.setItem('paperlotto_theme', light ? 'light' : 'dark');
  this.textContent = light ? '☀️' : '🌙';
});
$('sortBtn').addEventListener('click', () => { sortByGrade = !sortByGrade; renderLines(); });

$('themeToggleBtn').textContent = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
load();
</script>
</body>
</html>
