<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>당첨번호 검수 — PaperLotto Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --board:#0c1020; --board-2:#111731; --board-line:#242c4d;
  --paper:#f6f1e4; --ink:#1c2130; --ink-dim:#5b5646;
  --gold:#b8862e; --gold-bright:#e0aa4e;
  --text-hi:#f2efe4; --text-mid:#a7adc7; --text-dim:#6b7195;
  --ok:#1f7a4f; --err:#c65a2e;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--board); color:var(--text-hi); min-height:100vh;
  font-family:'Inter',sans-serif; word-break:keep-all;
}
h1,h2{ font-family:'Fraunces',serif; margin:0; }

header{
  position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between;
  padding:16px 28px; border-bottom:1px solid var(--board-line); flex-wrap:wrap; gap:10px;
  background:rgba(12,16,32,0.92); backdrop-filter:blur(6px);
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{ width:28px; height:28px; border-radius:6px; background:linear-gradient(135deg,var(--gold-bright),var(--gold)); display:flex; align-items:center; justify-content:center; color:var(--ink); font-weight:700; font-family:'Fraunces',serif; transform:rotate(-4deg); }
.brand-name{ font-size:16px; font-weight:600; }
.brand-name em{ font-style:normal; color:var(--gold-bright); }
.hdr-right{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--text-mid); }
.hdr-right button{ background:transparent; border:1px solid var(--board-line); color:var(--text-mid); padding:6px 12px; border-radius:7px; font-size:12px; cursor:pointer; }
.hdr-right button:hover{ border-color:var(--gold); color:var(--gold-bright); }
nav.admin-nav{ display:flex; gap:14px; font-size:12.5px; }
nav.admin-nav a{ color:var(--text-mid); text-decoration:none; }
nav.admin-nav a:hover{ color:var(--gold-bright); }

main{ max-width:960px; margin:0 auto; padding:28px 20px 90px; }

.toolbar{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:20px; }
.tabs{ display:flex; gap:6px; }
.tab{ padding:8px 16px; border-radius:20px; font-size:12.5px; font-weight:600; cursor:pointer; border:1px solid var(--board-line); color:var(--text-mid); background:transparent; }
.tab.active{ background:var(--gold); color:var(--ink); border-color:var(--gold); }
.scrape-btn{ background:var(--gold); color:var(--ink); border:none; padding:10px 18px; border-radius:9px; font-weight:700; font-size:13px; cursor:pointer; }
.scrape-btn:hover{ background:var(--gold-bright); }
.scrape-btn:disabled{ opacity:0.55; cursor:not-allowed; }

.status-line{ font-size:12.5px; color:var(--text-mid); margin-bottom:18px; min-height:16px; }

.card{ background:var(--paper); color:var(--ink); border-radius:14px; padding:20px 22px; margin-bottom:14px; }
.card-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
.card-title{ font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; }
.badge{ font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; }
.badge.success{ background:rgba(31,122,79,0.15); color:var(--ok); }
.badge.failed{ background:rgba(198,90,46,0.15); color:var(--err); }
.badge.reviewed{ background:rgba(91,86,70,0.15); color:var(--ink-dim); }
.meta{ font-size:11.5px; color:var(--ink-dim); }

.numbers-preview{ font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600; margin:8px 0; }
.numbers-preview .bonus{ color:#8a5b1c; }
.error-text{ font-size:12.5px; color:var(--err); background:rgba(198,90,46,0.08); padding:8px 10px; border-radius:7px; margin:8px 0; }

.form-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
.form-row.full{ grid-template-columns:1fr; }
.field label{ display:block; font-size:11px; font-weight:600; color:var(--ink-dim); margin-bottom:4px; }
.field input{ width:100%; padding:9px 10px; border:1px solid #d9d1ba; border-radius:7px; font-size:13px; background:#fff; color:var(--ink); font-family:'IBM Plex Mono',monospace; }

.action-row{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
.btn{ padding:10px 18px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; border:none; }
.btn-approve{ background:var(--ok); color:#fff; }
.btn-approve:hover{ background:#25945f; }
.btn-manual{ background:var(--ink); color:var(--paper); }
.btn-manual:hover{ background:#2a3145; }
.btn:disabled{ opacity:0.5; cursor:not-allowed; }

.empty-state{ text-align:center; color:var(--text-mid); font-size:13.5px; padding:60px 0; }
.source-link{ font-size:11px; color:#8a5b1c; text-decoration:underline; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">P</div>
    <div class="brand-name">Paper<em>Lotto</em> Admin</div>
  </div>
  <nav class="admin-nav">
    <a href="paperlotto_admin_scrape_review.html" style="color:var(--gold-bright);">당첨번호 검수</a>
    <a href="paperlotto_admin_bank_transfers.html">계좌이체 관리</a>
    <a href="paperlotto_admin_point_costs.html">포인트 설정</a>
  </nav>
  <div class="hdr-right">
    <span id="adminEmail"></span>
    <button id="logoutBtn">로그아웃</button>
  </div>
</header>

<main>
  <h1 style="font-size:22px; margin-bottom:4px;">당첨번호 스크래핑 검수</h1>
  <p style="font-size:13px; color:var(--text-mid); margin:6px 0 22px;">
    자동 스크래핑 결과를 확인하고, 성공한 건은 승인 / 실패한 건은 직접 입력해주세요.
    저장하면 draw_results에 즉시 반영되고 채점·이메일 발송·다운로드 상품까지 자동으로 갱신됩니다.
  </p>

  <div class="toolbar">
    <div class="tabs">
      <button class="tab active" data-tab="false">미검수</button>
      <button class="tab" data-tab="true">검수완료</button>
    </div>
    <button class="scrape-btn" id="runScrapeBtn">⟳ 지금 스크래핑 실행 (12개 게임)</button>
  </div>

  <div class="status-line" id="statusLine"></div>

  <div id="list"></div>
</main>

<script>
const SUPABASE_URL = "https://wzrqaozlbfyejsbvnrxk.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_3KrYMzwrVlbYr-e9d8UiLA_KgvSs8tC";
const LIST_URL = SUPABASE_URL + "/functions/v1/admin-list-scrape-attempts";
const REVIEW_URL = SUPABASE_URL + "/functions/v1/admin-review-scrape";
const SCRAPE_URL = SUPABASE_URL + "/functions/v1/admin-scrape-draw-results";

const accessToken = sessionStorage.getItem('pl_admin_token');
const adminKey = sessionStorage.getItem('pl_admin_key');
const adminEmail = sessionStorage.getItem('pl_admin_email');

if (!accessToken || !adminKey) {
  window.location.href = 'paperlotto_admin_login.html';
}

document.getElementById('adminEmail').textContent = adminEmail || '';
document.getElementById('logoutBtn').addEventListener('click', () => {
  sessionStorage.removeItem('pl_admin_token');
  sessionStorage.removeItem('pl_admin_key');
  sessionStorage.removeItem('pl_admin_email');
  window.location.href = 'paperlotto_admin_login.html';
});

const DISPLAY = {
  kr_lotto645:     { flag:'🇰🇷', name:'한국 로또 6/45' },
  us_powerball:    { flag:'🇺🇸', name:'파워볼' },
  us_megamillions: { flag:'🇺🇸', name:'메가밀리언스' },
  jp_loto6:        { flag:'🇯🇵', name:'일본 로또6' },
  jp_loto7:        { flag:'🇯🇵', name:'일본 로또7' },
  jp_miniloto:     { flag:'🇯🇵', name:'일본 미니로또' },
  ca_lotto649:     { flag:'🇨🇦', name:'캐나다 로또 6/49' },
  ca_lottomax:     { flag:'🇨🇦', name:'캐나다 로또맥스' },
  au_powerball:    { flag:'🇦🇺', name:'호주 파워볼' },
  au_ozlotto:      { flag:'🇦🇺', name:'호주 오즈로또' },
  au_tattslotto:   { flag:'🇦🇺', name:'새터데이로또 (Tatts Lotto)' },
  eu_euromillions: { flag:'🇪🇺', name:'유로밀리언스' },
};

let currentTab = 'false';

function setStatus(text) {
  document.getElementById('statusLine').textContent = text;
}

function parseNumberList(str) {
  return (str || '').split(/[,\s]+/).map(s => s.trim()).filter(Boolean).map(Number).filter(n => !isNaN(n));
}

async function loadList() {
  const list = document.getElementById('list');
  list.innerHTML = '<div class="empty-state">불러오는 중…</div>';
  try {
    const resp = await fetch(LIST_URL + '?reviewed=' + currentTab + '&limit=200', {
      headers: { 'Authorization': 'Bearer ' + accessToken },
    });
    const data = await resp.json();
    if (resp.status === 401 || resp.status === 403) {
      alert('관리자 인증이 만료되었거나 권한이 없습니다. 다시 로그인해주세요.');
      window.location.href = 'paperlotto_admin_login.html';
      return;
    }
    if (!resp.ok) {
      list.innerHTML = '<div class="empty-state">불러오지 못했습니다: ' + (data.error || '') + '</div>';
      return;
    }
    renderList(data.items || []);
  } catch (e) {
    list.innerHTML = '<div class="empty-state">오류가 발생했습니다.</div>';
  }
}

function renderList(items) {
  const list = document.getElementById('list');
  if (items.length === 0) {
    list.innerHTML = '<div class="empty-state">' + (currentTab === 'false' ? '검수 대기 중인 항목이 없습니다.' : '검수 완료된 항목이 없습니다.') + '</div>';
    return;
  }
  list.innerHTML = '';
  items.forEach(item => list.appendChild(renderCard(item)));
}

function renderCard(item) {
  const disp = DISPLAY[item.game_id] || { flag:'🎟️', name:item.game_id };
  const div = document.createElement('div');
  div.className = 'card';

  const isReviewed = item.reviewed;
  const badgeClass = isReviewed ? 'reviewed' : (item.status === 'success' ? 'success' : 'failed');
  const badgeText = isReviewed ? '검수완료' : (item.status === 'success' ? '스크래핑 성공' : '스크래핑 실패');

  let inner = '<div class="card-top">' +
    '<div class="card-title">' + disp.flag + ' ' + disp.name + (item.round_no ? ' — 제' + item.round_no + '회' : '') + '</div>' +
    '<span class="badge ' + badgeClass + '">' + badgeText + '</span>' +
  '</div>' +
  '<div class="meta">시도 시각: ' + new Date(item.attempted_at).toLocaleString('ko-KR') + (item.source_url ? ' · <a class="source-link" href="' + item.source_url + '" target="_blank">소스 링크</a>' : '') + '</div>';

  if (item.status === 'success') {
    inner += '<div class="numbers-preview">' +
      (item.parsed_main_numbers || []).join(', ') +
      (item.parsed_bonus_numbers && item.parsed_bonus_numbers.length ? '  <span class="bonus">+ ' + item.parsed_bonus_numbers.join(', ') + '</span>' : '') +
    '</div>' +
    '<div class="meta">추첨일: ' + (item.draw_date || '-') + '</div>';
  } else {
    inner += '<div class="error-text">' + (item.error_message || '알 수 없는 오류') + '</div>';
  }

  div.innerHTML = inner;

  if (isReviewed) {
    const doneNote = document.createElement('div');
    doneNote.className = 'meta';
    doneNote.style.marginTop = '10px';
    doneNote.textContent = '검수 완료: ' + new Date(item.reviewed_at).toLocaleString('ko-KR');
    div.appendChild(doneNote);
    return div;
  }

  // ── 미검수 항목: 폼 + 액션 버튼 ──
  const formWrap = document.createElement('div');
  const idPrefix = 'attempt_' + item.id;

  formWrap.innerHTML =
    '<div class="form-row">' +
      '<div class="field"><label>회차</label><input type="number" id="' + idPrefix + '_round" value="' + (item.round_no ?? '') + '"></div>' +
      '<div class="field"><label>추첨일 (YYYY-MM-DD)</label><input type="text" id="' + idPrefix + '_date" value="' + (item.draw_date ?? '') + '"></div>' +
    '</div>' +
    '<div class="form-row">' +
      '<div class="field"><label>메인번호 (쉼표/공백 구분)</label><input type="text" id="' + idPrefix + '_main" value="' + (item.parsed_main_numbers || []).join(', ') + '"></div>' +
      '<div class="field"><label>보너스번호 (없으면 비워두기)</label><input type="text" id="' + idPrefix + '_bonus" value="' + (item.parsed_bonus_numbers || []).join(', ') + '"></div>' +
    '</div>';

  const actionRow = document.createElement('div');
  actionRow.className = 'action-row';

  if (item.status === 'success') {
    const approveBtn = document.createElement('button');
    approveBtn.className = 'btn btn-approve';
    approveBtn.textContent = '✓ 승인하고 저장';
    approveBtn.onclick = () => submitReview(item.id, 'approve', idPrefix, approveBtn);
    actionRow.appendChild(approveBtn);
  }

  const manualBtn = document.createElement('button');
  manualBtn.className = 'btn btn-manual';
  manualBtn.textContent = item.status === 'success' ? '수정해서 저장' : '수작업으로 저장';
  manualBtn.onclick = () => submitReview(item.id, 'manual', idPrefix, manualBtn);
  actionRow.appendChild(manualBtn);

  div.appendChild(formWrap);
  div.appendChild(actionRow);
  return div;
}

async function submitReview(attemptId, action, idPrefix, btnEl) {
  const round_no = Number(document.getElementById(idPrefix + '_round').value);
  const draw_date = document.getElementById(idPrefix + '_date').value.trim();
  const main_numbers = parseNumberList(document.getElementById(idPrefix + '_main').value);
  const bonus_numbers = parseNumberList(document.getElementById(idPrefix + '_bonus').value);

  if (!round_no || !draw_date || main_numbers.length === 0) {
    alert('회차, 추첨일, 메인번호는 필수입니다.');
    return;
  }
  if (!confirm('이 내용으로 저장하시겠습니까?\n\n회차: ' + round_no + '\n추첨일: ' + draw_date + '\n메인번호: ' + main_numbers.join(', ') + '\n보너스: ' + (bonus_numbers.join(', ') || '없음') + '\n\n저장 즉시 채점과 다운로드 상품에 반영됩니다.')) return;

  btnEl.disabled = true;
  const originalText = btnEl.textContent;
  btnEl.textContent = '저장 중…';

  try {
    const resp = await fetch(REVIEW_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + accessToken,
        'x-admin-key': adminKey,
      },
      body: JSON.stringify({
        attemptId,
        action,
        override: { round_no, draw_date, main_numbers, bonus_numbers, tiers: [] },
      }),
    });
    const data = await resp.json();
    if (!resp.ok) {
      alert('저장 실패: ' + (data.error || '알 수 없는 오류'));
      btnEl.disabled = false;
      btnEl.textContent = originalText;
      return;
    }
    alert('저장 완료되었습니다.' + (data.grading ? ('\n채점된 등록건수: ' + data.grading.total_entries) : ''));
    loadList();
  } catch (e) {
    alert('오류가 발생했습니다: ' + e.message);
    btnEl.disabled = false;
    btnEl.textContent = originalText;
  }
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    loadList();
  });
});

document.getElementById('runScrapeBtn').addEventListener('click', async () => {
  const btn = document.getElementById('runScrapeBtn');
  btn.disabled = true;
  setStatus('12개 게임 스크래핑 시도 중… (몇 초 걸릴 수 있습니다)');
  try {
    const resp = await fetch(SCRAPE_URL, {
      method: 'POST',
      headers: { 'x-admin-key': adminKey, 'Authorization': 'Bearer ' + accessToken },
    });
    const data = await resp.json();
    if (!resp.ok) {
      setStatus('스크래핑 실행 실패: ' + (data.error || ''));
      return;
    }
    const successCount = data.results.filter(r => r.status === 'success').length;
    const failedCount = data.results.filter(r => r.status === 'failed').length;
    const skippedCount = data.results.filter(r => r.skipped).length;
    setStatus('완료 — 성공 ' + successCount + '건, 실패 ' + failedCount + '건, 건너뜀 ' + skippedCount + '건. 아래 목록을 확인해주세요.');
    currentTab = 'false';
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'false'));
    loadList();
  } catch (e) {
    setStatus('오류가 발생했습니다: ' + e.message);
  } finally {
    btn.disabled = false;
  }
});

loadList();
</script>
</body>
</html>
