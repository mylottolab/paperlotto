<html lang="ko">
<head>
<meta charset="UTF-8">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --board:#0c1020; --board-2:#111731; --board-line:#242c4d;
  --paper:#f6f1e4; --paper-2:#efe8d6; --ink:#1c2130; --ink-dim:#5b5646;
  --gold:#b8862e; --gold-bright:#e0aa4e;
  --text-hi:#f2efe4; --text-mid:#a7adc7; --text-dim:#6b7195;
  --kr:#c8203a; --jp:#2a3a7a; --us:#2c4fa3; --ca:#d8232a; --au:#1f7a6e; --eu:#2451c4;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:var(--board); color:var(--text-hi);
  font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
  word-break:keep-all; overflow-wrap:break-word;
  background-image:linear-gradient(var(--board-line) 1px, transparent 1px), linear-gradient(90deg, var(--board-line) 1px, transparent 1px);
  background-size:64px 64px; background-color:var(--board);
}
h1,h2,h3{ font-family:'Fraunces',serif; margin:0; }
.mono{ font-family:'IBM Plex Mono',monospace; }
a{ color:inherit; }
:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:3px; border-radius:4px; }

.site-sticky-top{ position:sticky; top:0; z-index:20; }
header{
  position:relative; display:flex; align-items:center; justify-content:space-between;
  padding:20px 32px; border-bottom:1px solid var(--board-line);
  background:rgba(12,16,32,0.9); backdrop-filter:blur(6px); flex-wrap:wrap; gap:12px;
}
.ticker-wrap{
  position:relative; z-index:2; border-bottom:1px solid var(--board-line);
  background:var(--board-2); overflow:hidden; padding:9px 0;
}
.ticker-label{
  position:absolute; left:0; top:0; bottom:0; z-index:2;
  display:flex; align-items:center; gap:8px; padding:0 16px 0 32px;
  background:linear-gradient(90deg, var(--board-2) 60%, transparent);
}
.ticker-label .dot{ width:7px; height:7px; border-radius:50%; background:#e3574a; animation:tpulse 1.6s ease-in-out infinite; }
@keyframes tpulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
.ticker-label span{ font-size:11px; letter-spacing:1.4px; color:var(--text-dim); font-weight:600; }
.ticker-track{ display:flex; gap:0; width:max-content; animation:tickerScroll 52s linear infinite; padding-left:190px; }
@keyframes tickerScroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
.ticker-item{ display:flex; align-items:baseline; gap:9px; padding:0 26px; border-right:1px solid var(--board-line); white-space:nowrap; font-size:13px; }
.ticker-item .flag{ width:8px; height:8px; border-radius:2px; }
.ticker-item .name{ color:var(--text-mid); }
.ticker-item .odds{ color:var(--text-dim); font-size:11.5px; }
.ticker-item .cd{ color:var(--gold-bright); font-weight:600; letter-spacing:0.3px; }
@media (prefers-reduced-motion: reduce){ .ticker-track{ animation:none; } }
.brand{ display:flex; align-items:center; gap:10px; text-decoration:none; cursor:pointer; }
.brand-mark{ width:34px; height:34px; border-radius:7px; background:linear-gradient(135deg, var(--gold-bright), var(--gold)); display:flex; align-items:center; justify-content:center; color:var(--ink); font-family:'Fraunces',serif; font-weight:700; font-size:17px; transform:rotate(-4deg); }
.brand-name{ font-size:20px; font-weight:600; }
.brand-name em{ font-style:normal; color:var(--gold-bright); }
nav{ display:flex; align-items:center; gap:22px; font-size:14px; color:var(--text-mid); flex-wrap:wrap; }
nav a{ text-decoration:none; } nav a:hover{ color:var(--text-hi); }
.lang-toggle{ display:flex; border:1px solid var(--board-line); border-radius:20px; overflow:hidden; }
.lang-toggle button{ border:none; background:transparent; color:var(--text-dim); font-size:12px; font-weight:600; padding:6px 14px; cursor:pointer; font-family:'Inter',sans-serif; }
.lang-toggle button.active{ background:var(--gold); color:var(--ink); }

.page-head{ max-width:880px; margin:36px auto 0; padding:0 24px; }
.page-eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:700; letter-spacing:1.6px; color:var(--gold-bright); }
.page-title{ font-size:clamp(26px,4vw,36px); font-weight:600; margin-top:10px; }
.page-sub{ color:var(--text-mid); font-size:14.5px; margin-top:10px; max-width:640px; line-height:1.7; }

.region-filter{ max-width:880px; margin:26px auto 0; padding:0 24px; display:flex; gap:8px; flex-wrap:wrap; }
.region-btn{ border:1px solid var(--board-line); background:transparent; color:var(--text-mid); font-size:12.5px; font-family:'Inter',sans-serif; padding:6px 14px; border-radius:20px; cursor:pointer; }
.region-btn.active{ background:var(--gold); color:var(--ink); border-color:var(--gold); font-weight:600; }

.guide-list{ max-width:880px; margin:22px auto 60px; padding:0 24px; display:flex; flex-direction:column; gap:16px; }

.game-card{ background:var(--paper); color:var(--ink); border-radius:14px; padding:0; overflow:hidden; box-shadow:0 14px 30px -18px rgba(0,0,0,0.55); }
.game-card::before{ content:''; display:block; height:5px; background:var(--accent, var(--gold)); }
.game-card-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 22px; cursor:pointer; }
.game-card-title{ display:flex; align-items:center; gap:10px; }
.game-flag{ font-size:20px; }
.game-name{ font-size:16.5px; font-weight:600; }
.game-name-sub{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-dim); margin-top:2px; }
.game-toggle-icon{ font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--ink-dim); transition:transform .2s; flex-shrink:0; }
.game-card.open .game-toggle-icon{ transform:rotate(45deg); }

.game-card-body{ display:none; padding:0 22px 22px; }
.game-card.open .game-card-body{ display:block; }

.strategy-note{ font-size:12px; color:var(--ink-dim); margin-bottom:14px; font-style:italic; }
.strategy-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; }
.strategy-list li{ display:flex; gap:12px; align-items:flex-start; font-size:14px; line-height:1.7; }
.strategy-list .mark{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--gold); font-weight:700; margin-top:3px; flex-shrink:0; }
.strategy-list .detail-link{ display:inline-block; margin-top:6px; font-size:12.5px; color:var(--gold); text-decoration:underline; }

/* ── 전략 번호 생성기 위젯 ── */
.sg-wrap{ margin-top:22px; padding-top:20px; border-top:1px dashed rgba(28,33,48,0.18); }
.sg-title-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
.sg-title{ font-family:'Fraunces',serif; font-size:17px; font-weight:600; }
.sg-help-link{ font-size:12px; color:var(--gold); text-decoration:underline; cursor:pointer; background:none; border:none; padding:0; font-family:inherit; }
.sg-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px 12px; margin-bottom:14px; }
.sg-field{ display:flex; flex-direction:column; gap:4px; }
.sg-field label{ font-size:11px; color:var(--ink-dim); font-weight:600; display:flex; align-items:center; gap:4px; }
.sg-field input, .sg-field select{
  font-family:inherit; font-size:12.5px; padding:7px 9px; border-radius:7px;
  border:1px solid rgba(28,33,48,0.18); background:#fff; color:var(--ink);
}
.sg-field input:focus, .sg-field select:focus{ outline:2px solid var(--gold-bright); outline-offset:1px; }
.sg-advanced-toggle{
  font-size:12px; color:var(--ink-dim); background:none; border:1px dashed rgba(28,33,48,0.25);
  border-radius:8px; padding:6px 12px; cursor:pointer; font-family:inherit; margin-bottom:12px;
}
.sg-advanced{ display:none; }
.sg-advanced.open{ display:block; }
.sg-cost-row{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:12px; padding:10px 14px; background:var(--paper-2); border-radius:8px; font-size:12.5px; }
.sg-cost-row b{ color:var(--gold-dark, #8a5b1c); font-family:'IBM Plex Mono',monospace; }
.sg-generate-btn{
  width:100%; padding:12px; border:none; border-radius:9px; background:var(--gold); color:var(--ink);
  font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
}
.sg-generate-btn:hover{ background:var(--gold-bright); }
.sg-generate-btn:disabled{ opacity:0.55; cursor:not-allowed; }
.sg-status{ font-size:12.5px; color:var(--ink-dim); margin-top:8px; min-height:16px; }
.sg-status.err{ color:#b23b3b; font-weight:600; }
.sg-status.ok{ color:#1f7a4f; font-weight:600; }
.sg-results{ display:none; margin-top:16px; }
.sg-results.open{ display:block; }
.sg-results-toolbar{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
.sg-results-toolbar label{ font-size:12px; display:flex; align-items:center; gap:5px; }
.sg-results-actions{ display:flex; gap:6px; flex-wrap:wrap; }
.sg-btn-sm{
  font-size:11.5px; padding:6px 11px; border-radius:7px; border:1px solid rgba(28,33,48,0.2);
  background:#fff; color:var(--ink); cursor:pointer; font-family:inherit; font-weight:600;
}
.sg-btn-sm:hover{ border-color:var(--gold); color:var(--gold-dark, #8a5b1c); }
.sg-btn-sm.primary{ background:var(--gold); border-color:var(--gold); color:var(--ink); }
.sg-btn-sm.primary:hover{ background:var(--gold-bright); }
.sg-result-list{ max-height:340px; overflow-y:auto; border:1px solid rgba(28,33,48,0.12); border-radius:9px; }
.sg-result-row{ display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid rgba(28,33,48,0.08); font-size:12.5px; }
.sg-result-row:last-child{ border-bottom:none; }
.sg-result-no{ font-family:'IBM Plex Mono',monospace; color:var(--ink-dim); width:34px; flex-shrink:0; }
.sg-result-main{ display:flex; gap:4px; flex-wrap:wrap; flex:1; }
.sg-pip{ width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:700; background:rgba(28,33,48,0.07); color:var(--ink); }
.sg-pip.bonus{ background:var(--gold); color:var(--ink); }
.sg-result-overlap{ font-size:10.5px; color:var(--ink-dim); width:42px; text-align:right; flex-shrink:0; }

.sg-help-modal{
  display:none; position:fixed; inset:0; z-index:200; background:rgba(12,16,32,0.7);
  align-items:center; justify-content:center; padding:20px;
}
.sg-help-modal.open{ display:flex; }
.sg-help-panel{
  background:var(--paper); color:var(--ink); border-radius:14px; max-width:640px; width:100%;
  max-height:80vh; overflow-y:auto; padding:26px 28px;
}
.sg-help-panel h3{ font-family:'Fraunces',serif; font-size:19px; margin-bottom:4px; }
.sg-help-close{ float:right; background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-dim); }
.sg-help-card{ margin-top:16px; padding-bottom:14px; border-bottom:1px solid rgba(28,33,48,0.1); }
.sg-help-card:last-child{ border-bottom:none; }
.sg-help-card .hc-title{ font-weight:700; font-size:13.5px; color:#8a5b1c; margin-bottom:4px; }
.sg-help-card .hc-body{ font-size:12.5px; line-height:1.7; color:var(--ink-dim); white-space:pre-line; }

.sg-sig-picker{
  display:none; margin-top:10px; padding:12px; background:var(--paper-2); border-radius:9px;
}
.sg-sig-picker.open{ display:block; }
.sg-sig-picker select{ width:100%; padding:8px; border-radius:7px; border:1px solid rgba(28,33,48,0.18); margin-bottom:8px; font-family:inherit; }
.sg-sig-new-row{ display:flex; gap:6px; }
.sg-sig-new-row input{ flex:1; padding:8px; border-radius:7px; border:1px solid rgba(28,33,48,0.18); font-family:inherit; }

@media (max-width:640px){
  .sg-grid{ grid-template-columns:repeat(2,1fr); }
  .sg-result-row{ font-size:11.5px; }
  .sg-pip{ width:21px; height:21px; font-size:9.5px; }
}

.pending-note{ font-size:13.5px; color:var(--ink-dim); padding:6px 0 2px; }

.footer-disclaimer{ max-width:880px; margin:0 auto 50px; padding:0 24px; font-size:12px; color:var(--text-dim); line-height:1.7; }

@media (max-width:640px){
  header{ padding:16px 18px; }
  nav{ gap:14px; font-size:13px; order:3; width:100%; justify-content:space-between; }
  .ticker-label{ padding:0 10px 0 16px; }
  .ticker-label span{ font-size:10px; }
  .ticker-item{ padding:0 16px; font-size:11.5px; }
  .game-card-head{ padding:15px 16px; }
  .game-card-body{ padding:0 16px 18px; }
}
</style>

let currentLang = localStorage.getItem('paperlotto_lang') || 'ko';
let currentRegion = 'all';
const openCards = new Set();

function renderRegionFilter(){
  const t = I18N[currentLang];
  const regions = [
    ['all', t.regionAll], ['kr', t.regionKr], ['us', t.regionUs], ['jp', t.regionJp],
    ['ca', t.regionCa], ['au', t.regionAu], ['eu', t.regionEu],
  ];
  const wrap = document.getElementById('regionFilter');
  wrap.innerHTML = regions.map(([key, label]) =>
    `<button class="region-btn${key===currentRegion?' active':''}" data-region="${key}" type="button">${label}</button>`
  ).join('');
  wrap.querySelectorAll('.region-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentRegion = btn.dataset.region; render(); });
  });
}

function renderGuideList(){
  const t = I18N[currentLang];
  const list = document.getElementById('guideList');
  const filtered = currentRegion==='all' ? GAMES : GAMES.filter(g=>g.region===currentRegion);

  list.innerHTML = filtered.map(g=>{
    const nameInfo = t.names[g.id];
    const isOpen = openCards.has(g.id);
    let bodyHtml;
    if (g.status === 'ready'){
      const s = t.strategy[g.id];
      bodyHtml = `<div class="strategy-note">${s.note}</div>
        <ul class="strategy-list">
          ${s.items.map((text,i)=>`<li><span class="mark">0${i+1}</span>${text}</li>`).join('')}
        </ul>
        <a class="detail-link" href="${g.detail}">${t.readMore}</a>
        ${sgWidgetHtml(g.id)}`;
    } else {
      bodyHtml = `<div class="pending-note">${t.pending}</div>`;
    }
    return `<div class="game-card${isOpen?' open':''}" data-id="${g.id}" style="--accent:${g.accent}">
      <div class="game-card-head">
        <div class="game-card-title">
          <span class="game-flag">${g.flag}</span>
          <div>
            <div class="game-name">${nameInfo.name}</div>
            <div class="game-name-sub">${nameInfo.sub}</div>
          </div>
        </div>
        <span class="game-toggle-icon">+</span>
      </div>
      <div class="game-card-body">${bodyHtml}</div>
    </div>`;
  }).join('');

  list.querySelectorAll('.game-card-head').forEach(head=>{
    head.addEventListener('click', ()=>{
      const card = head.closest('.game-card');
      const id = card.dataset.id;
      if (openCards.has(id)) openCards.delete(id); else openCards.add(id);
      card.classList.toggle('open');
    });
  });
}

function applyStaticI18n(){
  const t = I18N[currentLang];
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if (t[key] !== undefined) el.textContent = t[key];
  });
}

function render(){
  document.documentElement.lang = currentLang; // auth-widget.js가 언어 변경을 감지하도록
  applyStaticI18n();
  document.querySelectorAll('.lang-toggle button').forEach(b=>b.classList.toggle('active', b.dataset.lang===currentLang));
  renderRegionFilter();
  renderGuideList();
  if (typeof renderTicker === 'function') renderTicker();
}

document.querySelectorAll('.lang-toggle button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentLang = btn.dataset.lang;
    localStorage.setItem('paperlotto_lang', currentLang);
    render();
  });
});

const TICKER_WEEKDAY_NUM = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };
function tkZonedTimeToUtc(dateStr, hour, minute, timeZone){
  const naiveUtc = new Date(`${dateStr}T${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}:00Z`);
  const tzDate = new Date(naiveUtc.toLocaleString('en-US', { timeZone }));
  const utcDate = new Date(naiveUtc.toLocaleString('en-US', { timeZone: 'UTC' }));
  const offset = utcDate.getTime() - tzDate.getTime();
  return new Date(naiveUtc.getTime() + offset);
}
function tkNextDrawDate(days, hour, minute, timeZone){
  const now = new Date();
  let best = null;
  for (let addDays = 0; addDays < 8; addDays++){
    const candidate = new Date(now.getTime() + addDays * 86400000);
    const wdName = new Intl.DateTimeFormat('en-US', { timeZone, weekday: 'short' }).format(candidate);
    const wd = TICKER_WEEKDAY_NUM[wdName];
    if (!days.includes(wd)) continue;
    const dateStr = new Intl.DateTimeFormat('en-CA', { timeZone }).format(candidate);
    const drawUtc = tkZonedTimeToUtc(dateStr, hour, minute, timeZone);
    if (drawUtc > now && (!best || drawUtc < best)) best = drawUtc;
  }
  return best;
}
function tkFmtCountdown(target){
  const dayLabel = currentLang === 'ko' ? '일' : currentLang === 'ja' ? '日' : 'd';
  const hourLabel = currentLang === 'ko' ? '시간' : currentLang === 'ja' ? '時間' : 'h';
  const diff = Math.max(0, target - new Date());
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  return d > 0 ? `${d}${dayLabel} ${h}${hourLabel}` : `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
TICKER_GAMES.forEach(g => { g.next = tkNextDrawDate(g.days, g.drawHour, g.drawMinute, g.tz); });
function renderTicker(){
  const nameKey = currentLang === 'ko' ? 'nameKo' : currentLang === 'ja' ? 'nameJa' : 'nameEn';

    </div>`).join('');
  const track = document.getElementById('tickerTrack');
  if (track) track.innerHTML = items + items;
}

function sgToggleAdvanced(gameId){
  document.getElementById('sgAdvanced_' + gameId).classList.toggle('open');
}

async function sgUpdateCostPreview(gameId){
  const t = sgT();
  const el = document.getElementById('sgCostPreview_' + gameId);
  if (!el) return;
  if (sgPerComboCost === null) {
    try {
      const { data } = await sgSb.from('point_costs').select('cost_points').eq('action_key', 'strategy_generate').eq('active', true).maybeSingle();
      sgPerComboCost = data ? Number(data.cost_points) : null;
    } catch (e) { sgPerComboCost = null; }
  }
  const countInput = document.getElementById('sg_requestedCount_' + gameId);
  const n = countInput ? (parseInt(countInput.value, 10) || 0) : 0;
  if (sgPerComboCost === null) { el.textContent = t.costUnknown; return; }
  el.textContent = sgPerComboCost.toLocaleString() + 'P × ' + n + ' = ' + (sgPerComboCost * n).toLocaleString() + 'P';
}

function sgParseNums(text){
  return (text || '').split(/[,\s]+/).map(s => parseInt(s, 10)).filter(n => !isNaN(n));
}

function sgCollectSettings(gameId){
  const v = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };
  const oddEven = v('sg_oddEven_' + gameId);
  const lastDigitMode = v('sg_lastDigitMode_' + gameId) || 'any';
  const lastWeekPref = v('sg_lastWeekPref_' + gameId) || 'any';
  const spec = GAME_SPECS[gameId];
  return {
    oddCount: oddEven === 'any' || oddEven === '' ? null : parseInt(oddEven, 10),
    topRange: parseInt(v('sg_topRange_' + gameId), 10) || null,
    topUse: v('sg_topUse_' + gameId) === '' ? null : parseInt(v('sg_topUse_' + gameId), 10),
    include: sgParseNums(v('sg_include_' + gameId)),
    exclude: sgParseNums(v('sg_exclude_' + gameId)),
    lastDigits: sgParseNums(v('sg_lastDigits_' + gameId)),
    lastDigitMode,
    sumMin: v('sg_sumMin_' + gameId) === '' ? null : parseInt(v('sg_sumMin_' + gameId), 10),
    sumMax: v('sg_sumMax_' + gameId) === '' ? null : parseInt(v('sg_sumMax_' + gameId), 10),
    startRound: v('sg_startRound_' + gameId) === '' ? null : parseInt(v('sg_startRound_' + gameId), 10),
    endRound: v('sg_endRound_' + gameId) === '' ? null : parseInt(v('sg_endRound_' + gameId), 10),
    bonusInclude: spec.bonus > 0 ? (v('sg_bonusInclude_' + gameId) || 'Y') === 'Y' : false,
    consecutiveLimit: v('sg_consecutiveLimit_' + gameId) === '' ? null : parseInt(v('sg_consecutiveLimit_' + gameId), 10),
    lastWeekPref,
    randomInclude: (v('sg_randomInclude_' + gameId) || 'Y') === 'Y',
    requestedCount: parseInt(v('sg_requestedCount_' + gameId), 10) || 10,
    repeatCount: parseInt(v('sg_repeatCount_' + gameId), 10) || 1,
    repeatMode: v('sg_repeatMode_' + gameId) || 'AABBCC',
  };
}

async function sgGenerate(gameId){
  const t = sgT();
  const statusEl = document.getElementById('sgStatus_' + gameId);
  const btn = document.getElementById('sgGenBtn_' + gameId);
  await sgRefreshToken();
  if (!sgAccessToken) {
    statusEl.className = 'sg-status err';
    statusEl.textContent = t.loginRequired;
    setTimeout(() => { window.location.href = 'paperlotto_login_mockup.html'; }, 900);
    return;
  }
  const settings = sgCollectSettings(gameId);
  btn.disabled = true;
  statusEl.className = 'sg-status';
  statusEl.textContent = t.generating;
  try {
    const resp = await fetch(SG_GENERATE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sgAccessToken },
      body: JSON.stringify({ gameId, settings }),
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) {
      if (data.error === 'INSUFFICIENT_POINTS') {
        statusEl.className = 'sg-status err';
        statusEl.textContent = t.insufficientPoints(data.shortfall || 0);
      } else {
        statusEl.className = 'sg-status err';
        statusEl.textContent = data.error || t.genericError;
      }
      return;
    }
    if (!data.combos || data.combos.length === 0) {
      statusEl.className = 'sg-status err';
      statusEl.textContent = data.note || t.emptyMsg;
      document.getElementById('sgResultsWrap_' + gameId).classList.remove('open');
      return;
    }
    sgState[gameId] = { combos: data.combos, selected: new Set() };
    sgRenderResults(gameId);
    statusEl.className = 'sg-status ok';
    statusEl.textContent = data.partial
      ? t.partialMsg(data.deliveredCount, data.requestedCount)
      : t.doneMsg(data.deliveredCount, data.charged, data.balance);
  } catch (e) {
    statusEl.className = 'sg-status err';
    statusEl.textContent = t.genericError;
  } finally {
    btn.disabled = false;
  }
}

function sgRenderResults(gameId){
  const t = sgT();
  const state = sgState[gameId];
  const wrap = document.getElementById('sgResultsWrap_' + gameId);
  const list = document.getElementById('sgResultList_' + gameId);
  wrap.classList.add('open');
  list.innerHTML = state.combos.map((c, i) => {
    const mainPips = c.main.map(n => `<span class="sg-pip">${String(n).padStart(2,'0')}</span>`).join('');
    const bonusPips = (c.bonus || []).map(n => `<span class="sg-pip bonus">${String(n).padStart(2,'0')}</span>`).join('');
    return `<div class="sg-result-row">
      <input type="checkbox" class="sg-result-check" data-idx="${i}" onchange="sgToggleOne('${gameId}', ${i}, this.checked)">
      <span class="sg-result-no">#${i+1}</span>
      <span class="sg-result-main">${mainPips}${bonusPips}</span>
      <span class="sg-result-overlap">${t.overlapLabel} ${c.overlap}</span>
    </div>`;
  }).join('');
  document.getElementById('sgCheckAll_' + gameId).checked = false;
  document.getElementById('sgSigPicker_' + gameId).classList.remove('open');
}

function sgToggleAll(gameId){
  const checked = document.getElementById('sgCheckAll_' + gameId).checked;
  const state = sgState[gameId];
  state.selected = checked ? new Set(state.combos.map((_, i) => i)) : new Set();
  document.querySelectorAll('#sgResultList_' + gameId + ' .sg-result-check').forEach(cb => { cb.checked = checked; });
}

function sgToggleOne(gameId, idx, checked){
  const state = sgState[gameId];
  if (checked) state.selected.add(idx); else state.selected.delete(idx);
}

function sgGetSelectedCombos(gameId){
  const state = sgState[gameId];
  if (!state) return [];
  if (state.selected.size === 0) return state.combos; // 선택 안 하면 전체
  return state.combos.filter((_, i) => state.selected.has(i));
}

function sgExportPdf(gameId){
  const combos = sgGetSelectedCombos(gameId);
  if (!combos.length) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const gameName = (I18N[currentLang].names[gameId] || {}).name || gameId;
  doc.setFontSize(14);
  doc.text('PaperLotto Strategy Numbers - ' + gameName, 14, 16);
  const rows = combos.map((c, i) => [
    String(i + 1),
    c.main.map(n => String(n).padStart(2, '0')).join(' '),
    (c.bonus && c.bonus.length) ? c.bonus.map(n => String(n).padStart(2, '0')).join(' ') : '-',
    String(c.overlap),
  ]);
  doc.autoTable({
    head: [['No', 'Main Numbers', 'Bonus', 'Prev. Overlap']],
    body: rows, startY: 22, styles: { fontSize: 9 },
  });
  doc.save(gameId + '_strategy_numbers.pdf');
}

function sgExportExcel(gameId){
  const combos = sgGetSelectedCombos(gameId);
  if (!combos.length) return;
  const rows = combos.map((c, i) => ({
    No: i + 1,
    MainNumbers: c.main.join(' '),
    Bonus: (c.bonus || []).join(' '),
    PreviousDrawOverlap: c.overlap,
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Strategy Numbers');
  XLSX.writeFile(wb, gameId + '_strategy_numbers.xlsx');
}

async function sgOpenSignaturePicker(gameId){
  const t = sgT();
  await sgRefreshToken();
  if (!sgAccessToken) { window.location.href = 'paperlotto_login_mockup.html'; return; }
  const picker = document.getElementById('sgSigPicker_' + gameId);
  picker.classList.add('open');
  const select = document.getElementById('sgSigSelect_' + gameId);
  select.innerHTML = `<option value="">${t.pickCollectionPlaceholder}</option><option value="__new__">${t.newCollectionOption}</option>`;
  select.onchange = () => {
    document.getElementById('sgSigNewRow_' + gameId).style.display = select.value === '__new__' ? 'flex' : 'none';
  };
  try {
    const resp = await fetch(SG_SIGNATURE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sgAccessToken },
      body: JSON.stringify({ action: 'list_collections' }),
    });
    const data = await resp.json().catch(() => ({}));
    (data.collections || []).forEach(c => {
      const opt = document.createElement('option');
      opt.value = String(c.id);
      opt.textContent = c.name + ' (' + c.entry_count + ')';
      select.appendChild(opt);
    });
  } catch (e) { /* 목록 조회 실패는 조용히 무시 — 새 컬렉션 만들기는 여전히 가능 */ }
}

async function sgSaveSelected(gameId){
  const t = sgT();
  const statusEl = document.getElementById('sgStatus_' + gameId);
  await sgRefreshToken();
  if (!sgAccessToken) { window.location.href = 'paperlotto_login_mockup.html'; return; }

  const combos = sgGetSelectedCombos(gameId);
  if (!combos.length) { statusEl.className = 'sg-status err'; statusEl.textContent = t.noSelection; return; }

  const select = document.getElementById('sgSigSelect_' + gameId);
  let collectionId = select.value;

  if (collectionId === '__new__' || collectionId === '') {
    const name = (document.getElementById('sgSigNewName_' + gameId).value || '').trim();
    if (!name) { statusEl.className = 'sg-status err'; statusEl.textContent = t.noSelection; return; }
    if (!confirm(t.confirmNewCollection(name))) return;
    try {
      const resp = await fetch(SG_SIGNATURE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sgAccessToken },
        body: JSON.stringify({ action: 'create_collection', name }),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok || !data.collection) {
        statusEl.className = 'sg-status err';
        statusEl.textContent = data.error === 'INSUFFICIENT_POINTS' ? t.insufficientPoints(data.shortfall || 0) : (data.error || t.saveFail);
        return;
      }
      collectionId = data.collection.id;
    } catch (e) {
      statusEl.className = 'sg-status err'; statusEl.textContent = t.saveFail; return;
    }
  }

  let savedCount = 0;
  for (const c of combos) {
    try {
      const resp = await fetch(SG_SIGNATURE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sgAccessToken },
        body: JSON.stringify({
          action: 'add_manual', collection_id: collectionId, game_id: gameId,
          main_numbers: c.main, bonus_numbers: c.bonus || [],
          memo: 'strategy-generator',
        }),
      });
      if (resp.ok) savedCount++;
    } catch (e) { /* 개별 실패는 건너뛰고 계속 진행 */ }
  }
  statusEl.className = savedCount > 0 ? 'sg-status ok' : 'sg-status err';
  statusEl.textContent = savedCount > 0 ? t.saveSuccess(savedCount) : t.saveFail;
  document.getElementById('sgSigPicker_' + gameId).classList.remove('open');
}

function sgOpenHelp(){
  const t = sgT();
  const modal = document.getElementById('sgHelpModal');
  document.getElementById('sgHelpModalTitle').textContent = t.helpModalTitle;
  document.getElementById('sgHelpModalBody').innerHTML = t.helpCards.map(([title, body]) =>
    `<div class="sg-help-card"><div class="hc-title">${title}</div><div class="hc-body">${body}</div></div>`
  ).join('');
  modal.classList.add('open');
}
function sgCloseHelp(){
  document.getElementById('sgHelpModal').classList.remove('open');
}

// URL의 ?open=game_id 를 보고 해당 게임 카드를 자동으로 펼치고 스크롤 (게임 상세페이지 배너 링크용)
function sgHandleOpenParam(){
  const params = new URLSearchParams(location.search);
  const openId = params.get('open');
  if (!openId || !GAMES.some(g => g.id === openId)) return;
  openCards.add(openId);
  currentRegion = 'all';
  render();
  setTimeout(() => {
    const card = document.querySelector('.game-card[data-id="' + openId + '"]');
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 150);
}

// 첫 번째 게임은 기본으로 펼쳐서 보여줌
render();
sgHandleOpenParam();
</script>
