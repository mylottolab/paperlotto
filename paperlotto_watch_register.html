<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>당첨결과 알림받기 — PaperLotto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --board:#0c1020; --board-2:#111731; --board-line:#242c4d;
  --gold:#b8862e; --gold-bright:#e0aa4e;
  --text-hi:#f2efe4; --text-mid:#a7adc7; --text-dim:#6b7195;
  --ok:#3f9d6d; --bad:#d15b48;
}
body.light-mode{
  --board:#f2efe4; --board-2:#e8e2d0; --board-line:#d9d1ba;
  --gold:#a8781f; --gold-bright:#c9932e;
  --text-hi:#1c2130; --text-mid:#4c5372; --text-dim:#7a7f9a;
}
*{box-sizing:border-box;}
body{ margin:0; background:var(--board); color:var(--text-hi); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }

.header{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--board-line); flex-wrap:wrap; gap:10px; }
.brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; }
.brand-mark{ width:32px; height:32px; border-radius:9px; background:var(--gold); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-family:'Fraunces',serif; }
.brand-name{ font-size:15px; font-weight:700; }
.header-right{ display:flex; align-items:center; gap:8px; }
.lang-toggle{ display:flex; border:1px solid var(--board-line); border-radius:20px; overflow:hidden; }
.lang-toggle button{ border:none; background:transparent; color:var(--text-dim); font-size:12px; font-weight:600; padding:5px 10px; cursor:pointer; font-family:'Inter',sans-serif; }
.lang-toggle button.active{ background:var(--gold); color:#fff; }
.theme-toggle{ border:1px solid var(--board-line); background:transparent; color:var(--text-mid); width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:13px; }
.balance{ font-size:13px; font-weight:600; color:var(--gold-bright); font-family:'IBM Plex Mono',monospace; }

main{ max-width:720px; margin:0 auto; padding:24px 16px 80px; }
.page-title{ font-size:24px; font-weight:700; margin-bottom:6px; font-family:'Fraunces',serif; }
.page-sub{ font-size:13px; color:var(--text-dim); margin-bottom:20px; line-height:1.6; }

.game-tabs{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px; }
.game-tab-btn{ padding:7px 13px; border-radius:999px; border:1px solid var(--board-line); background:var(--board-2); color:var(--text-mid); font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; }
.game-tab-btn.active{ background:var(--gold); border-color:var(--gold); color:#fff; }

.card{ background:var(--board-2); border:1px solid var(--board-line); border-radius:16px; padding:18px; margin-bottom:14px; }
.round-line{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.round-no{ font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600; color:var(--gold-bright); }
.round-sub{ font-size:12.5px; color:var(--text-mid); font-family:'IBM Plex Mono',monospace; margin-top:4px; }
.round-note{ font-size:12px; color:var(--text-dim); margin-top:4px; }

.field-label{ display:block; font-size:13px; font-weight:600; margin-bottom:4px; }
.rule-line{ font-size:12px; color:var(--text-dim); margin-bottom:14px; line-height:1.6; }

.entry-row{ display:flex; align-items:center; gap:6px; margin-bottom:6px; flex-wrap:wrap; }
.row-tag{ width:18px; flex-shrink:0; font-size:12px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace; }
.cells{ display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
.cell{
  width:44px; height:44px; text-align:center; border-radius:50%;
  background:var(--board); border:1.5px solid var(--board-line); color:var(--text-hi);
  font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600; padding:0;
}
.cell:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(184,134,46,.18); }
.cell.bonus{ border:2px dashed var(--gold); background:transparent; color:var(--gold-bright); font-weight:700; }
.cell.err{ border-color:var(--bad) !important; box-shadow:0 0 0 3px rgba(209,91,72,.18); }
.plus{ color:var(--text-dim); font-size:16px; padding:0 3px; }
.bonus-wrap{ display:flex; flex-direction:column; }
.bonus-cells{ display:flex; gap:5px; }
.bonus-tag{ font-size:10.5px; color:var(--gold-bright); text-align:center; margin-top:3px; }
.row-msg{ font-size:11.5px; color:var(--bad); margin:0 0 8px 24px; min-height:14px; }
.row-clear{ border:none; background:transparent; color:var(--text-dim); cursor:pointer; font-size:15px; padding:4px 6px; }

button.add-row{ width:100%; border:1px dashed var(--board-line); background:transparent; color:var(--text-mid); border-radius:12px; padding:11px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; margin-top:4px; }
button.add-row:disabled{ opacity:.4; cursor:not-allowed; }

.bulk-toggle{ border:none; background:transparent; color:var(--gold-bright); font-size:12.5px; font-weight:600; cursor:pointer; padding:12px 0 0; font-family:inherit; }
textarea{ width:100%; min-height:110px; background:var(--board); border:1px solid var(--board-line); border-radius:12px; color:var(--text-hi); font-family:'IBM Plex Mono',monospace; font-size:14px; line-height:1.9; padding:12px 14px; resize:vertical; margin-top:10px; }
textarea:focus{ outline:none; border-color:var(--gold); }
.bulk-hint{ font-size:12px; color:var(--text-dim); margin-top:8px; line-height:1.6; }
button.bulk-apply{ width:100%; border:none; border-radius:10px; padding:11px; font-size:13.5px; font-weight:700; cursor:pointer; background:var(--board-line); color:var(--text-hi); font-family:inherit; margin-top:10px; }

.status-row{ margin-top:12px; }
.count-badge{ font-size:12.5px; font-family:'IBM Plex Mono',monospace; color:var(--text-mid); }
.count-badge.over{ color:var(--bad); font-weight:700; }

.pv-line{ display:flex; align-items:center; gap:6px; padding:7px 0; border-bottom:1px solid var(--board-line); flex-wrap:wrap; }
.pv-line:last-child{ border-bottom:none; }
.pv-idx{ font-size:11px; color:var(--text-dim); width:22px; font-family:'IBM Plex Mono',monospace; flex-shrink:0; }
.ball{ width:30px; height:30px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; font-family:'IBM Plex Mono',monospace; background:var(--board); border:1.5px solid var(--board-line); color:var(--text-hi); }
.ball.bonus{ background:transparent; border:2px dashed var(--gold); color:var(--gold-bright); }

.summary{ font-size:13.5px; line-height:2; }
/* 2026-09-02: 내가 등록한 알림 목록 */
.sec-title{ font-size:14px; font-weight:700; margin-bottom:4px; }
.sec-desc{ font-size:11.5px; color:var(--text-dim); line-height:1.6; margin-bottom:12px; }
/* ⚠ 등록이 쌓이면 화면이 한없이 길어집니다. 여기서 끊고 스크롤을 둡니다. */
.ent-scroll{ max-height:300px; overflow-y:auto; padding-right:4px; }
.ent-scroll::-webkit-scrollbar{ width:6px; }
.ent-scroll::-webkit-scrollbar-thumb{ background:var(--board-line); border-radius:3px; }
.ent-item{ padding:11px 0; border-bottom:1px solid var(--board-line); }
.ent-item:last-child{ border-bottom:none; }
.ent-head{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
.ent-game{ font-size:12.5px; font-weight:700; flex:1; min-width:130px; }
.ent-when{ font-size:10.5px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace; }
.ent-tag{ font-size:10px; font-weight:800; padding:2px 8px; border-radius:20px; flex-shrink:0; }
.ent-tag.wait{ background:rgba(167,173,199,.12); color:var(--text-dim); }
.ent-tag.top{ background:rgba(224,170,78,.18); color:var(--gold-bright); }
.ent-tag.win{ background:rgba(34,150,90,.16); color:#4cc38a; }
.ent-tag.lose{ background:rgba(167,173,199,.1); color:var(--text-dim); }
.ent-tag.refund{ background:rgba(212,83,126,.14); color:#e0789f; }
.ent-nums{ display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
.ent-line{ display:flex; flex-wrap:wrap; gap:3px; align-items:center; width:100%; margin-bottom:3px; }
.ent-b{ min-width:22px; height:22px; padding:0 5px; border-radius:11px; background:var(--board);
  border:1px solid var(--board-line); color:var(--text-hi); font-size:10.5px; font-weight:700;
  display:inline-flex; align-items:center; justify-content:center;
  font-family:'IBM Plex Mono',monospace; }
.ent-b.bonus{ background:rgba(184,134,46,.18); border-color:var(--gold); color:var(--gold-bright); }
.ent-more{ font-size:10.5px; color:var(--text-dim); }
.ent-empty{ text-align:center; padding:18px 10px; color:var(--text-dim); font-size:12px; line-height:1.7; }
.summary .row{ display:flex; justify-content:space-between; gap:12px; }
.summary .k{ color:var(--text-dim); }
.summary .v{ font-weight:600; font-family:'IBM Plex Mono',monospace; text-align:right; }

button.primary{ width:100%; border:none; border-radius:12px; padding:15px; font-size:15px; font-weight:700; cursor:pointer; background:var(--gold); color:#fff; font-family:inherit; }
button.primary:disabled{ opacity:.45; cursor:not-allowed; }
button.ghost, a.ghost{ display:block; text-align:center; text-decoration:none; width:100%; border:1px solid var(--board-line); border-radius:12px; padding:13px; font-size:14px; font-weight:600; cursor:pointer; background:transparent; color:var(--text-mid); font-family:inherit; margin-top:10px; }

.notice{ font-size:12px; color:var(--text-dim); line-height:1.7; margin-top:14px; padding:12px 14px; border:1px dashed var(--board-line); border-radius:10px; }
.msg{ font-size:13.5px; padding:12px 14px; border-radius:10px; margin-bottom:14px; line-height:1.6; display:none; }
.msg.bad{ background:rgba(209,91,72,.12); color:var(--bad); border:1px solid rgba(209,91,72,.3); }
.msg.ok{ background:rgba(63,157,109,.12); color:var(--ok); border:1px solid rgba(63,157,109,.3); }
.hidden{ display:none !important; }

@media (max-width:430px){
  .cell{ width:38px; height:38px; font-size:14px; }
  .cells{ gap:4px; }
}

<script>
// =====================================================
// PaperLotto — 당첨결과 알림 등록 화면
// 2026-08-30 (15차) · v2 — 종목별 입력칸 방식
//
// v1은 붙여넣기 칸 하나뿐이라 규칙을 설명문으로 알려야 했습니다.
// 설명문은 읽히지 않으므로, 화면 자체가 규칙이 되도록 칸으로 바꿨습니다.
//   - 칸 개수 = 그 종목의 번호 개수 (더 넣을 수 없음)
//   - 칸마다 최대값이 다름 (미국 파워볼: 본번호 1~69, 파워볼칸 1~26)
//   - 숫자가 아닌 글자는 아예 안 들어가고, 범위 밖·중복은 즉시 붉게 표시
//   - 보너스 칸은 점선 테두리로 떼어놓고 이름표를 붙임
// 붙여넣기는 [여러 장 한꺼번에]로 접어두었습니다(50줄 넣는 분용).
//
// 🔴 손님이 보너스를 직접 넣는 종목은 넷뿐입니다.
//   us_powerball · us_megamillions · eu_euromillions · au_powerball
//   오즈로또의 서플리멘터리 3개, 로또7의 보너스 2개 등은 운영사가 본번호 풀에서
//   뽑는 것이라 복권에 적혀 있지 않고 손님이 고를 수도 없습니다 → 칸을 만들지 않습니다.
//   (paperlotto_checker.js의 SEPARATE_BONUS_GAMES와 같은 기준)
//
// ⚠ GAMES는 submit-entries.ts의 GAME_SPECS,
//   watch-register.ts의 GAME_RULES와 반드시 같아야 합니다.
// =====================================================

const SUPABASE_URL = 'https://wzrqaozlbfyejsbvnrxk.supabase.co';
const SUPABASE_ANON = 'sb_publishable_3KrYMzwrVlbYr-e9d8UiLA_KgvSs8tC';
// 🔴 2026-08-30: supabase-js 클라이언트를 쓰지 않습니다.
//   이 화면에서 클라이언트를 하나 더 만들면 다른 스크립트와 인증이 엉켜
//   (콘솔의 'Multiple GoTrueClient instances' 경고) 다음 두 증상이 났습니다.
//     · getSession()이 응답을 안 줘서 등록이 "등록하는 중…"에서 멈춤
//     · 조회에 로그인 정보가 안 붙어 잔액이 0 P로 나옴 (RLS가 빈 결과를 돌려줌)
//   paperlotto_checker.js처럼 REST를 직접 부르는 방식으로 통일했습니다.

// 로그인 토큰을 브라우저 저장소에서 직접 읽습니다.
// 🔴 2026-08-31: 토큰 만료 처리
//   supabase-js를 쓰지 않으므로(인증 충돌 때문에 걷어냈습니다) 토큰이 저절로
//   갱신되지 않습니다. 저장된 토큰은 한 시간쯤 지나면 못 쓰고, 그대로 보내면
//   함수가 401을 돌려줍니다. 만료가 가까우면 여기서 직접 갱신합니다.
function readSession(){
  try {
    const key = Object.keys(localStorage).find(k => k.startsWith('sb-') && k.endsWith('-auth-token'));
    if (!key) return null;
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    const s = obj.currentSession || obj;   // 저장 형태가 두 가지입니다
    return { key, obj, s };
  } catch (e) {
    console.error('[watch] 토큰을 읽지 못했습니다', e);
    return null;
  }
}

async function ensureToken(){
  const info = readSession();
  if (!info) return null;
  const { key, obj, s } = info;

  const now = Math.floor(Date.now() / 1000);
  // 만료 1분 전부터 미리 갱신합니다. 요청 도중에 만료되는 것을 막습니다.
  if (s.access_token && s.expires_at && Number(s.expires_at) - 60 > now) return s.access_token;
  if (!s.refresh_token) return s.access_token || null;

  try {
    const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON },
      body: JSON.stringify({ refresh_token: s.refresh_token }),
    });
    if (!res.ok) {
      console.warn('[watch] 토큰 갱신 실패 — 다시 로그인이 필요합니다', res.status);
      return null;
    }
    const fresh = await res.json();
    // 저장 형태를 그대로 유지하며 갱신합니다 (다른 화면도 같은 값을 씁니다)
    const merged = obj.currentSession
      ? Object.assign({}, obj, { currentSession: Object.assign({}, obj.currentSession, fresh) })
      : Object.assign({}, obj, fresh);
    try { localStorage.setItem(key, JSON.stringify(merged)); } catch (e) {}
    return fresh.access_token || null;
  } catch (e) {
    console.error('[watch] 토큰 갱신 중 오류', e);
    return null;
  }
}

// REST 호출. token이 있으면 로그인한 사람으로, 없으면 익명으로 나갑니다.
async function rest(path, token){
  const headers = { apikey: SUPABASE_ANON };
  if (token) headers.Authorization = 'Bearer ' + token;
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, { headers });
  if (!res.ok) throw new Error('REST ' + res.status + ' ' + (await res.text()).slice(0, 200));
  return res.json();
}

const MAX_LINES = 50;
const START_ROWS = 5;   // 복권 한 장이 보통 5줄이라 그대로 옮길 수 있게

// roundLabel:false — 회차를 쓰지 않는 종목 (그 나라 손님은 회차를 모릅니다)

// 🔴 2026-08-31: 손님의 브라우저 언어로 시작합니다.
//   영어권을 주 대상으로 하지만 기본을 영어로 고정하면 한국 손님이 영어를 봅니다.
//   반대로 한국어로 고정하면 영어권 손님이 한국어를 봅니다. 둘 다 틀리는 대신
//   브라우저가 알려주는 언어를 따르면 양쪽 다 맞습니다.
//   (Aliascall의 getAliascallLang()과 같은 방식입니다)
//   ⚠ 한 번이라도 화면에서 언어를 바꾸시면 그 값이 우선합니다.
function detectLang(){
  // 공용 파일이 있으면 그것을 씁니다 (주소 ?lang= 까지 함께 처리됩니다)
  if (typeof window.getPaperLottoLang === 'function') {
    const v = window.getPaperLottoLang();
    if (T[v]) return v;
  }
  // 대비책 — 공용 파일을 못 불러왔을 때
  try {
    const q = new URLSearchParams(location.search).get('lang');
    if (q) { const c = q.toLowerCase(); return c.indexOf('ko') === 0 ? 'ko' : (c.indexOf('ja') === 0 ? 'ja' : 'en'); }
  } catch (e) {}
  const saved = localStorage.getItem('paperlotto_lang');
  if (saved && T[saved]) return saved;
  const nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
  const l = String(nav).toLowerCase();
  if (l.indexOf('ko') === 0) return 'ko';
  if (l.indexOf('ja') === 0) return 'ja';
  return 'en';
}

function setText(id, value, key){
  const el = $(id);
  if (!el) { console.warn('[watch] 화면에 없는 칸:', id); return; }
  if (value === undefined || value === null) {

    el.textContent = key || id;
    return;
  }
  el.textContent = value;
}

async function loadBalance(){
  const token = await ensureToken();
  if (!token){ balance = null; $('balanceLabel').textContent = '—'; return; }
  try {
    // 🔴 point_ledger를 화면에서 직접 읽지 않습니다.
    //   RLS에 막혀 200 + 빈 배열이 오고, 그러면 잔액이 조용히 0 P가 됩니다.
    //   (그 상태로 계산하면 확인 화면에 -100 P 가 나옵니다)
    //   돈에 해당하는 표라 잠금을 열지 않고, 서버가 값만 내주게 했습니다.
    const res = await fetch(SUPABASE_URL + '/functions/v1/watch-balance', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    });
    if (!res.ok) throw new Error('watch-balance ' + res.status);
    const data = await res.json();
    if (typeof data.balance !== 'number') throw new Error('balance 없음');
    balance = data.balance;
    $('balanceLabel').textContent = balance.toLocaleString() + ' P';
  } catch (e) {
    // 실패하면 '—'로 둡니다. 0 P로 두면 "잔액 없음"으로 오해됩니다.
    // 정확한 잔액은 등록 후 서버 응답(balanceAfter)으로 채워집니다.
    console.error('[watch] 잔액 조회 실패', e);
    balance = null;
    $('balanceLabel').textContent = '—';
  }
}

// 🔴 서버(watch-register)와 같은 계산입니다.
//   회차 = 마지막 회차 + 1
//   추첨일 = 최근 추첨일들의 요일에서 추론 (요일표를 코드에 박지 않습니다)
function ymdUTC(d){ return d.toISOString().slice(0,10); }
function inferNextDate(rows){
  const dates = rows.map(r => r.draw_date).filter(Boolean)
    .map(s => new Date(String(s).slice(0,10) + 'T00:00:00Z'))
    .filter(d => !isNaN(d.getTime())).sort((a,b) => b - a);
  if (!dates.length) return null;
  const last = dates[0], days = new Set(dates.map(d => d.getUTCDay()));
  for (let i = 1; i <= 14; i++){
    const c = new Date(last.getTime() + i * 86400000);
    if (days.has(c.getUTCDay())) return ymdUTC(c);
  }
  return null;
}
function formatDate(ymd){
  if (!ymd) return null;
  const d = new Date(ymd + 'T00:00:00Z');
  if (isNaN(d.getTime())) return null;
  const locale = lang === 'ko' ? 'ko-KR' : (lang === 'ja' ? 'ja-JP' : 'en-US');
  return d.toLocaleDateString(locale, { timeZone:'UTC', year:'numeric', month:'long', day:'numeric', weekday:'short' });
}

async function loadNextRound(){
  $('roundNoTxt').textContent = '—';
  $('roundSubTxt').textContent = '';
  nextRound = null; nextDate = null;
  let rows = [];
  try {
    // 추첨 결과는 누구나 볼 수 있는 자료라 토큰 없이 부릅니다.
    rows = await rest('draw_results?select=round_no,draw_date&game_id=eq.' + encodeURIComponent(gameId)
                      + '&order=round_no.desc&limit=12');
  } catch (e) {
    console.error('[watch] 회차 조회 실패', e);
    return;
  }
  nextRound = ((rows[0] && rows[0].round_no) || 0) + 1;
  nextDate = inferNextDate(rows);
  renderRound();
}

function renderRound(){
  const spec = GAMES[gameId];
  const dateTxt = formatDate(nextDate);
  const roundTxt = nextRound === null ? '—' : fill(t().roundValue, { n: nextRound.toLocaleString() });
  if (!spec.roundLabel){
    $('roundNoTxt').textContent = dateTxt || roundTxt;
    $('roundSubTxt').textContent = dateTxt ? fill(t().roundSub, { r: roundTxt }) : '';
  } else {
    $('roundNoTxt').textContent = roundTxt;
    $('roundSubTxt').textContent = dateTxt ? fill(t().dateSub, { d: dateTxt }) : '';
  }
}
function roundDisplay(round, date){
  const spec = GAMES[gameId];
  const dateTxt = formatDate(date);
  const roundTxt = (round === null || round === undefined) ? '—' : fill(t().roundValue, { n: Number(round).toLocaleString() });
  if (!spec.roundLabel) return dateTxt || roundTxt;
  return dateTxt ? roundTxt + ' · ' + dateTxt : roundTxt;
}

    let cells = '';
    for (let c = 0; c < spec.main; c++){
      cells += '<input class="cell" type="text" inputmode="numeric" maxlength="2" data-row="' + r + '" data-kind="main">';
    }
    if (spec.bonus > 0){
      cells += '<span class="plus">+</span><div class="bonus-wrap"><div class="bonus-cells">';
      for (let b = 0; b < spec.bonus; b++){
        cells += '<input class="cell bonus" type="text" inputmode="numeric" maxlength="2" data-row="' + r + '" data-kind="bonus">';
      }
      cells += '</div><div class="bonus-tag">' + bonusName(gameId) + '</div></div>';
    }
    html += '<div class="entry-row" data-row="' + r + '">'
          + '<span class="row-tag">' + rowTag(r) + '</span>'
          + '<div class="cells">' + cells + '</div>'
          + '<button class="row-clear" data-clear="' + r + '" title="clear">&#10005;</button>'
          + '</div><div class="row-msg" data-msg="' + r + '"></div>';
  }
  $('rowsBox').innerHTML = html;
  validateAll();
}

function cellsOf(row, kind){
  return Array.from(document.querySelectorAll('#rowsBox .cell[data-row="' + row + '"][data-kind="' + kind + '"]'));
}
function msgOf(row){ return document.querySelector('#rowsBox [data-msg="' + row + '"]'); }

function readRow(r){
  const spec = GAMES[gameId];
  const main = cellsOf(r, 'main').map(el => el.value.trim());
  const bonus = spec.bonus > 0 ? cellsOf(r, 'bonus').map(el => el.value.trim()) : [];
  if (main.every(v => v === '') && bonus.every(v => v === '')) return null;
  return { main, bonus };
}

// 🔴 검사 결과는 칸 단위로 보여줍니다. 어느 칸이 문제인지 손님이 바로 봅니다.
//   빈 줄은 오류가 아닙니다 — 그냥 등록에서 빠집니다.
function validateRow(r){
  const spec = GAMES[gameId];
  const mainEls = cellsOf(r, 'main');
  const bonusEls = spec.bonus > 0 ? cellsOf(r, 'bonus') : [];
  mainEls.concat(bonusEls).forEach(el => el.classList.remove('err'));
  const msgEl = msgOf(r);
  if (msgEl) msgEl.textContent = '';

  if (!readRow(r)) return null;

  let ok = true;
  const mainNums = [];
  const seen = new Set();

  mainEls.forEach((el) => {
    const v = el.value.trim();
    if (v === ''){ ok = false; return; }
    const n = Number(v);
    if (!Number.isInteger(n) || n < 1 || n > spec.range){ el.classList.add('err'); ok = false; return; }
    if (seen.has(n)){
      el.classList.add('err'); ok = false;
      if (msgEl) msgEl.textContent = t().dup;
      return;
    }
    seen.add(n);
    mainNums.push(n);
  });

  const bonusNums = [];
  const bseen = new Set();
  bonusEls.forEach((el) => {
    const v = el.value.trim();
    if (v === ''){ ok = false; return; }
    const n = Number(v);
    if (!Number.isInteger(n) || n < 1 || n > spec.bonusRange){ el.classList.add('err'); ok = false; return; }
    // 럭키스타처럼 보너스가 2개인 종목은 그 안에서도 중복이 안 됩니다
    if (spec.bonus > 1 && bseen.has(n)){
      el.classList.add('err'); ok = false;
      if (msgEl) msgEl.textContent = t().dup;
      return;
    }
    bseen.add(n);
    bonusNums.push(n);
  });

  if (!ok || mainNums.length !== spec.main || bonusNums.length !== spec.bonus) return null;
  return { main: mainNums, bonus: bonusNums };
}

function validateAll(){
  parsed = [];
  for (let r = 0; r < rowCount; r++){
    const v = validateRow(r);
    if (v) parsed.push(v);
  }
  $('countBadge').textContent = fill(t().count, { n: parsed.length, max: MAX_LINES });
  $('countBadge').classList.toggle('over', parsed.length > MAX_LINES);
  $('addRowBtn').disabled = rowCount >= MAX_LINES;
  $('toConfirmBtn').disabled = !(parsed.length > 0 && parsed.length <= MAX_LINES);
}

function writeRow(r, main, bonus){
  cellsOf(r, 'main').forEach((el, i) => { el.value = (main && main[i] !== undefined && main[i] !== '') ? String(main[i]) : ''; });
  if (GAMES[gameId].bonus > 0){
    cellsOf(r, 'bonus').forEach((el, i) => { el.value = (bonus && bonus[i] !== undefined && bonus[i] !== '') ? String(bonus[i]) : ''; });
  }
}

// ── 칸 사이 이동 ──
// ⚠ 1~45처럼 한 자리와 두 자리가 섞이면 "자동으로만" 넘기는 것은 불가능합니다.
//   (4를 치면 넘겨야 하나? 45가 있으니 기다려야 합니다)
//   두 자리를 채우면 자동으로, 한 자리는 공백·Enter로 넘어가게 했습니다.
function allCells(){ return Array.from(document.querySelectorAll('#rowsBox .cell')); }
function focusNext(el){ const a = allCells(), i = a.indexOf(el); if (i >= 0 && i + 1 < a.length) a[i + 1].focus(); }
function focusPrev(el){ const a = allCells(), i = a.indexOf(el); if (i > 0) a[i - 1].focus(); }

$('rowsBox').addEventListener('input', (e) => {
  const el = e.target.closest('.cell');
  if (!el) return;
  // 숫자가 아닌 글자는 아예 남기지 않습니다
  const cleaned = el.value.replace(/[^0-9]/g, '').slice(0, 2);
  if (cleaned !== el.value) el.value = cleaned;
  clearMsg();
  validateAll();
  if (el.value.length === 2 && !el.classList.contains('err')) focusNext(el);
});

$('rowsBox').addEventListener('keydown', (e) => {
  const el = e.target.closest('.cell');
  if (!el) return;
  if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); focusNext(el); return; }
  if (e.key === 'Backspace' && el.value === ''){ e.preventDefault(); focusPrev(el); return; }
  if (e.key === 'ArrowRight') focusNext(el);
  if (e.key === 'ArrowLeft') focusPrev(el);
});

// 한 칸에 여러 숫자를 붙여넣으면 뒤 칸으로 나눠 담습니다
$('rowsBox').addEventListener('paste', (e) => {
  const el = e.target.closest('.cell');
  if (!el) return;
  const text = (e.clipboardData || window.clipboardData).getData('text');
  const nums = String(text).split(/[\s,，、]+/).filter(Boolean);
  if (nums.length <= 1) return;
  e.preventDefault();
  const a = allCells();
  let i = a.indexOf(el);
  nums.forEach((n) => {
    if (i < 0 || i >= a.length) return;
    a[i].value = String(n).replace(/[^0-9]/g, '').slice(0, 2);
    i++;
  });
  clearMsg();
  validateAll();
});

$('rowsBox').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-clear]');
  if (!btn) return;
  const r = btn.dataset.clear;
  document.querySelectorAll('#rowsBox .cell[data-row="' + r + '"]').forEach(el => { el.value = ''; el.classList.remove('err'); });
  clearMsg();
  validateAll();
});

$('addRowBtn').addEventListener('click', () => {
  if (rowCount >= MAX_LINES) return;
  const keep = [];
  for (let r = 0; r < rowCount; r++) keep.push(readRow(r));
  rowCount = Math.min(MAX_LINES, rowCount + 5);
  buildRows();
  keep.forEach((v, r) => { if (v) writeRow(r, v.main, v.bonus); });
  validateAll();
});

// ── 여러 장 한꺼번에 (접힘) ──
$('bulkToggle').addEventListener('click', () => {
  const hidden = $('bulkBox').classList.toggle('hidden');
  $('bulkToggle').textContent = hidden ? t().bulkOpen : t().bulkClose;
});

$('bulkApplyBtn').addEventListener('click', () => {
  const spec = GAMES[gameId];
  const need = spec.main + spec.bonus;
  const lines = $('bulkInput').value.split(/\n+/).map(s => s.trim()).filter(Boolean);
  const got = [];
  lines.forEach((line) => {
    const nums = line.split(/[\s,，、]+/).filter(Boolean).map(Number).filter(n => Number.isInteger(n));
    if (nums.length === need) got.push({ main: nums.slice(0, spec.main), bonus: nums.slice(spec.main) });
  });
  if (!got.length){ showMsg(t().bulkNone); return; }

  const use = got.slice(0, MAX_LINES);
  rowCount = Math.max(START_ROWS, Math.min(MAX_LINES, use.length));
  buildRows();
  use.forEach((v, r) => writeRow(r, v.main, v.bonus));
  validateAll();
  $('bulkBox').classList.add('hidden');
  setText('bulkToggle', t().bulkOpen, 'bulkOpen');
  showMsg(fill(t().bulkDone, { n: use.length }), 'ok');
});

function ballHtml(n, isBonus){ return '<span class="ball' + (isBonus ? ' bonus' : '') + '">' + n + '</span>'; }

function renderPreview(list, mountId){
  const spec = GAMES[gameId];
  $(mountId).innerHTML = list.map((c, i) => {
    const main = c.main.map(n => ballHtml(n, false)).join('');
    const bonus = spec.bonus > 0 ? '<span class="plus">+</span>' + c.bonus.map(n => ballHtml(n, true)).join('') : '';
    return '<div class="pv-line"><span class="pv-idx">' + rowTag(i) + '</span>' + main + bonus + '</div>';
  }).join('');
}

function summaryHtml(rows){
  return rows.map(function(kv){
    return '<div class="row"><span class="k">' + t()[kv[0]] + '</span><span class="v">' + kv[1] + '</span></div>';
  }).join('');
}

function goStep(name){
  ['stepInput','stepConfirm','stepDone'].forEach(s => $(s).classList.toggle('hidden', s !== name));
  window.scrollTo({ top:0, behavior:'smooth' });
}

function showConfirm(){
  clearMsg();
  const cost = 100;
  const rows = [
    ['confirmGame', gameName(gameId)],
    ['confirmRound', roundDisplay(nextRound, nextDate)],
    ['confirmLines', parsed.length],
    ['confirmCost', cost.toLocaleString() + ' P'],
  ];
  // 🔴 잔액을 모르면 "등록 후 잔액" 줄을 아예 보여주지 않습니다.
  //   예전에는 null - 100 = -100 이 나와 손님이 마이너스 잔액으로 오해했습니다.
  //   (화면에서 point_ledger를 못 읽는 경우가 있습니다 — 정확한 잔액은 등록 후 서버가 알려줍니다)
  if (typeof balance === 'number') {
    rows.push(['confirmAfter', (balance - cost).toLocaleString() + ' P']);
  }
  $('confirmSummary').innerHTML = summaryHtml(rows);
  renderPreview(parsed, 'confirmPreview');
  $('submitBtn').disabled = false;
  setText('submitBtn', t().submit, 'submit');
  goStep('stepConfirm');
}

async function submit(){
  clearMsg();
  const btn = $('submitBtn');
  btn.disabled = true;
  btn.textContent = t().loading;
  // 🔴 2026-08-30: 성공 경로에서 단추를 되돌리지 않아, 두 번째 등록 때
  //   확인 화면의 단추가 "등록하는 중…" 상태로 잠겨 있었습니다.
  //   눌러도 아무 일이 없어 멈춘 것처럼 보였습니다. finally로 항상 되돌립니다.
  try {
    const token = await ensureToken();
    if (!token){ showMsg(t().errLogin); return; }

    const spec = GAMES[gameId];
    // 🔴 이중 차감 방지용 표.
    //   한 번의 등록 시도마다 하나를 만들어 두고, 성공할 때까지 그대로 씁니다.
    //   단추를 두 번 눌러도 같은 표가 가므로 서버가 한 건으로 처리합니다.
    //   ⚠ 같은 조합을 여러 장 사거나 나중에 추가로 등록하는 것은 정상이므로
    //     번호로는 막지 않습니다. 오직 '같은 요청'만 걸러냅니다.
    if (!pendingRequestId) pendingRequestId = newRequestId();

    const body = {
      gameId: gameId,
      lines: parsed.map(c => c.main),
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Seoul',
      requestId: pendingRequestId,
      // 🔴 지금 보고 계신 언어를 함께 보냅니다. 알림도 이 언어로 갑니다.
      //   가입 때의 preferred_lang보다 정확합니다.
      lang: lang,
    };
    if (spec.bonus > 0) body.bonusLines = parsed.map(c => c.bonus);

    const res = await fetch(SUPABASE_URL + '/functions/v1/watch-register', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + token },
      body: JSON.stringify(body),
    });
    const data = await res.json();

    if (!res.ok){
      if (data.error === 'INSUFFICIENT_POINTS') showMsg(fill(t().errPoints, { short:(data.shortfall || 0).toLocaleString(), bal:(data.balance || 0).toLocaleString() }));
      else if (data.error === 'AUTH_REQUIRED') showMsg(t().errLogin);
      else showMsg(fill(t().errEtc, { msg: data.error || res.status }));
      goStep('stepConfirm');
      return;
    }

    // 🔴 실제 등록된 회차·추첨일은 서버가 정합니다. 응답 값을 그대로 보여줍니다.
    $('doneSummary').innerHTML = summaryHtml([
      ['confirmGame', gameName(gameId)],
      ['confirmRound', roundDisplay(data.roundNo, data.drawDate)],
      ['confirmLines', data.lineCount],
      ['confirmCost', Number(data.pointsCharged).toLocaleString() + ' P'],
    ].concat(typeof data.balanceAfter === 'number'
      ? [['confirmAfter', Number(data.balanceAfter).toLocaleString() + ' P']]
      : []));
    if (typeof data.balanceAfter === 'number'){
      balance = data.balanceAfter;
      $('balanceLabel').textContent = balance.toLocaleString() + ' P';
    }
    pendingRequestId = null;   // 다음 등록은 새 표로 — 별건이므로 다시 차감됩니다
    loadMyEntries();           // 2026-09-02: 방금 등록한 것이 바로 아래 목록에 나타납니다
    showMsg(t().doneTitle, 'ok');
    goStep('stepDone');
  } catch (e) {
    console.error('[watch] 등록 오류', e);
    showMsg(fill(t().errEtc, { msg: String(e.message || e) }));
  } finally {
    // 성공이든 실패든 반드시 원래대로. 다음 등록에서 단추가 잠겨 있으면 안 됩니다.
    btn.disabled = false;
    btn.textContent = t().submit;
  }
}


// ─────────────────────────────────────────────────────
// 내가 등록한 알림 (2026-09-02 신설)
//
// 🔴 등록하는 화면에서 바로 보여드립니다.
//   지금까지는 알림 설정까지 찾아가야 볼 수 있었습니다. 그래서 이미 등록한
//   회차를 모르고 또 등록해 100P를 두 번 내는 일이 생겼습니다.
//
// 🔴 이 창에서 방금 한 것만이 아니라 서버에 있는 것 전부를 보여줍니다.
//   한참 뒤에 새 창으로 다시 오셔도 "아, 이미 넣었구나"를 알 수 있어야 합니다.
//
// ⚠ 같은 회차를 여러 번 등록하는 것을 막지 않습니다. 실제로 여러 장 사십니다.
//   대신 등록한 번호를 함께 보여드려 어느 것이 무엇인지 구분되게 합니다.
// ─────────────────────────────────────────────────────
let myEntriesReady = false;   // 화면이 다 뜬 뒤에만 목록을 다시 그립니다

function entBall(n, isBonus){
  return '<span class="ent-b' + (isBonus ? ' bonus' : '') + '">' + n + '</span>';
}

// 한 등록의 번호를 그립니다.
// ⚠ 50줄까지 등록할 수 있습니다. 다 그리면 목록이 화면을 덮습니다.
//   앞의 세 줄만 보이고 나머지는 개수로 알려드립니다.
function entLinesHtml(it){
  const lines = Array.isArray(it.lines) ? it.lines : [];
  const bonus = Array.isArray(it.bonusLines) ? it.bonusLines : null;
  if (!lines.length) return '';

  const SHOW = 3;
  let html = lines.slice(0, SHOW).map(function(line, i){
    let h = (line || []).map(function(n){ return entBall(n, false); }).join('');
    const b = bonus && bonus[i];
    if (b && b.length) {
      h += '<span style="color:var(--text-dim);margin:0 2px;">+</span>' +
        b.map(function(n){ return entBall(n, true); }).join('');
    }
    return '<span class="ent-line">' + h + '</span>';
  }).join('');

  if (lines.length > SHOW) {
    html += '<span class="ent-more">' + fill(t().entMore, { n: lines.length - SHOW }) + '</span>';
  }
  return '<div class="ent-nums">' + html + '</div>';
}

async function loadMyEntries(){
  const box = $('myEntList');
  const token = await ensureToken();
  if (!token) { box.innerHTML = '<div class="ent-empty">' + t().entLogin + '</div>'; return; }

  box.innerHTML = '<div class="ent-empty">…</div>';
  try {
    const res = await fetch(SUPABASE_URL + '/functions/v1/watch-prefs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ action: 'entries' }),
    });
    if (!res.ok) throw new Error('watch-prefs ' + res.status);
    const data = await res.json();
    const items = data.items || [];

    setText('myEntTitle', fill(t().entTitle, { n: items.length }), 'entTitle');

    if (!items.length) { box.innerHTML = '<div class="ent-empty">' + t().entEmpty + '</div>'; return; }

    const loc = lang === 'ko' ? 'ko-KR' : (lang === 'ja' ? 'ja-JP' : 'en-US');
    box.innerHTML = items.map(function(it){
      let tag, cls;
      if (it.status === 'refunded') { tag = t().entRefund; cls = 'refund'; }
      else if (!it.result) { tag = t().entWait; cls = 'wait'; }
      else if (it.result.tier_class === 'none') { tag = t().entLose; cls = 'lose'; }
      else { tag = fill(t().entWin, { n: it.result.best_grade }); cls = (it.result.tier_class === 'jackpot') ? 'top' : 'win'; }

      // ⚠ 날짜만 보여주면 같은 날 등록한 것들이 다 똑같아 보입니다. 시각까지 붙입니다.
      const d = new Date(it.createdAt);
      const when = d.toLocaleDateString(loc, { month:'numeric', day:'numeric' }) + ' ' +
                   d.toLocaleTimeString(loc, { hour:'2-digit', minute:'2-digit' });

      const gname = (GAMES[it.gameId] ? GAMES[it.gameId][lang] : it.gameId);
      return '<div class="ent-item">' +
        '<div class="ent-head">' +
          '<span class="ent-game">' + gname + ' ' + roundDisplay(it.roundNo, it.drawDate) + '</span>' +
          '<span class="ent-tag ' + cls + '">' + tag + '</span>' +
          '<span class="ent-when">' + when + '</span>' +
        '</div>' +
        entLinesHtml(it) +
      '</div>';
    }).join('');
  } catch (e) {
    console.error('[watch] 내 등록 목록 오류', e);
    box.innerHTML = '<div class="ent-empty">' + t().entFail + '</div>';
  }
}

function selectGame(id){
  gameId = id;
  history.replaceState(null, '', '?game=' + id);
  rowCount = START_ROWS;
  $('bulkInput').value = '';
  $('bulkBox').classList.add('hidden');
  clearMsg();
  goStep('stepInput');
  applyLang();
  buildRows();
  loadNextRound();
}

$('gameTabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-game]');
  if (btn && btn.dataset.game !== gameId) selectGame(btn.dataset.game);
});

$('langToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-lang]');
  if (!btn || btn.dataset.lang === lang) return;
  // 언어를 바꿔도 넣으신 번호는 지킵니다
  const keep = [];
  for (let r = 0; r < rowCount; r++) keep.push(readRow(r));
  lang = btn.dataset.lang;
  localStorage.setItem('paperlotto_lang', lang);
  applyLang();
  buildRows();
  keep.forEach((v, r) => { if (v) writeRow(r, v.main, v.bonus); });
  validateAll();
});

$('themeToggleBtn').addEventListener('click', function(){
  document.body.classList.toggle('light-mode');
  const light = document.body.classList.contains('light-mode');
  localStorage.setItem('paperlotto_theme', light ? 'light' : 'dark');
  this.textContent = light ? '☀️' : '🌙';
});

$('toConfirmBtn').addEventListener('click', showConfirm);
$('backBtn').addEventListener('click', () => goStep('stepInput'));
$('submitBtn').addEventListener('click', submit);
$('againBtn').addEventListener('click', () => {
  rowCount = START_ROWS;
  clearMsg();
  buildRows();
  goStep('stepInput');
});

// ── 시작 ──
$('themeToggleBtn').textContent = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
applyLang();
buildRows();
loadNextRound();
loadBalance();
myEntriesReady = true;
loadMyEntries();
</script>
</body>
</html>
