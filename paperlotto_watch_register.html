<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>당첨결과 알림받기 — PaperLotto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --board:#0c1020; --board-2:#111731; --board-line:#242c4d;
  --paper:#f6f1e4; --paper-2:#efe8d6; --ink:#1c2130; --ink-dim:#5b5646;
  --gold:#b8862e; --gold-bright:#e0aa4e; --text-hi:#f2efe4; --text-mid:#a7adc7; --text-dim:#6b7195;
  --ok:#3f9d6d; --bad:#d15b48;
}
body.light-mode{
  --board:#f2efe4; --board-2:#e8e2d0; --board-line:#d9d1ba; --paper:#ffffff; --paper-2:#f7f3e8;
  --ink:#1c2130; --ink-dim:#5b5646; --gold:#a8781f; --gold-bright:#c9932e;
  --text-hi:#1c2130; --text-mid:#4c5372; --text-dim:#7a7f9a;
}
*{box-sizing:border-box;}
body{ margin:0; background:var(--board); color:var(--text-hi); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
h1,h2{ font-family:'Fraunces',serif; margin:0; }
.header{ display:flex; align-items:center; justify-content:space-between; padding:18px 24px; border-bottom:1px solid var(--board-line); flex-wrap:wrap; gap:12px; }
.brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; }
.brand-mark{ width:34px; height:34px; border-radius:9px; background:var(--gold); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-family:'Fraunces',serif; }
.brand-name{ font-size:16px; font-weight:700; }
.header-right{ display:flex; align-items:center; gap:10px; }
.lang-toggle{ display:flex; border:1px solid var(--board-line); border-radius:20px; overflow:hidden; }
.lang-toggle button{ border:none; background:transparent; color:var(--text-dim); font-size:12px; font-weight:600; padding:6px 12px; cursor:pointer; font-family:'Inter',sans-serif; }
.lang-toggle button.active{ background:var(--gold); color:#fff; }
.theme-toggle{ border:1px solid var(--board-line); background:transparent; color:var(--text-mid); width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:14px; }
.balance{ font-size:13px; font-weight:600; color:var(--gold-bright); font-family:'IBM Plex Mono',monospace; }

main{ max-width:720px; margin:0 auto; padding:28px 20px 80px; }
.page-title{ font-size:26px; font-weight:700; margin-bottom:6px; font-family:'Fraunces',serif; }
.page-sub{ font-size:13px; color:var(--text-dim); margin-bottom:22px; line-height:1.6; }

.game-tabs{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
.game-tab-btn{ padding:8px 14px; border-radius:999px; border:1px solid var(--board-line); background:var(--board-2); color:var(--text-mid); font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; }
.game-tab-btn.active{ background:var(--gold); border-color:var(--gold); color:#fff; }

.card{ background:var(--board-2); border:1px solid var(--board-line); border-radius:16px; padding:20px; margin-bottom:16px; }
.round-line{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.round-no{ font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; color:var(--gold-bright); }
.round-note{ font-size:12px; color:var(--text-dim); }
.round-sub{ font-size:12.5px; color:var(--text-mid); font-family:'IBM Plex Mono',monospace; margin-top:4px; }

label.field-label{ display:block; font-size:13px; font-weight:600; margin-bottom:8px; }
textarea{ width:100%; min-height:150px; background:var(--board); border:1px solid var(--board-line); border-radius:12px; color:var(--text-hi); font-family:'IBM Plex Mono',monospace; font-size:14px; line-height:1.9; padding:12px 14px; resize:vertical; }
textarea:focus{ outline:none; border-color:var(--gold); }
.hint{ font-size:12px; color:var(--text-dim); margin-top:8px; line-height:1.6; }
.hint b{ color:var(--text-mid); }

.status-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:12px; flex-wrap:wrap; }
.count-badge{ font-size:12.5px; font-family:'IBM Plex Mono',monospace; color:var(--text-mid); }
.count-badge.over{ color:var(--bad); font-weight:700; }

.err-list{ margin-top:10px; }
.err-item{ font-size:12.5px; color:var(--bad); margin-bottom:4px; }

.preview{ margin-top:4px; }
.pv-line{ display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--board-line); flex-wrap:wrap; }
.pv-line:last-child{ border-bottom:none; }
.pv-idx{ font-size:11px; color:var(--text-dim); width:26px; font-family:'IBM Plex Mono',monospace; flex-shrink:0; }
.ball{ width:30px; height:30px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; font-family:'IBM Plex Mono',monospace; background:var(--board); border:1.5px solid var(--board-line); color:var(--text-hi); }
.ball.bonus{ background:transparent; border:2px dashed var(--gold); color:var(--gold-bright); }
.pv-sep{ color:var(--text-dim); font-size:14px; margin:0 2px; }

.summary{ font-size:13.5px; line-height:2; }
.summary .row{ display:flex; justify-content:space-between; gap:12px; }
.summary .k{ color:var(--text-dim); }
.summary .v{ font-weight:600; font-family:'IBM Plex Mono',monospace; }

button.primary{ width:100%; border:none; border-radius:12px; padding:15px; font-size:15px; font-weight:700; cursor:pointer; background:var(--gold); color:#fff; font-family:inherit; }
button.primary:disabled{ opacity:.45; cursor:not-allowed; }
button.ghost{ width:100%; border:1px solid var(--board-line); border-radius:12px; padding:13px; font-size:14px; font-weight:600; cursor:pointer; background:transparent; color:var(--text-mid); font-family:inherit; margin-top:10px; }

.notice{ font-size:12px; color:var(--text-dim); line-height:1.7; margin-top:14px; padding:12px 14px; border:1px dashed var(--board-line); border-radius:10px; }
.msg{ font-size:13.5px; padding:12px 14px; border-radius:10px; margin-bottom:14px; line-height:1.6; display:none; }
.msg.bad{ background:rgba(209,91,72,.12); color:var(--bad); border:1px solid rgba(209,91,72,.3); }
.msg.ok{ background:rgba(63,157,109,.12); color:var(--ok); border:1px solid rgba(63,157,109,.3); }
.hidden{ display:none !important; }
</style>
</head>
<body>
<script>(function(){ if (localStorage.getItem('paperlotto_theme') === 'light') document.body.classList.add('light-mode'); })();</script>

<div class="header">
  <a class="brand" href="index.html">
    <div class="brand-mark">P</div>
    <div class="brand-name">PaperLotto</div>
  </a>
  <div class="header-right">
    <span class="balance" id="balanceLabel">—</span>
    <div class="lang-toggle" id="langToggle">
      <button data-lang="ko" type="button">KR</button>
      <button data-lang="en" type="button">EN</button>
      <button data-lang="ja" type="button">JA</button>
    </div>
    <button class="theme-toggle" id="themeToggleBtn">🌙</button>
  </div>
</div>

<main>
  <div class="page-title" id="pageTitle">🔔 당첨결과 알림받기</div>
  <div class="page-sub" id="pageSub"></div>

  <div class="msg" id="msgBox"></div>

  <div class="game-tabs" id="gameTabs"></div>

  <!-- ── 입력 단계 ── -->
  <div id="stepInput">
    <div class="card">
      <div class="round-line">
        <span id="roundLabelTxt" style="font-size:13px;color:var(--text-dim);">감시할 회차</span>
        <span class="round-no" id="roundNoTxt">—</span>
      </div>
      <div class="round-sub" id="roundSubTxt"></div>
      <div class="round-note" id="roundNote"></div>
    </div>

    <div class="card">
      <label class="field-label" for="linesInput" id="inputLabel">번호 입력</label>
      <textarea id="linesInput" spellcheck="false" inputmode="numeric"></textarea>
      <div class="hint" id="inputHint"></div>
      <div class="status-row">
        <span class="count-badge" id="countBadge">0 / 50</span>
      </div>
      <div class="err-list" id="errList"></div>
    </div>

    <div class="card hidden" id="previewCard">
      <label class="field-label" id="previewLabel">확인</label>
      <div class="preview" id="previewBox"></div>
    </div>

    <button class="primary" id="toConfirmBtn" disabled>다음</button>
    <div class="notice" id="inputNotice"></div>
  </div>

  <!-- ── 확인 단계 ── -->
  <div id="stepConfirm" class="hidden">
    <div class="card">
      <div class="summary" id="confirmSummary"></div>
    </div>
    <div class="card">
      <div class="preview" id="confirmPreview"></div>
    </div>
    <button class="primary" id="submitBtn">등록하기</button>
    <button class="ghost" id="backBtn">뒤로</button>
    <div class="notice" id="confirmNotice"></div>
  </div>

  <!-- ── 완료 단계 ── -->
  <div id="stepDone" class="hidden">
    <div class="card">
      <div class="summary" id="doneSummary"></div>
    </div>
    <div class="notice" id="doneNotice"></div>
    <button class="ghost" id="againBtn" style="margin-top:14px;">다른 종목 등록하기</button>
  </div>
</main>

if (!T[lang]) lang = 'ko';
let gameId = new URLSearchParams(location.search).get('game') || 'kr_lotto645';
if (!GAMES[gameId]) gameId = 'kr_lotto645';

let nextRound = null;   // 화면이 미리 계산한 회차 (참고용 — 실제 값은 서버가 정합니다)
let nextDate = null;    // 추첨 예정일 (YYYY-MM-DD)
let parsed = [];        // [{ main:[], bonus:[] }]
let balance = null;

const $ = (id) => document.getElementById(id);
function fill(tpl, vals){ return String(tpl).replace(/\{(\w+)\}/g, (_, k) => (vals[k] !== undefined ? vals[k] : '')); }
function t(){ return T[lang]; }
function gameName(id){ return GAMES[id][lang]; }
function bonusName(id){ const b = BONUS_NAME[id]; return b ? b[lang] : ''; }

function showMsg(text, kind){
  const box = $('msgBox');
  box.className = 'msg ' + (kind || 'bad');
  box.innerHTML = text;
  box.style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearMsg(){ $('msgBox').style.display = 'none'; }

// ── 잔액 ──
async function loadBalance(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('balanceLabel').textContent = '—'; return; }
  const { data, error } = await sb.from('point_ledger').select('remaining').eq('user_id', session.user.id).gt('remaining', 0);
  if (error) { console.error('[watch] 잔액 조회 오류', error); return; }
  balance = (data || []).reduce((s, r) => s + r.remaining, 0);
  $('balanceLabel').textContent = balance.toLocaleString() + ' P';
}

// ── 다음 회차와 추첨 예정일 ──
// 🔴 서버(watch-register)와 같은 계산입니다.
//   회차 = draw_results의 마지막 회차 + 1
//   추첨일 = 최근 추첨일들에서 요일을 읽어내 마지막 추첨일 다음의 그 요일
//   (요일표를 코드에 박지 않습니다. 운영사가 요일을 바꾸면 저절로 따라갑니다)
function ymdUTC(d){ return d.toISOString().slice(0,10); }

function inferNextDate(rows){
  const dates = rows.map(r => r.draw_date).filter(Boolean)
    .map(s => new Date(String(s).slice(0,10) + 'T00:00:00Z'))
    .filter(d => !isNaN(d.getTime()))
    .sort((a,b) => b - a);
  if (!dates.length) return null;
  const last = dates[0];
  const days = new Set(dates.map(d => d.getUTCDay()));
  for (let i = 1; i <= 14; i++) {
    const c = new Date(last.getTime() + i * 86400000);
    if (days.has(c.getUTCDay())) return ymdUTC(c);
  }
  return null;
}

// 손님의 언어로 날짜를 씁니다. 요일까지 보여야 "다음 토요일"이 바로 이해됩니다.
function formatDate(ymd){
  if (!ymd) return null;
  const d = new Date(ymd + 'T00:00:00Z');
  if (isNaN(d.getTime())) return null;
  const locale = lang === 'ko' ? 'ko-KR' : (lang === 'ja' ? 'ja-JP' : 'en-US');
  return d.toLocaleDateString(locale, { timeZone:'UTC', year:'numeric', month:'long', day:'numeric', weekday:'short' });
}

async function loadNextRound(){
  $('roundNoTxt').textContent = '—';
  $('roundSubTxt').textContent = '';
  nextRound = null;
  nextDate = null;

  const { data, error } = await sb.from('draw_results')
    .select('round_no, draw_date').eq('game_id', gameId)
    .order('round_no', { ascending: false }).limit(12);
  if (error) { console.error('[watch] 회차 조회 오류', error); return; }

  const rows = data || [];
  nextRound = ((rows[0] && rows[0].round_no) || 0) + 1;
  nextDate = inferNextDate(rows);
  renderRound();
}

// 회차를 쓰지 않는 종목은 날짜를 크게, 회차를 작게. 나머지는 반대로.
function renderRound(){
  const spec = GAMES[gameId];
  const dateTxt = formatDate(nextDate);
  const roundTxt = nextRound === null ? '—' : fill(t().roundValue, { n: nextRound.toLocaleString() });

  if (!spec.roundLabel) {
    $('roundNoTxt').textContent = dateTxt || roundTxt;
    $('roundSubTxt').textContent = dateTxt ? fill(t().roundSub, { r: roundTxt }) : '';
  } else {
    $('roundNoTxt').textContent = roundTxt;
    $('roundSubTxt').textContent = dateTxt ? fill(t().dateSub, { d: dateTxt }) : '';
  }
}

// 확인·완료 화면에서 "회차" 칸에 넣을 값
function roundDisplay(round, date){
  const spec = GAMES[gameId];
  const dateTxt = formatDate(date);
  const roundTxt = (round === null || round === undefined) ? '—' : fill(t().roundValue, { n: Number(round).toLocaleString() });
  if (!spec.roundLabel) return dateTxt || roundTxt;
  return dateTxt ? roundTxt + ' · ' + dateTxt : roundTxt;
}

// ── 번호 해석 ──
// checker의 parseNums와 같은 방식: 공백·쉼표·전각쉼표·읽점을 모두 받아들입니다.
// 손님이 쉼표를 쓰셔도 막지 않고 조용히 받습니다.
function parseNums(str){
  return String(str || '').split(/[\s,，、]+/).filter(Boolean).map(Number);
}

// 보너스가 있는 종목은 "본번호 다음에 보너스"가 실물 복권 표기 순서와 같습니다.
// 예: 파워볼 → 3 12 25 34 41 15  (마지막 1개가 파워볼)
function parseAll(){
  const spec = GAMES[gameId];
  const need = spec.main + spec.bonus;
  const raw = $('linesInput').value.split(/\n+/).map(s => s.trim()).filter(Boolean);
  const out = [];
  const errs = [];

  raw.forEach((line, i) => {
    const nums = parseNums(line);
    const idx = i + 1;

    if (nums.some(n => !Number.isInteger(n))) {
      errs.push(fill(t().errCount, { i: idx, need, got: nums.length }));
      return;
    }
    if (nums.length !== need) {
      errs.push(fill(t().errCount, { i: idx, need, got: nums.length }));
      return;
    }

    const main = nums.slice(0, spec.main);
    const bonus = nums.slice(spec.main);

    if (main.some(n => n < 1 || n > spec.range)) {
      errs.push(fill(t().errRange, { i: idx, max: spec.range }));
      return;
    }
    if (new Set(main).size !== main.length) {
      errs.push(fill(t().errDup, { i: idx }));
      return;
    }
    if (spec.bonus > 0 && bonus.some(n => n < 1 || n > spec.bonusRange)) {
      errs.push(fill(t().errBonusRange, { i: idx, bname: bonusName(gameId), max: spec.bonusRange }));
      return;
    }
    out.push({ main, bonus });
  });

  return { out, errs, rawCount: raw.length };
}

function ballHtml(n, isBonus){
  return '<span class="ball' + (isBonus ? ' bonus' : '') + '">' + n + '</span>';
}

function renderPreview(list, mountId){
  const spec = GAMES[gameId];
  $(mountId).innerHTML = list.map((c, i) => {
    const main = c.main.map(n => ballHtml(n, false)).join('');
    // ⚠ 보너스는 반드시 떼어놓아 보여줍니다. 본번호와 나란히 그리면 헷갈립니다.
    const bonus = spec.bonus > 0
      ? '<span class="pv-sep">+</span>' + c.bonus.map(n => ballHtml(n, true)).join('')
      : '';
    return '<div class="pv-line"><span class="pv-idx">' + (i + 1) + '</span>' + main + bonus + '</div>';
  }).join('');
}

function onInput(){
  clearMsg();
  const { out, errs, rawCount } = parseAll();
  parsed = out;

  const badge = $('countBadge');
  badge.textContent = fill(t().count, { n: rawCount, max: MAX_LINES });
  badge.classList.toggle('over', rawCount > MAX_LINES);

  const list = errs.slice(0, 6);
  if (rawCount > MAX_LINES) list.unshift(fill(t().errOver, { max: MAX_LINES, n: rawCount }));
  $('errList').innerHTML = list.map(e => '<div class="err-item">' + e + '</div>').join('');

  if (out.length > 0) {
    $('previewCard').classList.remove('hidden');
    renderPreview(out, 'previewBox');
  } else {
    $('previewCard').classList.add('hidden');
  }

  $('toConfirmBtn').disabled = !(out.length > 0 && errs.length === 0 && rawCount <= MAX_LINES);
}

// ── 화면 전환 ──
function goStep(name){
  ['stepInput','stepConfirm','stepDone'].forEach(s => $(s).classList.toggle('hidden', s !== name));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showConfirm(){
  clearMsg();
  const cost = 100;
  const after = (balance === null) ? null : balance - cost;
  $('confirmSummary').innerHTML = [
    ['confirmGame', gameName(gameId)],
    ['confirmRound', roundDisplay(nextRound, nextDate)],
    ['confirmLines', parsed.length],
    ['confirmCost', cost.toLocaleString() + ' P'],
    ['confirmAfter', after === null ? '—' : after.toLocaleString() + ' P'],
  ].map(([k, v]) => '<div class="row"><span class="k">' + t()[k] + '</span><span class="v">' + v + '</span></div>').join('');
  renderPreview(parsed, 'confirmPreview');
  goStep('stepConfirm');
}

// ── 등록 ──
async function submit(){
  clearMsg();
  const btn = $('submitBtn');
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = t().loading;

  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { showMsg(t().errLogin); btn.disabled = false; btn.textContent = original; return; }

    const spec = GAMES[gameId];
    const body = {
      gameId,
      lines: parsed.map(c => c.main),
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Seoul',
    };
    // 보너스를 직접 입력받는 4종만 함께 보냅니다.
    if (spec.bonus > 0) body.bonusLines = parsed.map(c => c.bonus);

    const res = await fetch(SUPABASE_URL + '/functions/v1/watch-register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
      body: JSON.stringify(body),
    });
    const data = await res.json();

    if (!res.ok) {
      if (data.error === 'ALREADY_REGISTERED') showMsg(fill(t().errDup2, { id: data.entryId }));
      else if (data.error === 'INSUFFICIENT_POINTS') showMsg(fill(t().errPoints, { short: (data.shortfall ?? 0).toLocaleString(), bal: (data.balance ?? 0).toLocaleString() }));
      else if (data.error === 'AUTH_REQUIRED') showMsg(t().errLogin);
      else showMsg(fill(t().errEtc, { msg: data.error || res.status }));
      goStep('stepConfirm');
      btn.disabled = false; btn.textContent = original;
      return;
    }

    // 🔴 실제로 등록된 회차는 서버가 정합니다. 응답 값을 그대로 보여줍니다.
    $('doneSummary').innerHTML = [
      ['confirmGame', gameName(gameId)],
      ['confirmRound', roundDisplay(data.roundNo, data.drawDate)],
      ['confirmLines', data.lineCount],
      ['confirmCost', Number(data.pointsCharged).toLocaleString() + ' P'],
      ['confirmAfter', data.balanceAfter === null || data.balanceAfter === undefined ? '—' : Number(data.balanceAfter).toLocaleString() + ' P'],
    ].map(([k, v]) => '<div class="row"><span class="k">' + t()[k] + '</span><span class="v">' + v + '</span></div>').join('');

    balance = (typeof data.balanceAfter === 'number') ? data.balanceAfter : balance;
    if (balance !== null) $('balanceLabel').textContent = balance.toLocaleString() + ' P';

    showMsg(t().doneTitle, 'ok');
    goStep('stepDone');
  } catch (e) {
    console.error('[watch] 등록 오류', e);
    showMsg(fill(t().errEtc, { msg: String(e.message || e) }));
    btn.disabled = false; btn.textContent = original;
  }
}

// ── 언어 적용 ──
function applyLang(){
  const spec = GAMES[gameId];
  document.documentElement.lang = lang;
  $('pageTitle').textContent = t().title;
  $('pageSub').textContent = t().sub;
  $('roundLabelTxt').textContent = spec.roundLabel ? t().roundLabel : t().roundLabelDate;
  $('roundNote').textContent = t().roundNote;
  $('inputLabel').textContent = t().inputLabel;
  $('previewLabel').textContent = t().preview;
  $('toConfirmBtn').textContent = t().next;
  $('submitBtn').textContent = t().submit;
  $('backBtn').textContent = t().back;
  $('againBtn').textContent = t().again;
  $('inputNotice').innerHTML = t().notice;
  $('confirmNotice').textContent = t().confirmNotice;
  $('doneNotice').innerHTML = t().doneNotice;
  $('linesInput').placeholder = t().placeholder;

  if (spec.bonus > 0) {
    const ex = Array.from({ length: spec.main }, (_, i) => (i + 3)).join(' ') + ' ' + Array.from({ length: spec.bonus }, (_, i) => (i + 5)).join(' ');
    $('inputHint').innerHTML = fill(t().hintBonus, { main: spec.main, bonus: spec.bonus, bname: bonusName(gameId), ex });
  } else {
    $('inputHint').innerHTML = t().hint;
  }

  document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  renderTabs();
  renderRound();
  onInput();
}

function renderTabs(){
  $('gameTabs').innerHTML = GAME_ORDER.map(id =>
    '<button class="game-tab-btn' + (id === gameId ? ' active' : '') + '" data-game="' + id + '">' + gameName(id) + '</button>'
  ).join('');
}

function selectGame(id){
  gameId = id;
  history.replaceState(null, '', '?game=' + id);
  $('linesInput').value = '';
  parsed = [];
  clearMsg();
  goStep('stepInput');
  applyLang();
  loadNextRound();
}

// ── 이벤트 ──
$('gameTabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-game]');
  if (btn) selectGame(btn.dataset.game);
});
$('langToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-lang]');
  if (!btn) return;
  lang = btn.dataset.lang;
  localStorage.setItem('paperlotto_lang', lang);
  applyLang();
});
$('themeToggleBtn').addEventListener('click', function(){
  document.body.classList.toggle('light-mode');
  const light = document.body.classList.contains('light-mode');
  localStorage.setItem('paperlotto_theme', light ? 'light' : 'dark');
  this.textContent = light ? '☀️' : '🌙';
});
$('linesInput').addEventListener('input', onInput);
$('toConfirmBtn').addEventListener('click', showConfirm);
$('backBtn').addEventListener('click', () => goStep('stepInput'));
$('submitBtn').addEventListener('click', submit);
$('againBtn').addEventListener('click', () => { $('linesInput').value = ''; parsed = []; clearMsg(); goStep('stepInput'); onInput(); });

// ── 시작 ──
$('themeToggleBtn').textContent = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
applyLang();
loadNextRound();
loadBalance();
</script>
</body>
