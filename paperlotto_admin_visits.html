<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>방문 통계 — PaperLotto 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  =====================================================
  PaperLotto — 방문 통계 (관리자)
  2026-09-02 신설

  🔴 기록만 쌓이고 볼 데가 없으면 소용이 없습니다.
     광고를 하실 때 "어느 경로로 몇 명이 왔는지"를 여기서 봅니다.

  ⚠ 관리자 열쇠(ADMIN_API_KEY)를 넣어야 열립니다.
    열쇠는 이 화면에 저장하지 않습니다 — 새로고침하면 다시 넣으셔야 합니다.
    브라우저에 저장해두면 그 PC를 쓰는 누구나 볼 수 있게 됩니다.
  =====================================================
-->
<style>
:root{
  --board:#0c1020; --board-2:#111731; --board-line:#242c4d;
  --paper:#f6f1e4; --ink:#1c2130;
  --gold:#b8862e; --gold-bright:#e0aa4e;
  --text-hi:#f2efe4; --text-mid:#a7adc7; --text-dim:#6b7195;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--board);color:var(--text-hi);font-family:'Inter',sans-serif;}
h1,h2{font-family:'Fraunces',serif;margin:0;}
.header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;
  border-bottom:1px solid var(--board-line);flex-wrap:wrap;gap:12px;}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--gold);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Fraunces',serif;}
main{max-width:820px;margin:0 auto;padding:28px 20px 60px;}
.page-title{font-size:24px;font-weight:700;margin-bottom:6px;}
.page-sub{font-size:12.5px;color:var(--text-dim);margin-bottom:22px;line-height:1.7;}
.card{background:var(--board-2);border:1px solid var(--board-line);border-radius:16px;
  padding:18px;margin-bottom:14px;}
.sec-title{font-size:14px;font-weight:700;margin-bottom:12px;}
input,select{background:var(--board);border:1px solid var(--board-line);color:var(--text-hi);
  border-radius:9px;padding:10px 12px;font-size:13px;font-family:inherit;outline:none;}
input:focus,select:focus{border-color:var(--gold);}
button{border:none;border-radius:9px;padding:11px 18px;font-size:13.5px;font-weight:700;
  cursor:pointer;font-family:inherit;background:var(--gold);color:#fff;}
button:hover{background:var(--gold-bright);}
button:disabled{opacity:.45;cursor:default;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.big{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:6px;}
.big div{flex:1;min-width:120px;}
.big .n{font-size:26px;font-weight:800;color:var(--gold-bright);
  font-family:'IBM Plex Mono',monospace;line-height:1.2;}
.big .l{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;font-size:11px;color:var(--text-dim);font-weight:700;
  padding:6px 8px;border-bottom:1px solid var(--board-line);}
th.n,td.n{text-align:right;font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
td{padding:8px;border-bottom:1px solid rgba(36,44,77,.5);word-break:break-all;}
tr:last-child td{border-bottom:none;}
.msg{font-size:12.5px;padding:11px 14px;border-radius:10px;margin-bottom:14px;
  line-height:1.6;display:none;}
.msg.err{background:rgba(212,83,126,.1);border:1px solid #d4537e;color:#f2a3bd;display:block;}
.msg.warn{background:rgba(184,134,46,.1);border:1px solid var(--gold);color:var(--gold-bright);display:block;}
.empty{text-align:center;padding:20px;color:var(--text-dim);font-size:12.5px;}
.hint{font-size:11px;color:var(--text-dim);line-height:1.7;margin-top:10px;}
</style>
</head>
<body>

<div class="header">
  <a class="brand" href="index.html">
    <div class="brand-mark">P</div>
    <div style="font-size:16px;font-weight:700;">PaperLotto</div>
  </a>
  <div style="font-size:11.5px;color:var(--text-dim);">관리자 · 방문 통계</div>
</div>

<main>
  <div class="page-title">📊 방문 통계</div>
  <div class="page-sub">어느 화면을 몇 명이 보는지, 어디서 들어오는지 봅니다.
    광고를 거실 때 주소 뒤에 <b>?entry=이름</b>을 붙이면 그 경로로 들어온 방문이 따로 잡힙니다.</div>

  <div class="msg" id="msg"></div>

  <div class="card">
    <div class="row">
      <input type="password" id="keyInput" placeholder="관리자 열쇠" style="flex:1;min-width:180px;">
      <select id="daysSel">
        <option value="1">오늘</option>
        <option value="7" selected>최근 7일</option>
        <option value="30">최근 30일</option>
        <option value="90">최근 90일</option>
      </select>
      <button id="loadBtn" onclick="load()">불러오기</button>
    </div>
    <div class="hint">⚠ 열쇠는 저장하지 않습니다. 새로고침하면 다시 넣으셔야 합니다.
      저장해두면 이 PC를 쓰는 누구나 볼 수 있게 됩니다.</div>
  </div>

  <div id="body"></div>
</main>

<script>
const SUPABASE_URL = 'https://wzrqaozlbfyejsbvnrxk.supabase.co';

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function showMsg(text, kind){
  const el = document.getElementById('msg');
  el.className = 'msg ' + (kind || 'err');
  el.innerHTML = text;
}
function clearMsg(){ document.getElementById('msg').className = 'msg'; }
function num(n){ return Number(n || 0).toLocaleString(); }

// 표 하나를 그립니다.
// ⚠ 방문 수와 사람 수는 다릅니다. 한 사람이 열 화면을 보면 방문 10, 사람 1입니다.
//   둘을 갈라 보여드려야 "많이 왔다"와 "여러 번 봤다"를 구분하실 수 있습니다.
function table(title, rows, keyLabel){
  if (!rows || !rows.length) {
    return '<div class="card"><div class="sec-title">' + title + '</div>' +
      '<div class="empty">기록이 없습니다.</div></div>';
  }
  return '<div class="card"><div class="sec-title">' + title + '</div>' +
    '<table><thead><tr><th>' + keyLabel + '</th>' +
    '<th class="n">방문</th><th class="n">사람</th></tr></thead><tbody>' +
    rows.map(function(r){
      return '<tr><td>' + esc(r.key) + '</td>' +
        '<td class="n">' + num(r.visits) + '</td>' +
        '<td class="n">' + num(r.people) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}

async function load(){
  const btn = document.getElementById('loadBtn');
  const key = document.getElementById('keyInput').value.trim();
  const days = Number(document.getElementById('daysSel').value);
  clearMsg();
  if (!key) { showMsg('관리자 열쇠를 넣어주세요.'); return; }

  btn.disabled = true;
  btn.textContent = '불러오는 중…';
  try {
    const res = await fetch(SUPABASE_URL + '/functions/v1/track-stats', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-key': key },
      body: JSON.stringify({ days: days }),
    });
    const data = await res.json();
    if (!res.ok) { showMsg(esc(data.error || '불러오지 못했습니다.')); return; }

    // ⚠ 5,000줄에서 끊겼으면 숫자가 실제보다 작습니다. 반드시 알려드립니다.
    //   모르고 보면 "방문이 줄었네"라고 잘못 읽습니다.
    if (data.truncated) {
      showMsg('⚠ 기록이 5,000줄을 넘어 <b>일부만 세었습니다.</b> ' +
        '아래 숫자는 실제보다 작습니다. 기간을 좁혀 보세요.', 'warn');
    }

    let html = '<div class="card"><div class="big">' +
      '<div><div class="n">' + num(data.totalVisits) + '</div><div class="l">방문 수</div></div>' +
      '<div><div class="n">' + num(data.uniquePeople) + '</div><div class="l">사람 수</div></div>' +
      '<div><div class="n">' + data.days + '일</div><div class="l">기간</div></div>' +
      '</div><div class="hint">한 사람이 여러 화면을 보면 방문 수만 늘어납니다.</div></div>';

    html += table('📥 어디서 들어왔나', data.byEntry, '경로');
    html += table('🌐 언어', data.byLang, '언어');
    html += table('📄 화면별', data.byPath, '주소');
    html += table('📅 날짜별', data.byDay, '날짜');

    document.getElementById('body').innerHTML = html;
  } catch (e) {
    console.error('[track-stats] 오류', e);
    showMsg('불러오지 못했습니다. 잠시 후 다시 시도해주세요.');
  }
  btn.disabled = false;
  btn.textContent = '불러오기';
}

document.getElementById('keyInput').addEventListener('keydown', function(e){
  if (e.key === 'Enter') load();
});
</script>
</body>
</html>
