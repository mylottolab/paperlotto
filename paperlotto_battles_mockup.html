<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battles — PaperLotto</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --board:#0c1020; --board-2:#111731; --board-line:#242c4d;
  --paper:#f6f1e4; --paper-2:#efe8d6; --ink:#1c2130; --ink-dim:#5b5646;
  --gold:#b8862e; --gold-bright:#e0aa4e;
  --text-hi:#f2efe4; --text-mid:#a7adc7; --text-dim:#6b7195;
  --kr:#c8203a; --jp:#2a3a7a; --us:#2c4fa3; --ca:#d8232a; --au:#1f7a6e; --eu:#2451c4;
  --ok:#1f7a4f; --err:#c65a2e;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:var(--board); color:var(--text-hi);
  font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
  word-break:keep-all; overflow-wrap:break-word;
  background-image:linear-gradient(var(--board-line) 1px, transparent 1px), linear-gradient(90deg, var(--board-line) 1px, transparent 1px);
  background-size:64px 64px; background-color:var(--board);
}
h1,h2,h3{ font-family:'Fraunces',serif; margin:0; }
.mono{ font-family:'IBM Plex Mono',monospace; }
a{ color:inherit; text-decoration:none; }
:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:3px; border-radius:4px; }

header{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
  padding:16px 28px; border-bottom:1px solid var(--board-line); flex-wrap:wrap; gap:10px;
  background:rgba(12,16,32,0.92); backdrop-filter:blur(8px);
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{ width:34px; height:34px; border-radius:7px; background:linear-gradient(135deg, var(--gold-bright), var(--gold)); display:flex; align-items:center; justify-content:center; color:var(--ink); font-family:'Fraunces',serif; font-weight:700; font-size:17px; transform:rotate(-4deg); }
.brand-name{ font-size:17px; font-weight:600; }
.brand-name em{ font-style:normal; color:var(--gold-bright); }
.header-right{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.lang-toggle{ display:flex; border:1px solid var(--board-line); border-radius:20px; overflow:hidden; }
.lang-toggle button{ border:none; background:transparent; color:var(--text-dim); font-size:11.5px; font-weight:600; padding:6px 11px; cursor:pointer; font-family:'Inter',sans-serif; }
.lang-toggle button.active{ background:var(--gold); color:var(--ink); }
.back-link{ font-size:13px; color:var(--text-mid); }

main{ max-width:920px; margin:0 auto; padding:28px 20px 90px; }
.hero{ margin-bottom:24px; }
.eyebrow{ font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold-bright); font-weight:700; margin-bottom:6px; }
.hero h1{ font-size:26px; font-weight:600; color:var(--text-hi); margin-bottom:8px; }
.hero p{ font-size:13.5px; color:var(--text-mid); line-height:1.6; max-width:640px; }

/* 게임 탭 */
.game-tabs{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:20px; scrollbar-width:thin; }
.game-tab{
  flex-shrink:0; display:flex; align-items:center; gap:6px; padding:9px 14px; border-radius:10px;
  background:var(--board-2); border:1px solid var(--board-line); color:var(--text-mid);
  font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap;
}
.game-tab.active{ background:var(--gold); color:var(--ink); border-color:var(--gold); }
.game-tab .flag{ font-size:14px; }

.card{ background:var(--paper); color:var(--ink); border-radius:14px; padding:22px; margin-bottom:16px; }
.card h2{ font-size:16px; margin-bottom:4px; }
.card h3{ font-size:14px; margin-bottom:8px; }
.card .desc{ font-size:12px; color:var(--ink-dim); line-height:1.6; margin-bottom:14px; }

/* 회차 정보 배너 */
.round-banner{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; background:var(--board-2); border:1px solid var(--board-line); border-radius:12px; padding:14px 18px; margin-bottom:16px; }
.round-banner .rb-left{ font-size:13px; color:var(--text-hi); font-weight:600; }
.round-banner .rb-left .round-no{ color:var(--gold-bright); font-family:'IBM Plex Mono',monospace; }
.round-banner .rb-right{ font-size:12px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace; }
.round-banner.closed{ opacity:.6; }

/* 진행률 막대 (핵심 UI) */
.progress-panel{ margin-bottom:16px; }
.progress-explain{ font-size:12.5px; color:var(--ink-dim); line-height:1.65; margin-bottom:10px; }
.progress-explain b{ color:#8a5b1c; font-family:'IBM Plex Mono',monospace; font-weight:700; }
.progress-bar-track{ height:14px; background:rgba(28,33,48,.1); border-radius:8px; overflow:hidden; }
.progress-bar-fill{ height:100%; background:linear-gradient(90deg, var(--gold), var(--gold-bright)); border-radius:8px; transition:width .3s ease; }
.progress-legend{ display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-dim); margin-top:6px; }

/* 단위 구매 */
.buy-row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.buy-row input[type="number"]{ width:120px; padding:10px 12px; border:1.5px solid rgba(28,33,48,.15); border-radius:8px; font-size:14px; font-family:'IBM Plex Mono',monospace; color:var(--ink); background:#fff; }
.quick-units{ display:flex; gap:6px; flex-wrap:wrap; }
.quick-units button{ padding:7px 12px; border-radius:7px; border:1.5px solid rgba(28,33,48,.15); background:#fff; font-size:12px; font-weight:600; cursor:pointer; color:var(--ink); font-family:'IBM Plex Mono',monospace; }
.quick-units button:hover{ border-color:var(--gold); }
.buy-hint{ font-size:12px; color:var(--ink-dim); line-height:1.55; margin-top:8px; }
.btn{ padding:11px 18px; border-radius:9px; border:none; font-size:13.5px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif; }
.btn-gold{ background:var(--ink); color:var(--paper); }
.btn-gold:hover{ background:#2a3145; }
.btn-outline{ background:transparent; border:1.5px solid rgba(28,33,48,.2); color:var(--ink); }
.btn-outline:hover{ border-color:var(--ink); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }

/* 조합 등록 */
.number-picker{ display:grid; grid-template-columns:repeat(auto-fill,minmax(36px,1fr)); gap:6px; margin:10px 0; max-height:260px; overflow-y:auto; padding:4px; }
.number-picker.bonus{ max-height:140px; }
.num-ball-btn{ width:36px; height:36px; border-radius:50%; border:1.5px solid rgba(28,33,48,.15); background:#fff; color:var(--ink); font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:700; cursor:pointer; }
.num-ball-btn.picked{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.num-ball-btn.bonus.picked{ background:var(--gold); color:var(--ink); border-color:var(--gold); }
.picker-section-label{ font-size:11px; font-weight:700; color:var(--ink-dim); margin:10px 0 4px; text-transform:uppercase; letter-spacing:.04em; }

.combo-list{ margin-top:10px; max-height:280px; overflow-y:auto; }
.combo-row{ display:flex; align-items:center; justify-content:space-between; padding:7px 10px; background:rgba(28,33,48,.04); border-radius:8px; margin-bottom:5px; font-size:11.5px; }
.combo-row.new{ border:1.5px solid var(--gold); }
.combo-row .cr-nums{ font-family:'IBM Plex Mono',monospace; }
.combo-row .cr-tag{ background:var(--gold); color:var(--ink); font-size:9px; font-weight:800; padding:2px 7px; border-radius:20px; margin-left:8px; }
.combo-row .cr-del{ color:#b0453a; cursor:pointer; font-size:11px; }

.status-msg{ margin-top:12px; padding:11px 15px; border-radius:8px; font-size:12.5px; display:none; }
.status-msg.ok{ display:block; background:rgba(31,122,79,.12); color:var(--ok); }
.status-msg.err{ display:block; background:rgba(198,90,46,.12); color:var(--err); }

.empty-state{ text-align:center; padding:30px 10px; color:var(--text-dim); font-size:13px; }
.login-notice{ background:var(--paper); color:var(--ink); border-radius:14px; padding:26px; text-align:center; font-size:13.5px; }
.login-notice a{ color:#8a5b1c; text-decoration:underline; font-weight:600; }

.past-results-toggle{ width:100%; text-align:left; background:var(--board-2); border:1px solid var(--board-line); border-radius:12px; padding:12px 16px; color:var(--text-hi); font-size:13px; font-weight:600; cursor:pointer; display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.past-round-chips{ display:flex; gap:8px; flex-wrap:wrap; }
.past-round-chip{ background:var(--paper); color:var(--ink); border:none; border-radius:10px; padding:8px 14px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }

.modal-overlay{ display:none; position:fixed; inset:0; background:rgba(5,7,15,.65); z-index:100; align-items:flex-start; justify-content:center; padding:24px 14px; overflow-y:auto; }
.modal-overlay.show{ display:flex; }
.modal-box{ background:var(--paper); color:var(--ink); border-radius:16px; padding:26px; max-width:560px; width:100%; margin-top:20px; }
.modal-close{ float:right; background:none; border:none; font-size:16px; cursor:pointer; color:var(--ink-dim); }

@media(max-width:560px){
  header{ padding:12px 16px; }
  main{ padding:20px 12px 80px; }
  .card{ padding:16px; }
}
</style>
</head>
<body>

<header>
  <a class="brand" href="index.html">
    <div class="brand-mark">P</div>
    <div class="brand-name">Paper<em>Lotto</em></div>
  </a>
  <div class="header-right">
    <a class="back-link" href="index.html" data-i18n="navBack">← 전체 게임</a>
    <div id="authWidget"></div>
    <div class="lang-toggle">
      <button data-lang="ko" class="active" type="button">KR</button>
      <button data-lang="en" type="button">EN</button>
      <button data-lang="ja" type="button">JA</button>

  </div>

<main>

</main>

<div class="modal-overlay" id="pastResultModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closePastResultModal()">✕</button>
    <div id="pastResultBody"></div>
  </div>
</div>

<script>

  return sbAccessToken;
}

  { id:'ca_lotto649',     flag:'🇨🇦', nameKo:'캐나다 로또649',    nameEn:'Canada Lotto 6/49',   nameJa:'カナダロト6/49',  main:6, range:49, bonus:0, bonusRange:null },

];

// COMBOS_PER_UNIT(1,000)은 백엔드가 내부적으로 관리하는 물리적 저장 단위 크기일 뿐,
// 사용자에게는 노출되지 않는 구현 디테일이다(레코드를 자주 새로 발행하지 않기 위한 운영상 이유).

let currentLang = localStorage.getItem('paperlotto_lang') || 'ko';

let currentRoom = null;      // { roundNo, bettingCloseAt, myUnitsBought, myComboCount, participantCount }
let stagedCombos = [];       // 아직 서버에 제출 안 한, 지금 화면에서 만든 조합들
let lastStagedCount = 0;
let pickedMain = [], pickedBonus = [];
let countdownTimer = null;

const I18N = {

    roundOpen:(n)=>`🎰 ${n}회차 · 배팅 가능`, roundClosed:"지금 배팅 가능한 회차가 없습니다.", closesIn:"마감까지",
    progressExplain:(unitsBought,comboCount,maxCombos,remainingSlots,maxUnits,remainingUnits)=>`현재 고객님께서는 ${unitsBought.toLocaleString()}단위를 베팅하고 계십니다. 따라서 ${maxCombos.toLocaleString()}개의 번호조합을 등록하실 수가 있는데 현재 ${comboCount.toLocaleString()}개를 등록하여 앞으로 ${remainingSlots.toLocaleString()}개를 더 등록하실 수가 있습니다. 물론 베팅단위를 추가하시면 더 많은 번호조합의 등록이 가능합니다. 참고로 게임당 최대 구매 한도는 ${maxUnits.toLocaleString()}단위(번호조합 ${(maxUnits*100).toLocaleString()}개 등록)이며, 고객님은 앞으로 ${remainingUnits.toLocaleString()}단위를 더 구매하실 수 있습니다.`,
    buyTitle:"💰 단위 구매", buyDesc:"1단위(100P)=번호조합 100개를 등록·채점받을 수 있는 권리(다 채우면 단위를 추가로 구매해서 늘릴 수 있어요). 등록 가능한 칸을 다 채우든 하나도 안 채우든, 산 단위 수 자체가 그대로 베팅액입니다. 추첨 후 당첨금 합계 1위가 우승 — 자기 베팅액 그대로 + 낙첨자 베팅총액의 80%를 나눠 받습니다 (혼자 참가하면 낙첨자가 없어 자동 전액환불).",
    unitsLabel:"구매할 단위 수", buyBtn:"단위 구매하기", buying:"처리 중…",
    buyHint:(u)=>`1단위=조합 ${(1*u).toLocaleString()}개 · 10단위=${(10*u).toLocaleString()}개 · 100단위=${(100*u).toLocaleString()}개 · 1,000단위=${(1000*u).toLocaleString()}개까지 등록 가능해요.`,
    buyHint2:"조합을 많이 등록할수록 당첨 확률이 높아집니다.",

    mainLabel:(n,range)=>`주 번호 ${n}개 선택 (1~${range})`, bonusLabel:(n,range)=>`보너스 번호 ${n}개 선택 (1~${range})`,
    addComboBtn:"+ 조합 추가", autoGenLabel:"자동 생성 개수", autoGenBtn:"자동 추가",

    quickSaveBtn:"💾 바로 저장", reviewBtn:"검토 후 등록하기", quickSaveHint:'"바로 저장"은 지금까지 담은 것을 확인 없이 즉시 저장합니다.',

function t(){ return I18N[currentLang]; }
function curGame(){ return GAMES.find(g => g.id === currentGameId); }
function gameName(g){ return currentLang==='ko' ? g.nameKo : currentLang==='ja' ? g.nameJa : g.nameEn; }

function applyLang(lang){
  currentLang = I18N[lang] ? lang : 'ko';
  localStorage.setItem('paperlotto_lang', currentLang);
  document.documentElement.lang = currentLang; // auth-widget.js가 이 값을 보고 로그인/충전/로그아웃 라벨을 맞춘다
  document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (typeof t()[key] === 'string') el.textContent = t()[key];
  });
  renderGameTabs();
  renderAll();
}
document.querySelectorAll('.lang-toggle button').forEach(btn => {
  btn.addEventListener('click', () => applyLang(btn.dataset.lang));
});

function renderGameTabs(){
  document.getElementById('gameTabs').innerHTML = GAMES.map(g =>
    `<button class="game-tab${g.id===currentGameId?' active':''}" onclick="selectGame('${g.id}')">
      <span class="flag">${g.flag}</span>${gameName(g)}
    </button>`
  ).join('');
}
function selectGame(gameId){
  currentGameId = gameId;
  stagedCombos = []; pickedMain = []; pickedBonus = []; lastStagedCount = 0;
  renderGameTabs();
  loadRoomState();
}

// ── 현재 게임의 열려있는 회차 + 내 단위구매/조합 현황 조회 ──
async function loadRoomState(){
  if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
  const { data: race } = await sb
    .from('races').select('round_no, betting_close_at').eq('game_id', currentGameId).eq('status', 'betting_open')
    .order('round_no', { ascending: false }).limit(1).maybeSingle();

  if (!race) {
    currentRoom = null;
    renderAll();
    return;
  }

  let myUnitsBought = 0, myComboCount = 0, participantCount = 0, roomId = null;
  const { data: room } = await sb
    .from('lotto_battle_rooms').select('id').eq('game_id', currentGameId).eq('round_no', race.round_no).maybeSingle();
  if (room) {
    roomId = room.id;
    const { data: participants } = await sb.from('lotto_battle_participants').select('user_id, units_bought, combo_count').eq('room_id', room.id);
    participantCount = (participants || []).length;
    if (sbAccessToken) {
      const { data: { user } } = await sb.auth.getUser();
      const mine = (participants || []).find(p => p.user_id === user?.id);
      if (mine) { myUnitsBought = mine.units_bought; myComboCount = mine.combo_count; }
    }
  }

  currentRoom = {
    roundNo: race.round_no, bettingCloseAt: race.betting_close_at, roomId,
    myUnitsBought, myComboCount, participantCount,
  };
  renderAll();
  startCountdown();
}

function startCountdown(){
  const el = document.getElementById('roundBanner');
  function tick(){
    if (!currentRoom) return;
    const remain = new Date(currentRoom.bettingCloseAt).getTime() - Date.now();
    const rbRight = el.querySelector('.rb-right');
    if (!rbRight) return;
    if (remain <= 0) { rbRight.textContent = ''; loadRoomState(); return; }
    const d = Math.floor(remain / 86400000), h = Math.floor(remain % 86400000 / 3600000), m = Math.floor(remain % 3600000 / 60000), s = Math.floor(remain % 60000 / 1000);
    rbRight.textContent = t().closesIn + ' ' + (d>0?d+'d ':'') + String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }
  tick();
  countdownTimer = setInterval(tick, 1000);
}

function renderAll(){
  renderRoundBanner();
  renderProgressPanel();
  renderBuyUnitsCard();
  renderSubmitCard();
}

function renderRoundBanner(){
  const el = document.getElementById('roundBanner');
  if (!currentRoom) {
    el.className = 'round-banner closed';
    el.innerHTML = `<div class="rb-left">${t().roundClosed}</div>`;
    return;
  }
  el.className = 'round-banner';
  el.innerHTML = `<div class="rb-left">${t().roundOpen(currentRoom.roundNo)}</div><div class="rb-right"></div>`;
}

function renderProgressPanel(){
  const panel = document.getElementById('progressPanel');
  if (!currentRoom || currentRoom.myUnitsBought === 0) { panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  const maxCombos = currentRoom.myUnitsBought * UNLOCKED_PER_UNIT;
  const previewCombos = Math.min(maxCombos, currentRoom.myComboCount + stagedCombos.length);
  const pct = Math.min(100, Math.round(previewCombos / maxCombos * 100));
  const remainingSlots = maxCombos - previewCombos;
  const remainingUnits = MAX_UNITS - currentRoom.myUnitsBought;
  panel.innerHTML = `
    <div class="progress-explain">${t().progressExplain(currentRoom.myUnitsBought, previewCombos, maxCombos, remainingSlots, MAX_UNITS, remainingUnits)}</div>
    <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%;"></div></div>
    <div class="progress-legend"><span>0</span><span>${maxCombos.toLocaleString()}</span></div>
  `;
}

function renderBuyUnitsCard(){
  const card = document.getElementById('buyUnitsCard');
  if (!currentRoom) { card.innerHTML = ''; return; }
  const g = curGame();
  const remaining = MAX_UNITS - currentRoom.myUnitsBought;
  card.innerHTML = `
    <h2>${t().buyTitle}</h2>
    <p class="desc">${t().buyDesc}</p>
    <div class="buy-row">
      <div class="quick-units">
        ${[1,10,100,1000].filter(n=>n<=remaining).map(n=>`<button type="button" onclick="setUnitsInput(${n})">${n.toLocaleString()}</button>`).join('')}
      </div>
    </div>
    <div class="buy-hint">${t().buyHint(UNLOCKED_PER_UNIT)}<br>${t().buyHint2}</div>
    <div class="buy-row" style="margin-top:8px;">
      <label style="font-size:12px;color:var(--ink-dim);">${t().unitsLabel}</label>
      <input type="number" id="unitsInput" value="1" min="1" max="${remaining}">
      <button class="btn btn-gold" id="buyBtn" onclick="doBuyUnits()">${t().buyBtn}</button>
    </div>
    <div class="status-msg" id="buyMsg"></div>
  `;
}
function setUnitsInput(n){ document.getElementById('unitsInput').value = n; }

function promptBuyMoreUnits(max, skipConfirm){
  if (!skipConfirm && !confirm(t().upsellFull(max))) return;
  const card = document.getElementById('buyUnitsCard');
  if (card) card.scrollIntoView({ behavior:'smooth', block:'start' });
  const input = document.getElementById('unitsInput');
  if (input) { input.value = 1; input.focus(); }
}

async function doBuyUnits(){
  const msgEl = document.getElementById('buyMsg');
  msgEl.className = 'status-msg';
  if (!sbAccessToken) { msgEl.textContent = t().errLogin; msgEl.className = 'status-msg err'; return; }
  const units = parseInt(document.getElementById('unitsInput').value) || 0;
  if (units < 1) { msgEl.textContent = t().errUnits; msgEl.className = 'status-msg err'; return; }
  const remainingUnits = MAX_UNITS - currentRoom.myUnitsBought;
  if (units > remainingUnits) { msgEl.textContent = t().errMaxUnits(remainingUnits); msgEl.className = 'status-msg err'; return; }

  const btn = document.getElementById('buyBtn');
  btn.disabled = true; btn.textContent = t().buying;
  try {
    const resp = await fetch(BUY_UNITS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sbAccessToken },
      body: JSON.stringify({ gameId: currentGameId, units }),
    });
    const data = await resp.json();
    if (!resp.ok) {
      msgEl.textContent = data.shortfall ? t().errInsufficientPoints(data.shortfall) : (data.error || t().loadError);
      msgEl.className = 'status-msg err';
      return;
    }
    await loadRoomState();
    if (window.refreshAuthBalance) window.refreshAuthBalance();
  } catch (e) {
    msgEl.textContent = t().loadError; msgEl.className = 'status-msg err';
  } finally {
    btn.disabled = false; btn.textContent = t().buyBtn;
  }
}

function renderSubmitCard(){
  const card = document.getElementById('submitCard');
  if (!currentRoom || currentRoom.myUnitsBought === 0) { card.style.display = 'none'; return; }
  card.style.display = 'block';
  const g = curGame();
  const maxCombos = currentRoom.myUnitsBought * UNLOCKED_PER_UNIT;
  const alreadySubmitted = currentRoom.myComboCount;

  if (alreadySubmitted >= maxCombos && stagedCombos.length === 0) {
    card.innerHTML = `<h2>${t().submitTitle}</h2><div class="empty-state">✓</div><div class="buy-hint" style="text-align:center;">${t().fullNotice(maxCombos)}</div><button class="btn btn-gold" style="width:100%;margin-top:10px;" onclick="promptBuyMoreUnits(${maxCombos}, true)">${t().buyMoreBtn}</button>`;
    return;
  }

  const mainPool = Array.from({length:g.range}, (_,i)=>i+1);
  const bonusPool = g.bonus > 0 ? Array.from({length:g.bonusRange||g.range}, (_,i)=>i+1) : [];

  let html = `<h2>${t().submitTitle}</h2><p class="desc">${t().submitDesc(maxCombos)}</p>`;
  html += `<div class="picker-section-label">${t().mainLabel(g.main, g.range)}</div>`;
  html += `<div class="number-picker">${mainPool.map(n => `<button type="button" class="num-ball-btn${pickedMain.includes(n)?' picked':''}" onclick="toggleMain(${n})">${n}</button>`).join('')}</div>`;
  if (g.bonus > 0) {
    html += `<div class="picker-section-label">${t().bonusLabel(g.bonus, g.bonusRange||g.range)}</div>`;
    html += `<div class="number-picker bonus">${bonusPool.map(n => `<button type="button" class="num-ball-btn bonus${pickedBonus.includes(n)?' picked':''}" onclick="toggleBonus(${n})">${n}</button>`).join('')}</div>`;
  }
  html += `<button class="btn btn-outline" style="width:100%;margin-top:8px;" onclick="addComboFromPicker()">${t().addComboBtn}</button>`;
  html += `<div class="buy-row" style="margin-top:14px;">
    <label style="font-size:12px;color:var(--ink-dim);">${t().autoGenLabel}</label>
    <input type="number" id="autoGenCount" value="10" min="1">
    <button class="btn btn-outline" onclick="addAutoCombos()">${t().autoGenBtn}</button>
  </div>`;
  html += `<div id="stagedLabel" style="font-size:11.5px;color:var(--ink-dim);margin-top:12px;"></div>`;
  html += `<div class="combo-list" id="comboList"></div>`;
  html += `<div style="display:flex;gap:8px;margin-top:10px;">
    <button class="btn btn-outline" style="flex:1;" id="quickSaveBtn" disabled onclick="quickSaveCombos()">${t().quickSaveBtn}</button>
    <button class="btn btn-gold" style="flex:1;" id="reviewBtn" disabled onclick="openReview()">${t().reviewBtn}</button>
  </div>`;
  html += `<p style="font-size:10.5px;color:var(--ink-dim);margin-top:6px;text-align:center;">${t().quickSaveHint}</p>`;
  html += `<div class="status-msg" id="submitMsg"></div>`;
  html += `<div id="reviewPanel"></div>`;
  card.innerHTML = html;
  renderComboList();
}

function openReview(){
  if (!stagedCombos.length) return;
  const maxCombos = currentRoom.myUnitsBought * UNLOCKED_PER_UNIT;
  const total = currentRoom.myComboCount + stagedCombos.length;
  const panel = document.getElementById('reviewPanel');
  panel.innerHTML = `
    <div class="status-msg ok" style="display:block;margin-top:14px;">
      <div style="font-weight:700;margin-bottom:8px;">${t().confirmTitle(total, currentRoom.myComboCount, stagedCombos.length)}</div>
      <div style="font-size:11.5px;margin-bottom:12px;">${t().confirmWarn}</div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <button class="btn btn-outline" onclick="closeReview()">${t().backToEditBtn}</button>
        <button class="btn btn-gold" onclick="finalSubmit()">${t().submitFinalBtn}</button>
      </div>
    </div>
  `;
}
function closeReview(){ document.getElementById('reviewPanel').innerHTML = ''; }

async function submitCombosToServer(){
  const resp = await fetch(SUBMIT_COMBOS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sbAccessToken },
    body: JSON.stringify({ gameId: currentGameId, combos: stagedCombos }),
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error || t().loadError);
  return data;
}

async function quickSaveCombos(){
  if (!stagedCombos.length) return;
  const msgEl = document.getElementById('submitMsg');
  try {
    await submitCombosToServer();
    const n = stagedCombos.length;
    stagedCombos = []; lastStagedCount = 0; pickedMain = []; pickedBonus = [];
    await loadRoomState();
    const m = document.getElementById('submitMsg');
    if (m) { m.textContent = t().savedMsg(n); m.className = 'status-msg ok'; }
  } catch (e) {
    if (msgEl) { msgEl.textContent = e.message; msgEl.className = 'status-msg err'; }
  }
}
async function finalSubmit(){
  await quickSaveCombos();
}

// ── 지난 회차 결과 ──
let pastLoadedForGame = null;
function togglePastResults(){
  const body = document.getElementById('pastResultsBody');
  const icon = document.getElementById('pastToggleIcon');
  const opening = body.style.display === 'none';
  body.style.display = opening ? 'block' : 'none';
  icon.textContent = opening ? '−' : '+';
  if (opening && pastLoadedForGame !== currentGameId) loadPastRounds();
}
async function loadPastRounds(){
  pastLoadedForGame = currentGameId;
  const el = document.getElementById('pastRoundChips');
  el.innerHTML = `<div class="empty-state">${t().loading}</div>`;
  const { data, error } = await sb
    .from('lotto_battle_rooms').select('id, round_no').eq('game_id', currentGameId).eq('status', 'settled')
    .order('round_no', { ascending: false }).limit(12);
  if (error) { el.innerHTML = `<div class="empty-state">${t().loadError}</div>`; return; }
  if (!data || !data.length) { el.innerHTML = `<div class="empty-state">${t().pastResultsEmpty}</div>`; return; }
  el.innerHTML = data.map(r => `<button class="past-round-chip" onclick="openPastResult(${r.id}, ${r.round_no})">#${r.round_no}</button>`).join('');
}
async function openPastResult(roomId, roundNo){
  document.getElementById('pastResultBody').innerHTML = `<div class="empty-state">${t().loading}</div>`;
  document.getElementById('pastResultModal').classList.add('show');
  const { data: room } = await sb.from('lotto_battle_rooms').select('*').eq('id', roomId).maybeSingle();
  const { data: participants } = await sb
    .from('lotto_battle_participants').select('user_id, units_bought, combo_count, best_grade, win_count, forfeited')
    .eq('room_id', roomId).order('best_grade', { ascending: true, nullsFirst: false });
  if (!room) { document.getElementById('pastResultBody').innerHTML = `<div class="empty-state">${t().loadError}</div>`; return; }

  const winNums = (room.result_main || []).join(', ') + (room.result_bonus && room.result_bonus.length ? ' + ' + room.result_bonus.join(', ') : '');
  const sorted = (participants || []).slice().sort((a,b) => {
    if (a.forfeited && !b.forfeited) return 1;
    if (!a.forfeited && b.forfeited) return -1;
    const av = a.best_grade === null ? Infinity : a.best_grade, bv = b.best_grade === null ? Infinity : b.best_grade;
    if (av !== bv) return av - bv;
    return (b.win_count||0) - (a.win_count||0);
  });
  const rows = sorted.map((p, i) => {
    const grade = p.forfeited ? '—' : (p.best_grade != null ? p.best_grade : '—');
    return `<div class="combo-row"><span>${i+1}. ${p.units_bought.toLocaleString()} units${p.forfeited ? ' (forfeited)' : ''}</span><span>grade ${grade}</span></div>`;
  }).join('');

  document.getElementById('pastResultBody').innerHTML = `
    <h2>${t().pastRoundLabel(roundNo)}</h2>
    <div style="font-size:12px;color:var(--ink-dim);margin:8px 0 14px;">${t().winNumsLabel}: <b class="mono">${winNums}</b></div>
    ${rows || `<div class="empty-state">${t().pastResultsEmpty}</div>`}
  `;
}
function closePastResultModal(){ document.getElementById('pastResultModal').classList.remove('show'); }

// ── 초기화 ──
async function init(){
  applyLang(currentLang);
  await refreshToken();
  if (!sbAccessToken) {
    document.getElementById('loginNotice').style.display = 'block';
    document.getElementById('battleArea').style.display = 'none';
  } else {
    document.getElementById('loginNotice').style.display = 'none';
    document.getElementById('battleArea').style.display = 'block';
  }
  renderGameTabs();
  await loadRoomState();
}
init();

function toggleMain(n){
  const g = curGame();
  const idx = pickedMain.indexOf(n);
  if (idx >= 0) pickedMain.splice(idx, 1);
  else if (pickedMain.length < g.main) pickedMain.push(n);
  if (pickedMain.length === g.main && (g.bonus === 0 || pickedBonus.length === g.bonus)) {
    commitPickedCombo();
  } else {
    renderSubmitCard();
  }
}
function toggleBonus(n){
  const g = curGame();
  const idx = pickedBonus.indexOf(n);
  if (idx >= 0) pickedBonus.splice(idx, 1);
  else if (pickedBonus.length < g.bonus) pickedBonus.push(n);
  if (pickedMain.length === g.main && pickedBonus.length === g.bonus) {
    commitPickedCombo();
  } else {
    renderSubmitCard();
  }
}
function addComboFromPicker(){
  const g = curGame();
  if (pickedMain.length !== g.main || pickedBonus.length !== g.bonus) return;
  commitPickedCombo();
}
function commitPickedCombo(){
  const maxCombos = currentRoom.myUnitsBought * UNLOCKED_PER_UNIT;
  const already = currentRoom.myComboCount + stagedCombos.length;
  if (already >= maxCombos) { promptBuyMoreUnits(maxCombos); return; }
  stagedCombos.push({ main: pickedMain.slice().sort((a,b)=>a-b), bonus: pickedBonus.slice().sort((a,b)=>a-b) });
  lastStagedCount = 1;
  pickedMain = []; pickedBonus = [];
  renderSubmitCard();
  renderProgressPanel();
}
function addAutoCombos(){
  const g = curGame();
  const maxCombos = currentRoom.myUnitsBought * UNLOCKED_PER_UNIT;
  const cap = maxCombos - currentRoom.myComboCount - stagedCombos.length;
  if (cap <= 0) { promptBuyMoreUnits(maxCombos); return; }
  let count = Math.max(1, Math.min(cap, parseInt(document.getElementById('autoGenCount').value) || 1));
  if (count <= 0) return;
  for (let i = 0; i < count; i++) {
    const mainPool = Array.from({length:g.range}, (_,j)=>j+1);
    const main = [];
    while (main.length < g.main) { const idx = Math.floor(Math.random()*mainPool.length); main.push(mainPool.splice(idx,1)[0]); }
    let bonus = [];
    if (g.bonus > 0) {
      const bonusPool = Array.from({length:g.bonusRange||g.range}, (_,j)=>j+1);
      while (bonus.length < g.bonus) { const idx = Math.floor(Math.random()*bonusPool.length); bonus.push(bonusPool.splice(idx,1)[0]); }
    }
    stagedCombos.push({ main: main.sort((a,b)=>a-b), bonus: bonus.sort((a,b)=>a-b) });
  }
  lastStagedCount = count;
  renderSubmitCard();
  renderProgressPanel();
}
function removeStagedCombo(idx){
  stagedCombos.splice(idx, 1);
  lastStagedCount = 0;
  renderSubmitCard();
  renderProgressPanel();
}

function renderComboList(){
  const el = document.getElementById('comboList');
  if (!el) return;
  const maxCombos = currentRoom.myUnitsBought * UNLOCKED_PER_UNIT;
  const indexed = stagedCombos.map((c,i)=>({combo:c, realIndex:i}));
  indexed.reverse();
  el.innerHTML = indexed.map((item, displayIdx) => {
    const isNew = lastStagedCount > 0 && displayIdx < lastStagedCount;
    const numsStr = item.combo.main.join(', ') + (item.combo.bonus.length ? ' + ' + item.combo.bonus.join(', ') : '');
    return `<div class="combo-row${isNew?' new':''}"><span class="cr-nums">${numsStr}${isNew?`<span class="cr-tag">${t().newTag}</span>`:''}</span><span class="cr-del" onclick="removeStagedCombo(${item.realIndex})">✕</span></div>`;
  }).join('');
  document.getElementById('stagedLabel').textContent = t().stagedLabel(stagedCombos.length, maxCombos - currentRoom.myComboCount);
  const qBtn = document.getElementById('quickSaveBtn'), rBtn = document.getElementById('reviewBtn');
  if (qBtn) qBtn.disabled = stagedCombos.length === 0;
  if (rBtn) rBtn.disabled = stagedCombos.length === 0;
}
</script>
