<style>
:root{
  --board:#0c1020; --board-2:#111731; --board-line:#242c4d;

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{

}

a{ color:inherit; }

.site-sticky-top{ position:sticky; top:0; z-index:20; }
header{
  position:relative; display:flex; align-items:center; justify-content:space-between;
  padding:20px 32px; border-bottom:1px solid var(--board-line);
  background:rgba(12,16,32,0.9); backdrop-filter:blur(6px); flex-wrap:wrap; gap:12px;
}
.ticker-wrap{
  position:relative; z-index:2; border-bottom:1px solid var(--board-line);
  background:var(--board-2); overflow:hidden; padding:9px 0;
}
.ticker-label{
  position:absolute; left:0; top:0; bottom:0; z-index:2;
  display:flex; align-items:center; gap:8px; padding:0 16px 0 32px;
  background:linear-gradient(90deg, var(--board-2) 60%, transparent);
}
.ticker-label .dot{ width:7px; height:7px; border-radius:50%; background:#e3574a; animation:tpulse 1.6s ease-in-out infinite; }
@keyframes tpulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
.ticker-label span{ font-size:11px; letter-spacing:1.4px; color:var(--text-dim); font-weight:600; }
.ticker-track{ display:flex; gap:0; width:max-content; animation:tickerScroll 52s linear infinite; padding-left:190px; }
@keyframes tickerScroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
.ticker-item{ display:flex; align-items:baseline; gap:9px; padding:0 26px; border-right:1px solid var(--board-line); white-space:nowrap; font-size:13px; }
.ticker-item .flag{ width:8px; height:8px; border-radius:2px; }
.ticker-item .name{ color:var(--text-mid); }
.ticker-item .odds{ color:var(--text-dim); font-size:11.5px; }
.ticker-item .cd{ color:var(--gold-bright); font-weight:600; letter-spacing:0.3px; }
@media (prefers-reduced-motion: reduce){ .ticker-track{ animation:none; } }
.mono{ font-family:'IBM Plex Mono',monospace; }
.brand{ display:flex; align-items:center; gap:10px; text-decoration:none; cursor:pointer; }
.brand-mark{ width:34px; height:34px; border-radius:7px; background:linear-gradient(135deg, var(--gold-bright), var(--gold)); display:flex; align-items:center; justify-content:center; color:var(--ink); font-family:'Fraunces',serif; font-weight:700; font-size:17px; transform:rotate(-4deg); }
.brand-name{ font-size:20px; font-weight:600; }
.brand-name em{ font-style:normal; color:var(--gold-bright); }
nav{ display:flex; align-items:center; gap:22px; font-size:14px; color:var(--text-mid); flex-wrap:wrap; }
nav a{ text-decoration:none; } nav a:hover{ color:var(--text-hi); }
.lang-toggle{ display:flex; border:1px solid var(--board-line); border-radius:20px; overflow:hidden; }
.lang-toggle button{ border:none; background:transparent; color:var(--text-dim); font-size:12px; font-weight:600; padding:6px 14px; cursor:pointer; font-family:'Inter',sans-serif; }
.lang-toggle button.active{ background:var(--gold); color:var(--ink); }

.page-head{ max-width:820px; margin:36px auto 0; padding:0 24px; }
.page-eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:700; letter-spacing:1.6px; color:var(--gold-bright); }
.page-title{ font-size:clamp(26px,4vw,36px); font-weight:600; margin-top:10px; }
.page-sub{ color:var(--text-mid); font-size:14.5px; margin-top:10px; max-width:620px; line-height:1.7; }

.board-switch{ max-width:820px; margin:22px auto 0; padding:0 24px; display:flex; gap:8px; }
.board-switch a{ text-decoration:none; border:1px solid var(--board-line); color:var(--text-mid); font-size:12.5px; font-weight:600; padding:6px 14px; border-radius:20px; }
.board-switch a.active{ background:var(--gold); color:var(--ink); border-color:var(--gold); }

.post-list{ max-width:820px; margin:22px auto 60px; padding:0 24px; display:flex; flex-direction:column; gap:14px; }

.post-card{ background:var(--paper); color:var(--ink); border-radius:14px; overflow:hidden; box-shadow:0 14px 30px -18px rgba(0,0,0,0.55); }

.post-head-left{ display:flex; align-items:center; gap:10px; min-width:0; }
.pin-badge{ font-size:11px; background:var(--gold); color:var(--ink); padding:2px 9px; border-radius:10px; font-weight:700; flex-shrink:0; }
.post-title{ font-size:15.5px; font-weight:600; }
.post-date{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-dim); margin-top:3px; }
.toggle-icon{ font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--ink-dim); transition:transform .2s; flex-shrink:0; }
.post-card.open .toggle-icon{ transform:rotate(45deg); }
.post-body{ display:none; padding:0 22px 22px; font-size:14px; line-height:1.8; white-space:pre-wrap; }
.post-card.open .post-body{ display:block; }

.empty-state{ text-align:center; color:var(--text-mid); font-size:13.5px; padding:60px 0; }

.footer-disclaimer{ max-width:820px; margin:0 auto 50px; padding:0 24px; font-size:12px; color:var(--text-dim); line-height:1.7; }

const SUPABASE_URL = "https://wzrqaozlbfyejsbvnrxk.supabase.co";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const BOARD_TYPE = 'guide';

const i18n = {
  ko: {
    navGames:"전체 게임", navMyEntries:"내 등록번호", navGuide:"전략 가이드",
    navRacetrack:"경마장", navNotice:"공지", navBoardGuide:"사용법", liveBoard:"LIVE BOARD",

    tabNotice:"お知らせ", tabGuideBoard:"使い方",
    loading:"読み込み中…", empty:"使い方ガイドはまだありません。", pinLabel:"固定",
    footerNote:"本コンテンツは情報提供および統計的シミュレーション目的でのみ提供されます。PaperLottoは宝くじを販売せず、いかなる形でも賞金を支払いません。",

// 🔴 2026-08-31: 화면마다 기본 언어가 달랐던 것을 공용 파일로 통일했습니다.
//   주소 ?lang= → 손님이 고른 값 → 브라우저 언어 순으로 정합니다.
let currentLang = (function () {
  // 공용 파일이 있으면 그것을 씁니다 (주소 ?lang= 까지 함께 처리)
  if (typeof window.getPaperLottoLang === 'function') return window.getPaperLottoLang();
  // 대비책 — 공용 파일을 못 불러왔을 때
  try {
    var q = new URLSearchParams(location.search).get('lang');
    if (q) { var c = q.toLowerCase(); return c.indexOf('ko') === 0 ? 'ko' : (c.indexOf('ja') === 0 ? 'ja' : 'en'); }
  } catch (e) {}
  try { var v = localStorage.getItem('paperlotto_lang'); if (v) return v; } catch (e) {}
  var nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
  var l = String(nav).toLowerCase();
  return l.indexOf('ko') === 0 ? 'ko' : (l.indexOf('ja') === 0 ? 'ja' : 'en');
})();
let posts = [];
const openIds = new Set();

function applyLang(lang){
  currentLang = i18n[lang] ? lang : 'en';
  localStorage.setItem('paperlotto_lang', currentLang);
  document.documentElement.lang = currentLang; // auth-widget.js가 언어 변경을 감지하도록
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const t = i18n[currentLang][key];
    if (t !== undefined) el.textContent = t;
  });
  document.querySelectorAll('.lang-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === currentLang);
  });
  renderPosts();
  if (typeof renderTicker === 'function') renderTicker();
}

document.querySelectorAll('.lang-toggle button').forEach(btn => {
  btn.addEventListener('click', () => applyLang(btn.dataset.lang));
});

function fmtDate(iso){
  const d = new Date(iso);
  return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
}

function renderPosts(){
  const el = document.getElementById('postList');
  const t = i18n[currentLang];
  if (!posts || posts.length === 0){
    el.innerHTML = `<div class="empty-state">${t.empty}</div>`;
    return;
  }
  el.innerHTML = posts.map(p => {
    const isOpen = openIds.has(p.id);
    return `<div class="post-card${isOpen?' open':''}" data-id="${p.id}">
      <div class="post-head">
        <div class="post-head-left">
          <div>
            <div style="display:flex; align-items:center; gap:8px;">
              ${p.is_pinned ? `<span class="pin-badge">${t.pinLabel}</span>` : ''}
              <span class="post-title">${escapeHtml(p[t.titleKey])}</span>
            </div>
            <div class="post-date">${fmtDate(p.created_at)}</div>
          </div>
        </div>
        <span class="toggle-icon">+</span>
      </div>
      <div class="post-body">${escapeHtml(p[t.contentKey])}</div>
    </div>`;
  }).join('');

  el.querySelectorAll('.post-card').forEach(card => {
    card.querySelector('.post-head').addEventListener('click', () => {
      const id = card.dataset.id;
      if (openIds.has(id)) openIds.delete(id); else openIds.add(id);
      card.classList.toggle('open');
    });
  });
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadPosts(){
  const { data, error } = await sb
    .from('board_posts')
    .select('*')
    .eq('board_type', BOARD_TYPE)
    .order('is_pinned', { ascending:false })
    .order('created_at', { ascending:false });
  if (error){
    document.getElementById('postList').innerHTML = '<div class="empty-state">' + error.message + '</div>';
    return;
  }
  posts = data || [];
  renderPosts();
}

// ─── 상단 LIVE 티커 (헤더 고정용, 페이지 자체 데이터와는 별개의 독립 데이터) ───
const TICKER_GAMES = [
  { id:'us_powerball', accent:'us', nameKo:'파워볼', nameEn:'Powerball', nameJa:'パワーボール', odds:'292,201,338', days:[1,3,6], drawHour:22, drawMinute:59, tz:'America/New_York' },
  { id:'us_megamillions', accent:'us', nameKo:'메가밀리언스', nameEn:'Mega Millions', nameJa:'メガミリオンズ', odds:'290,472,336', days:[2,5], drawHour:23, drawMinute:0, tz:'America/New_York' },
  { id:'eu_euromillions', accent:'eu', nameKo:'유로밀리언스', nameEn:'EuroMillions', nameJa:'ユーロミリオンズ', odds:'139,838,160', days:[2,5], drawHour:20, drawMinute:45, tz:'Europe/Paris' },
  { id:'jp_miniloto', accent:'jp', nameKo:'미니로또', nameEn:'Mini Loto', nameJa:'ミニロト', odds:'169,911', days:[2], drawHour:18, drawMinute:45, tz:'Asia/Tokyo' },
  { id:'jp_loto7', accent:'jp', nameKo:'로또7', nameEn:'Loto 7', nameJa:'ロト7', odds:'10,295,472', days:[5], drawHour:18, drawMinute:45, tz:'Asia/Tokyo' },
  { id:'jp_loto6', accent:'jp', nameKo:'로또6', nameEn:'Loto 6', nameJa:'ロト6', odds:'6,096,454', days:[1,4], drawHour:18, drawMinute:45, tz:'Asia/Tokyo' },
  { id:'ca_lottomax', accent:'ca', nameKo:'로또맥스', nameEn:'Lotto Max', nameJa:'ロトマックス', odds:'33,446,140', days:[2,5], drawHour:22, drawMinute:30, tz:'America/Toronto' },
  { id:'ca_lotto649', accent:'ca', nameKo:'로또 6/49', nameEn:'Lotto 6/49', nameJa:'ロト 6/49', odds:'13,983,816', days:[3,6], drawHour:22, drawMinute:30, tz:'America/Toronto' },
  { id:'au_powerball', accent:'au', nameKo:'호주 파워볼', nameEn:'Australia Powerball', nameJa:'豪パワーボール', odds:'134,490,400', days:[4], drawHour:20, drawMinute:30, tz:'Australia/Sydney' },
  { id:'au_ozlotto', accent:'au', nameKo:'오즈로또', nameEn:'Oz Lotto', nameJa:'オズロト', odds:'62,891,499', days:[2], drawHour:20, drawMinute:30, tz:'Australia/Sydney' },
  { id:'au_tattslotto', accent:'au', nameKo:'새터데이로또', nameEn:'Saturday Lotto', nameJa:'サタデーロト', odds:'8,145,060', days:[6], drawHour:20, drawMinute:30, tz:'Australia/Sydney' },
  { id:'kr_lotto645', accent:'kr', nameKo:'로또 6/45', nameEn:'Lotto 6/45', nameJa:'韓国ロト6/45', odds:'8,145,060', days:[6], drawHour:20, drawMinute:45, tz:'Asia/Seoul' },
];
const TICKER_WEEKDAY_NUM = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };
function tkZonedTimeToUtc(dateStr, hour, minute, timeZone){
  const naiveUtc = new Date(`${dateStr}T${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}:00Z`);
  const tzDate = new Date(naiveUtc.toLocaleString('en-US', { timeZone }));
  const utcDate = new Date(naiveUtc.toLocaleString('en-US', { timeZone: 'UTC' }));
  const offset = utcDate.getTime() - tzDate.getTime();
  return new Date(naiveUtc.getTime() + offset);
}
function tkNextDrawDate(days, hour, minute, timeZone){
  const now = new Date();
  let best = null;
  for (let addDays = 0; addDays < 8; addDays++){
    const candidate = new Date(now.getTime() + addDays * 86400000);
    const wdName = new Intl.DateTimeFormat('en-US', { timeZone, weekday: 'short' }).format(candidate);
    const wd = TICKER_WEEKDAY_NUM[wdName];
    if (!days.includes(wd)) continue;
    const dateStr = new Intl.DateTimeFormat('en-CA', { timeZone }).format(candidate);
    const drawUtc = tkZonedTimeToUtc(dateStr, hour, minute, timeZone);
    if (drawUtc > now && (!best || drawUtc < best)) best = drawUtc;
  }
  return best;
}
function tkFmtCountdown(target){
  const dayLabel = currentLang === 'ko' ? '일' : currentLang === 'ja' ? '日' : 'd';
  const hourLabel = currentLang === 'ko' ? '시간' : currentLang === 'ja' ? '時間' : 'h';
  const diff = Math.max(0, target - new Date());
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  return d > 0 ? `${d}${dayLabel} ${h}${hourLabel}` : `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
TICKER_GAMES.forEach(g => { g.next = tkNextDrawDate(g.days, g.drawHour, g.drawMinute, g.tz); });
function renderTicker(){
  const nameKey = currentLang === 'ko' ? 'nameKo' : currentLang === 'ja' ? 'nameJa' : 'nameEn';
  const items = TICKER_GAMES.map(g => `
    <div class="ticker-item">
      <span class="flag" style="background:var(--${g.accent})"></span>
      <span class="name">${g[nameKey] || g.nameEn}</span>
      <span class="odds mono">1/${g.odds}</span>
      <span class="cd mono" data-tcd="${g.id}">${tkFmtCountdown(g.next)}</span>
    </div>`).join('');
  const track = document.getElementById('tickerTrack');
  if (track) track.innerHTML = items + items;
}
setInterval(() => {
  document.querySelectorAll('[data-tcd]').forEach(el => {
    const g = TICKER_GAMES.find(x => x.id === el.dataset.tcd);
    if (!g) return;
    if (new Date() >= g.next) g.next = tkNextDrawDate(g.days, g.drawHour, g.drawMinute, g.tz);
    el.textContent = tkFmtCountdown(g.next);
  });
