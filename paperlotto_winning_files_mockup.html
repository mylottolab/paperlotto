<!DOCTYPE html>

<style>
:root{
  --board:#0c1020; --board-2:#111731; --board-line:#242c4d;
  --paper:#f6f1e4; --ink:#1c2130; --ink-dim:#5b5646;
  --gold:#b8862e; --gold-bright:#e0aa4e;
  --text-hi:#f2efe4; --text-mid:#a7adc7; --text-dim:#6b7195;
  --ok:#1f7a4f; --err:#c65a2e;
  --us:#5b8ac9; --eu:#6a5bc9; --jp:#c95b6e; --ca:#c94a4a; --au:#c9a05b; --kr:#5bc98a;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--board); color:var(--text-hi); min-height:100vh;
  font-family:'Inter',sans-serif; word-break:keep-all;
  background-image:linear-gradient(var(--board-line) 1px, transparent 1px), linear-gradient(90deg, var(--board-line) 1px, transparent 1px);
  background-size:64px 64px;
}
h1,h2{ font-family:'Fraunces',serif; margin:0; }
a{ color:inherit; text-decoration:none; }

.site-sticky-top{ position:sticky; top:0; z-index:20; }
header{
  position:relative; display:flex; align-items:center; justify-content:space-between;
  padding:18px 32px; border-bottom:1px solid var(--board-line); flex-wrap:wrap; gap:10px;
  background:rgba(12,16,32,0.9); backdrop-filter:blur(6px);
}
.ticker-wrap{
  position:relative; z-index:2; border-bottom:1px solid var(--board-line);
  background:var(--board-2); overflow:hidden; padding:9px 0;
}
.ticker-label{
  position:absolute; left:0; top:0; bottom:0; z-index:2;
  display:flex; align-items:center; gap:8px; padding:0 16px 0 32px;
  background:linear-gradient(90deg, var(--board-2) 60%, transparent);
}
.ticker-label .dot{ width:7px; height:7px; border-radius:50%; background:#e3574a; animation:tpulse 1.6s ease-in-out infinite; }
@keyframes tpulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
.ticker-label span{ font-size:11px; letter-spacing:1.4px; color:var(--text-dim); font-weight:600; }
.ticker-track{ display:flex; gap:0; width:max-content; animation:tickerScroll 52s linear infinite; padding-left:190px; }
@keyframes tickerScroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
.ticker-item{ display:flex; align-items:baseline; gap:9px; padding:0 26px; border-right:1px solid var(--board-line); white-space:nowrap; font-size:13px; }
.ticker-item .flag{ width:8px; height:8px; border-radius:2px; }
.ticker-item .name{ color:var(--text-mid); }
.ticker-item .odds{ color:var(--text-dim); font-size:11.5px; }
.ticker-item .cd{ color:var(--gold-bright); font-weight:600; letter-spacing:0.3px; }
@media (prefers-reduced-motion: reduce){ .ticker-track{ animation:none; } }
.mono{ font-family:'IBM Plex Mono',monospace; }
.brand{ display:flex; align-items:center; gap:10px; text-decoration:none; cursor:pointer; }
.brand-mark{ width:30px; height:30px; border-radius:6px; background:linear-gradient(135deg,var(--gold-bright),var(--gold)); display:flex; align-items:center; justify-content:center; color:var(--ink); font-weight:700; font-family:'Fraunces',serif; transform:rotate(-4deg); }
.brand-name{ font-size:17px; font-weight:600; }
.brand-name em{ font-style:normal; color:var(--gold-bright); }
nav{ display:flex; align-items:center; gap:18px; font-size:13.5px; color:var(--text-mid); flex-wrap:wrap; }
.header-right{ display:flex; flex-direction:column; align-items:flex-end; gap:10px; }
.lang-toggle{ display:flex; border:1px solid var(--board-line); border-radius:20px; overflow:hidden; }
.lang-toggle button{ border:none; background:transparent; color:var(--text-dim); font-size:12px; font-weight:600; padding:6px 14px; cursor:pointer; font-family:'Inter',sans-serif; }
.lang-toggle button.active{ background:var(--gold); color:var(--ink); }

main{ max-width:920px; margin:0 auto; padding:40px 24px 90px; }
.page-title{ font-size:24px; margin-bottom:6px; }
.page-desc{ font-size:13.5px; color:var(--text-mid); margin-bottom:24px; line-height:1.7; }

.balance-panel{ background:var(--paper); color:var(--ink); border-radius:14px; padding:22px 28px; margin-bottom:22px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.balance-label{ font-size:12.5px; color:var(--ink-dim); }
.balance-num{ font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:700; color:#8a5b1c; }

.login-notice{ background:var(--paper); color:var(--ink); border-radius:14px; padding:28px; text-align:center; font-size:13.5px; margin-bottom:22px; }
.login-notice a{ color:#8a5b1c; text-decoration:underline; font-weight:600; }

.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
.card{ background:var(--paper); color:var(--ink); border-radius:14px; padding:20px; position:relative; }
.card .flag{ font-size:20px; margin-right:6px; }
.card .name{ font-size:15px; font-weight:700; margin-bottom:10px; }
.card .range{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:#8a5b1c; font-weight:600; margin-bottom:2px; }
.card .date-range{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-dim); margin-bottom:4px; }
.card .count{ font-size:11.5px; color:var(--ink-dim); margin-bottom:14px; }
.card .free-badge{ position:absolute; top:16px; right:16px; background:rgba(31,122,79,0.15); color:var(--ok); font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; }

.dl-btn{
  width:100%; padding:11px; border:none; border-radius:8px; background:var(--gold); color:var(--ink);
  font-size:13px; font-weight:700; cursor:pointer;
}
.dl-btn:hover{ background:var(--gold-bright); }
.dl-btn:disabled{ opacity:0.6; cursor:not-allowed; }

.empty-state{ text-align:center; color:var(--text-mid); font-size:13.5px; padding:40px 0; grid-column:1/-1; }

@media (max-width:480px){
  header{ padding:14px 16px; }
  .header-right{ width:100%; align-items:flex-end; }
  .lang-toggle button{ padding:5px 9px; font-size:11px; }
  nav{ font-size:12px; gap:10px; }
  .ticker-label{ padding:0 10px 0 16px; }
  .ticker-label span{ font-size:10px; }
  .ticker-item{ padding:0 16px; font-size:11.5px; }
  main{ padding:24px 14px 70px; }
  .grid{ grid-template-columns:repeat(2,1fr); gap:10px; }
  .card{ padding:14px; }
}
</style>

<script>
const SUPABASE_URL = "https://wzrqaozlbfyejsbvnrxk.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_3KrYMzwrVlbYr-e9d8UiLA_KgvSs8tC";
const META_URL = SUPABASE_URL + "/functions/v1/winning-files-meta";
const DOWNLOAD_URL = SUPABASE_URL + "/functions/v1/winning-files-download";
const POINTS_BALANCE_URL = SUPABASE_URL + "/functions/v1/points-balance";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let accessToken = null;

// game_id → 표시용 국기/이름. DB의 실제 game_id 값에 맞춰 필요시 추가/수정하세요.
// (여기 없는 game_id가 와도 화면에는 정상적으로 뜨고, 국기 없이 game_id 그대로 표시됩니다.)

  jp_miniloto:     { flag:'🇯🇵', nameKo:'일본 미니로또', nameEn:'Japan Mini Loto', nameJa:'ミニロト' },
  ca_lotto649:     { flag:'🇨🇦', nameKo:'캐나다 로또 6/49', nameEn:'Canada Lotto 6/49', nameJa:'カナダロト6/49' },
  ca_lottomax:     { flag:'🇨🇦', nameKo:'캐나다 로또맥스', nameEn:'Canada Lotto Max', nameJa:'ロトマックス' },
  au_powerball:    { flag:'🇦🇺', nameKo:'호주 파워볼', nameEn:'Australia Powerball', nameJa:'豪パワーボール' },
  au_ozlotto:      { flag:'🇦🇺', nameKo:'호주 오즈로또', nameEn:'Oz Lotto', nameJa:'オズロト' },
  au_tattslotto:   { flag:'🇦🇺', nameKo:'새터데이로또 (Tatts Lotto)', nameEn:'Saturday Lotto (Tatts Lotto)', nameJa:'サタデーロト' },
  eu_euromillions: { flag:'🇪🇺', nameKo:'유로밀리언스', nameEn:'EuroMillions', nameJa:'ユーロミリオンズ' },
};
function displayName(gameId){
  const d = DISPLAY[gameId];
  if (!d) return { flag:'🎟️', name:gameId };
  const key = currentLang === 'ko' ? 'nameKo' : currentLang === 'ja' ? 'nameJa' : 'nameEn';
  return { flag:d.flag, name:d[key] || d.nameEn };
}

// ─── 다국어 텍스트 ───
const i18n = {
  ko: {
    navGames:"전체 게임", navMyEntries:"내 등록번호", navGuide:"전략 가이드", navNotice:"공지사항", navBoardGuide:"사용설명", liveBoard:"LIVE BOARD",
    pageTitle:"📄 역대 당첨번호 다운로드",
    pageDesc:"12개국 복권의 역대 당첨번호 전체를 CSV 파일로 다운로드합니다. 다운로드 1회당 2,500P가 차감되며, 같은 게임을 24시간 이내에 다시 다운로드하면 무료입니다.",
    balanceLabel:"현재 보유 포인트",
    loginNotice:'다운로드하려면 먼저 <a href="paperlotto_login_mockup.html">로그인</a>이 필요합니다.',
    loading:"불러오는 중…", noData:"표시할 데이터가 없습니다.", loadError:"불러오는 중 오류가 발생했습니다.",
    freeBadge:"무료 재다운로드", btnFree:"⬇ 무료로 다시 다운로드", btnPaid:"⬇ 다운로드 (2,500P)",
    countUnit:(n)=> n.toLocaleString() + "개 회차 데이터",
    confirmFree:(name)=> name + " 파일을 24시간 이내 무료로 다시 다운로드합니다.",
    confirmPaid:(name)=> name + " 역대 당첨번호 파일을 2,500포인트로 다운로드하시겠습니까?",
    insufficientPoints:"포인트가 부족합니다.", downloadFailed:"다운로드에 실패했습니다. 잠시 후 다시 시도해주세요.",
    downloadError:"다운로드 중 오류가 발생했습니다.",
  },
  en: {
    navGames:"All Games", navMyEntries:"My Entries", navGuide:"Strategy Guide", navNotice:"Notices", navBoardGuide:"How It Works", liveBoard:"LIVE BOARD",
    pageTitle:"📄 Historical Winning Numbers Download",
    pageDesc:"Download the full winning-number history for all 12 lotteries as CSV files. Each download costs 2,500P, and re-downloading the same game within 24 hours is free.",
    balanceLabel:"Current Points Balance",
    loginNotice:'You need to <a href="paperlotto_login_mockup.html">log in</a> first to download.',
    loading:"Loading…", noData:"No data to display.", loadError:"An error occurred while loading.",
    freeBadge:"Free re-download", btnFree:"⬇ Re-download for free", btnPaid:"⬇ Download (2,500P)",
    countUnit:(n)=> n.toLocaleString() + " draws of data",
    confirmFree:(name)=> "Re-download the " + name + " file for free (within 24 hours).",
    confirmPaid:(name)=> "Download the full winning-number history for " + name + " for 2,500 points?",
    insufficientPoints:"Not enough points.", downloadFailed:"Download failed. Please try again later.",
    downloadError:"An error occurred during download.",
  },
  ja: {
    navGames:"すべてのゲーム", navMyEntries:"マイ登録番号", navGuide:"戦略ガイド", navNotice:"お知らせ", navBoardGuide:"使い方", liveBoard:"LIVE BOARD",
    pageTitle:"📄 歴代当選番号ダウンロード",
    pageDesc:"12か国の宝くじの歴代当選番号全てをCSVファイルでダウンロードします。ダウンロード1回につき2,500Pが差し引かれ、同じゲームを24時間以内に再ダウンロードすると無料です。",
    balanceLabel:"現在の保有ポイント",
    loginNotice:'ダウンロードするには先に<a href="paperlotto_login_mockup.html">ログイン</a>が必要です。',
    loading:"読み込み中…", noData:"表示するデータがありません。", loadError:"読み込み中にエラーが発生しました。",
    freeBadge:"無料再ダウンロード", btnFree:"⬇ 無料で再ダウンロード", btnPaid:"⬇ ダウンロード (2,500P)",
    countUnit:(n)=> n.toLocaleString() + "回分のデータ",
    confirmFree:(name)=> name + "のファイルを24時間以内は無料で再ダウンロードします。",
    confirmPaid:(name)=> name + "の歴代当選番号ファイルを2,500ポイントでダウンロードしますか？",
    insufficientPoints:"ポイントが不足しています。", downloadFailed:"ダウンロードに失敗しました。しばらくしてから再度お試しください。",
    downloadError:"ダウンロード中にエラーが発生しました。",
  },
};
let currentLang = localStorage.getItem('paperlotto_lang') || 'ko';

function applyLang(lang){
  currentLang = i18n[lang] ? lang : 'ko';
  localStorage.setItem('paperlotto_lang', currentLang);
  document.documentElement.lang = currentLang; // auth-widget.js가 언어 변경을 감지하도록
  const t = i18n[currentLang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (typeof t[key] === 'string') el.innerHTML = t[key];
  });
  document.getElementById('loginNotice').innerHTML = t.loginNotice;
  document.querySelectorAll('.lang-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === currentLang);
  });
  loadGrid();
  if (typeof renderTicker === 'function') renderTicker();
}
document.querySelectorAll('.lang-toggle button').forEach(btn => {
  btn.addEventListener('click', () => applyLang(btn.dataset.lang));
});

async function refreshBalance(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    document.getElementById('loginNotice').style.display = 'block';
    document.getElementById('balanceNum').textContent = '–';
    accessToken = null;
    return false;
  }
  accessToken = session.access_token;
  document.getElementById('loginNotice').style.display = 'none';
  try {
    const resp = await fetch(POINTS_BALANCE_URL, { headers: { 'Authorization': 'Bearer ' + accessToken } });
    const data = await resp.json();
    document.getElementById('balanceNum').textContent = (resp.ok ? data.total : 0).toLocaleString() + 'P';
  } catch (e) {
    document.getElementById('balanceNum').textContent = '0P';
  }
  return true;
}

async function loadGrid(){
  const grid = document.getElementById('grid');
  const t = i18n[currentLang];
  try {
    const headers = { 'Authorization': 'Bearer ' + (accessToken || SUPABASE_PUBLISHABLE_KEY) }; // 로그인 안 했어도 게이트웨이 인증 통과하도록 anon key로 대체
    const resp = await fetch(META_URL, { headers });
    const data = await resp.json();
    if (!resp.ok || !data.items || data.items.length === 0) {
      grid.innerHTML = '<div class="empty-state">' + t.noData + '</div>';
      return;
    }
    grid.innerHTML = data.items.map(renderCard).join('');
  } catch (e) {
    grid.innerHTML = '<div class="empty-state">' + t.loadError + '</div>';
  }
}

function wfFormatRound(raw){
  if (!raw) return '-';
  const m = String(raw).match(/(\d+)/);
  if (!m) return raw; // 숫자를 못 찾으면 원본 그대로 표시
  const n = m[1];
  if (currentLang === 'ko') return '제' + n + '회';
  if (currentLang === 'ja') return '第' + n + '回';
  return 'Round ' + n;
}

function renderCard(item){
  const t = i18n[currentLang];
  const disp = displayName(item.game_id);
  const isFree = item.freeRedownloadUntil && new Date(item.freeRedownloadUntil).getTime() > Date.now();
  const badge = isFree ? '<div class="free-badge">' + t.freeBadge + '</div>' : '';
  const btnLabel = isFree ? t.btnFree : t.btnPaid;
  const dateRangeText = (item.date_start && item.date_end) ? (item.date_start + ' ~ ' + item.date_end) : '';
  return (
    '<div class="card">' +
      badge +
      '<div class="name"><span class="flag">' + disp.flag + '</span>' + disp.name + '</div>' +
      '<div class="range">' + wfFormatRound(item.range_start) + ' ~ ' + wfFormatRound(item.range_end) + '</div>' +
      (dateRangeText ? '<div class="date-range">' + dateRangeText + '</div>' : '') +
      '<div class="count">' + t.countUnit(Number(item.count)) + '</div>' +
      '<button class="dl-btn" onclick="downloadFile(\'' + item.game_id + '\',' + isFree + ')">' + btnLabel + '</button>' +
    '</div>'
  );
}

async function downloadFile(gameId, isFree){
  const t = i18n[currentLang];
  if (!accessToken) { window.location.href = 'paperlotto_login_mockup.html'; return; }
  const disp = displayName(gameId);
  const msg = isFree ? t.confirmFree(disp.name) : t.confirmPaid(disp.name);
  if (!confirm(msg)) return;

  try {
    const resp = await fetch(DOWNLOAD_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization': 'Bearer ' + accessToken },
      body: JSON.stringify({ gameId }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      alert(err.error === 'INSUFFICIENT_POINTS' ? t.insufficientPoints : t.downloadFailed);
      return;
    }
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = gameId + '_winning_numbers.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);

    await refreshBalance();
    await loadGrid();
  } catch (e) {
    alert(t.downloadError);
  }
}

const TICKER_WEEKDAY_NUM = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };
function tkZonedTimeToUtc(dateStr, hour, minute, timeZone){
  const naiveUtc = new Date(`${dateStr}T${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}:00Z`);
  const tzDate = new Date(naiveUtc.toLocaleString('en-US', { timeZone }));
  const utcDate = new Date(naiveUtc.toLocaleString('en-US', { timeZone: 'UTC' }));
  const offset = utcDate.getTime() - tzDate.getTime();
  return new Date(naiveUtc.getTime() + offset);
}
function tkNextDrawDate(days, hour, minute, timeZone){
  const now = new Date();
  let best = null;
  for (let addDays = 0; addDays < 8; addDays++){
    const candidate = new Date(now.getTime() + addDays * 86400000);
    const wdName = new Intl.DateTimeFormat('en-US', { timeZone, weekday: 'short' }).format(candidate);
    const wd = TICKER_WEEKDAY_NUM[wdName];
    if (!days.includes(wd)) continue;
    const dateStr = new Intl.DateTimeFormat('en-CA', { timeZone }).format(candidate);
    const drawUtc = tkZonedTimeToUtc(dateStr, hour, minute, timeZone);
    if (drawUtc > now && (!best || drawUtc < best)) best = drawUtc;
  }
  return best;
}
function tkFmtCountdown(target){
  const dayLabel = currentLang === 'ko' ? '일' : currentLang === 'ja' ? '日' : 'd';
  const hourLabel = currentLang === 'ko' ? '시간' : currentLang === 'ja' ? '時間' : 'h';
  const diff = Math.max(0, target - new Date());
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  return d > 0 ? `${d}${dayLabel} ${h}${hourLabel}` : `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
TICKER_GAMES.forEach(g => { g.next = tkNextDrawDate(g.days, g.drawHour, g.drawMinute, g.tz); });
function renderTicker(){
  const nameKey = currentLang === 'ko' ? 'nameKo' : currentLang === 'ja' ? 'nameJa' : 'nameEn';
  const items = TICKER_GAMES.map(g => `
    <div class="ticker-item">
      <span class="flag" style="background:var(--${g.accent})"></span>
      <span class="name">${g[nameKey] || g.nameEn}</span>
      <span class="odds mono">1/${g.odds}</span>
      <span class="cd mono" data-tcd="${g.id}">${tkFmtCountdown(g.next)}</span>
    </div>`).join('');
  const track = document.getElementById('tickerTrack');
  if (track) track.innerHTML = items + items;
}
setInterval(() => {
  document.querySelectorAll('[data-tcd]').forEach(el => {
    const g = TICKER_GAMES.find(x => x.id === el.dataset.tcd);
    if (!g) return;
    if (new Date() >= g.next) g.next = tkNextDrawDate(g.days, g.drawHour, g.drawMinute, g.tz);
    el.textContent = tkFmtCountdown(g.next);
  });
}, 1000);
