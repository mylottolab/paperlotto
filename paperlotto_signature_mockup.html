<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마이 시그니처 — PaperLotto</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --board:#0c1020; --board-2:#111731; --board-line:#242c4d;
  --paper:#f6f1e4; --ink:#1c2130; --ink-dim:#5b5646;
  --gold:#b8862e; --gold-bright:#e0aa4e;
  --text-hi:#f2efe4; --text-mid:#a7adc7; --text-dim:#6b7195;
  --ok:#1f7a4f; --err:#c65a2e;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--board); color:var(--text-hi); min-height:100vh;
  font-family:'Inter',sans-serif; word-break:keep-all;
  background-image:linear-gradient(var(--board-line) 1px, transparent 1px), linear-gradient(90deg, var(--board-line) 1px, transparent 1px);
  background-size:64px 64px;
}
h1,h2{ font-family:'Fraunces',serif; margin:0; }
a{ color:inherit; text-decoration:none; }
.mono{ font-family:'IBM Plex Mono',monospace; }

.site-sticky-top{ position:sticky; top:0; z-index:20; }
.ticker-wrap{
  position:relative; z-index:2; border-bottom:1px solid var(--board-line);
  background:var(--board-2); overflow:hidden; padding:9px 0;
}
.ticker-label{
  position:absolute; left:0; top:0; bottom:0; z-index:2;
  display:flex; align-items:center; gap:8px; padding:0 16px 0 32px;
  background:linear-gradient(90deg, var(--board-2) 60%, transparent);
}
.ticker-label .dot{ width:7px; height:7px; border-radius:50%; background:#e3574a; animation:tpulse 1.6s ease-in-out infinite; }
@keyframes tpulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
.ticker-label span{ font-size:11px; letter-spacing:1.4px; color:var(--text-dim); font-weight:600; }
.ticker-track{ display:flex; gap:0; width:max-content; animation:tickerScroll 52s linear infinite; padding-left:190px; }
@keyframes tickerScroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
.ticker-item{ display:flex; align-items:baseline; gap:9px; padding:0 26px; border-right:1px solid var(--board-line); white-space:nowrap; font-size:13px; }
.ticker-item .flag{ width:8px; height:8px; border-radius:2px; }
.ticker-item .name{ color:var(--text-mid); }
.ticker-item .odds{ color:var(--text-dim); font-size:11.5px; }
.ticker-item .cd{ color:var(--gold-bright); font-weight:600; letter-spacing:0.3px; }
@media (prefers-reduced-motion: reduce){ .ticker-track{ animation:none; } }

header{
  position:relative; z-index:5; display:flex; align-items:center; justify-content:space-between;
  padding:18px 32px; border-bottom:1px solid var(--board-line); flex-wrap:wrap; gap:10px;
  background:rgba(12,16,32,0.9); backdrop-filter:blur(6px);
}
.brand{ display:flex; align-items:center; gap:10px; text-decoration:none; cursor:pointer; }
.brand-mark{ width:30px; height:30px; border-radius:6px; background:linear-gradient(135deg,var(--gold-bright),var(--gold)); display:flex; align-items:center; justify-content:center; color:var(--ink); font-weight:700; font-family:'Fraunces',serif; transform:rotate(-4deg); }
.brand-name{ font-size:17px; font-weight:600; }
.brand-name em{ font-style:normal; color:var(--gold-bright); }
nav{ display:flex; align-items:center; gap:18px; font-size:13.5px; color:var(--text-mid); }
.header-right{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
.lang-toggle{ display:flex; border:1px solid var(--board-line); border-radius:20px; overflow:hidden; flex-shrink:0; }
.lang-toggle button{ border:none; background:transparent; color:var(--text-dim); font-size:12px; font-weight:600; padding:6px 12px; cursor:pointer; font-family:'Inter',sans-serif; }
.lang-toggle button.active{ background:var(--gold); color:var(--ink); }

main{ max-width:820px; margin:0 auto; padding:28px 24px 90px; }
.page-title{ font-size:24px; font-weight:600; margin-bottom:6px; }
.page-sub{ font-size:13px; color:var(--text-mid); margin-bottom:20px; }

.panel{ background:var(--paper); color:var(--ink); border-radius:14px; padding:22px; margin-bottom:18px; }
.panel h3{ font-size:14px; margin-bottom:12px; }
label{ display:block; font-size:12px; font-weight:600; color:var(--ink-dim); margin:10px 0 6px; }
label:first-child{ margin-top:0; }
select, input[type="text"], input[type="number"]{
  width:100%; padding:10px 12px; border:1.5px solid rgba(28,33,48,0.15); border-radius:8px;
  font-size:13px; font-family:'Inter',sans-serif; color:var(--ink); background:#fff;
}
.row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
.add-btn{
  margin-top:14px; padding:11px 16px; border:none; border-radius:8px; background:var(--ink); color:var(--paper);
  font-size:13px; font-weight:600; cursor:pointer;
}
.add-btn:hover{ background:#2a3145; }

.toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
.tb-btn{
  padding:9px 16px; border-radius:8px; border:1.5px solid var(--board-line); background:var(--board-2);
  color:var(--text-hi); font-size:12.5px; font-weight:600; cursor:pointer;
}
.tb-btn:hover{ border-color:var(--gold); }
.tb-btn:disabled{ opacity:0.4; cursor:not-allowed; }

.list-wrap{ background:var(--paper); color:var(--ink); border-radius:14px; overflow:hidden; }
.list-header{
  display:flex; align-items:center; gap:12px; padding:10px 18px; background:var(--board-2);
  border-radius:10px 10px 0 0; font-size:10.5px; font-weight:700; color:var(--text-hi); letter-spacing:0.03em;
}
.list-header .lh-check{ width:16px; flex-shrink:0; display:flex; align-items:center; }
.list-header .lh-check input[type="checkbox"]{ width:15px; height:15px; cursor:pointer; }
.list-header .lh-col{ cursor:pointer; user-select:none; display:flex; align-items:center; gap:3px; }
.list-header .lh-col:hover{ color:var(--gold-bright); }
.list-header .lh-game{ width:70px; flex-shrink:0; }
.list-header .lh-round{ width:76px; flex-shrink:0; }
.list-header .lh-numbers{ width:210px; flex-shrink:0; }
.list-header .lh-grade{ width:44px; flex-shrink:0; text-align:center; }
.list-header .lh-memo{ flex:1; min-width:100px; }
.list-header .lh-actions{ width:70px; flex-shrink:0; }
.list-header .lh-arrow{ font-size:9px; opacity:0.85; color:var(--gold-bright); }
.wl-row{
  display:flex; align-items:center; gap:12px; padding:14px 18px;
  border-bottom:1px solid rgba(28,33,48,0.08); flex-wrap:wrap;
}
.wl-row:last-child{ border-bottom:none; }
.wl-row input[type="checkbox"]{ width:16px; height:16px; flex-shrink:0; }
.wl-game{ font-size:11px; font-weight:700; color:var(--ink-dim); width:70px; flex-shrink:0; }
.wl-round{ font-size:11px; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace; width:76px; flex-shrink:0; line-height:1.5; }
.wl-round .rd-draw{ font-size:10px; color:var(--ink-dim); opacity:0.75; }
.wl-numbers{ display:flex; gap:4px; flex-wrap:wrap; width:210px; flex-shrink:0; }
.pip{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; background:rgba(28,33,48,0.07); color:var(--ink-dim); flex-shrink:0; }
.pip.bonus{ background:var(--gold); color:var(--ink); }
.wl-grade{ font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:12px; white-space:nowrap; flex-shrink:0; width:44px; text-align:center; }
.wl-grade:not(:empty){ background:rgba(31,122,79,0.14); color:var(--ok); }
.wl-memo{ flex:1; min-width:100px; font-size:12px; color:var(--ink-dim); font-style:italic; }
.wl-actions{ display:flex; gap:6px; flex-shrink:0; }
.icon-btn{
  width:28px; height:28px; border-radius:6px; border:none; cursor:pointer; font-size:12px;
  background:rgba(28,33,48,0.08); color:var(--ink-dim);
}
.icon-btn.danger{ background:rgba(198,90,46,0.12); color:var(--err); }
.icon-btn:hover{ opacity:0.75; }

.empty-note, .loading-note{ text-align:center; padding:40px 0; font-size:13px; color:var(--ink-dim); }

.coll-panel h3{ margin-bottom:12px; }
.coll-strip{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.coll-chip{
  padding:10px 16px; border-radius:20px; border:1.5px solid rgba(28,33,48,0.15); background:#fff;
  font-size:12.5px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; position:relative;
}
.coll-chip-name{ max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.coll-chip-icon{
  border:none; background:transparent; color:var(--ink-dim); font-size:11px; cursor:pointer; padding:2px 3px;
  border-radius:5px; line-height:1;
}
.coll-chip-icon:hover{ background:rgba(28,33,48,0.08); color:var(--ink); }
.coll-chip-icon.danger:hover{ background:rgba(198,90,46,0.12); color:#c65a2e; }
.coll-chip.just-created{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(184,134,46,0.25); animation:collPulse 1.6s ease-in-out 2; }
@keyframes collPulse{ 0%,100%{ box-shadow:0 0 0 3px rgba(184,134,46,0.25); } 50%{ box-shadow:0 0 0 6px rgba(184,134,46,0.08); } }
.new-badge{ position:absolute; top:-9px; left:10px; background:var(--gold); color:var(--ink); font-size:9px; font-weight:700; padding:2px 7px; border-radius:10px; letter-spacing:0.02em; }
.coll-chip .cnt{ font-size:10.5px; color:var(--ink-dim); font-weight:400; }
.coll-chip.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.coll-chip.active .cnt{ color:var(--text-mid); }
.coll-new-row{ display:flex; gap:8px; margin-top:4px; }
.coll-new-row input{ flex:1; padding:10px 12px; border:1.5px solid rgba(28,33,48,0.15); border-radius:8px; font-size:13px; }
.coll-new-row button{ padding:10px 14px; border:none; border-radius:8px; background:var(--gold); color:var(--ink); font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap; }
.coll-new-row button:hover{ background:var(--gold-bright); }
.icon-btn.edit{ background:rgba(44,79,163,0.10); color:#2c4fa3; }

.confirm-overlay{
  position:fixed; inset:0; background:rgba(12,16,32,0.78); z-index:60;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.confirm-panel{ background:var(--paper); color:var(--ink); border-radius:14px; padding:26px; max-width:380px; width:100%; }
.confirm-panel h3{ font-size:16px; margin-bottom:16px; }
.confirm-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid rgba(28,33,48,0.10); font-size:13px; }
.confirm-row:last-of-type{ border-bottom:none; }
.confirm-row strong{ font-family:'IBM Plex Mono',monospace; font-size:14px; }
.confirm-row strong.cost{ color:#8a5b1c; }
.confirm-note{ font-size:11px; color:var(--ink-dim); margin-top:12px; line-height:1.6; background:rgba(198,90,46,0.08); padding:9px 11px; border-radius:8px; }
.confirm-btn-row{ display:flex; gap:8px; margin-top:18px; }
.confirm-btn-row button{ flex:1; padding:12px; border-radius:9px; font-size:13px; font-weight:700; cursor:pointer; border:none; }
#confirmCancelBtn{ background:transparent; border:1.5px solid rgba(28,33,48,0.15); color:var(--ink-dim); }
#confirmProceedBtn{ background:var(--gold); color:var(--ink); }
#confirmProceedBtn:hover{ background:var(--gold-bright); }
#confirmProceedBtn:disabled{ opacity:0.55; cursor:not-allowed; }

@media (max-width:640px){
  header{ padding:14px 16px; }
  .header-right{ width:100%; align-items:flex-end; }
  nav{ width:100%; justify-content:flex-end; flex-wrap:wrap; gap:6px 10px; font-size:11px; }
  .lang-toggle button{ padding:5px 9px; font-size:11px; }
  .ticker-label{ padding:0 10px 0 16px; }
  .ticker-label span{ font-size:10px; }
  .ticker-item{ padding:0 16px; font-size:11.5px; }
  main{ padding:20px 14px 70px; }
  .page-title{ font-size:20px; }
  .panel{ padding:16px; }
  .row3{ grid-template-columns:1fr; }
  .toolbar{ gap:8px; }
  .tb-btn{ flex:1 1 auto; font-size:11.5px; padding:9px 10px; }
  .wl-row{ gap:8px; }
  .wl-game, .wl-round{ width:auto; }
  .wl-numbers{ width:auto; min-width:90px; }
  .wl-memo{ flex:1 1 100%; order:5; }
  .wl-grade{ width:auto; }
  .pip{ width:22px; height:22px; font-size:10px; }
  .list-header{ font-size:9.5px; padding:8px 10px; gap:6px; flex-wrap:wrap; row-gap:4px; }
  .list-header .lh-game, .list-header .lh-round{ width:auto; }
  .list-header .lh-numbers{ width:auto; min-width:90px; }
  .list-header .lh-grade{ width:auto; }
  .list-header .lh-memo{ flex:1 1 100%; order:5; min-width:0; }
  .list-header .lh-actions{ width:auto; }
}
</style>
</head>
<body>

<div class="site-sticky-top">
<header>
  <a class="brand" href="/" aria-label="PaperLotto — 홈으로">
    <div class="brand-mark">P</div>
    <div class="brand-name">Paper<em>Lotto</em></div>
  </a>
  <div class="header-right">
    <div class="lang-toggle">
      <button data-lang="ko" type="button">KR</button>
      <button data-lang="en" class="active" type="button">EN</button>
      <button data-lang="ja" type="button">JA</button>
    </div>
    <nav>
      <a href="index.html#board" data-i18n="navGames">전체 게임</a>
      <a href="paperlotto_my_entries_updated.html" data-i18n="navEntries">내 등록내역</a>
      <a href="paperlotto_guide_mockup.html" data-i18n="navGuide">전략 가이드</a>
      <a href="paperlotto_racetrack_mockup.html" data-i18n="navRacetrack">경마장</a>
    <a href="paperlotto_board_notice.html" data-i18n="navNotice">공지</a>
      <div id="authWidget"></div>
    </nav>
  </div>
</header>

<!-- 신호 티커: 12개 게임 다음 추첨까지 남은 시간이 실시간으로 흐름 -->
<div class="ticker-wrap">
  <div class="ticker-label"><span class="dot"></span><span data-i18n="liveBoard">LIVE BOARD</span></div>
  <div class="ticker-track" id="tickerTrack"></div>
</div>
</div>

<main>
  <div class="page-title" data-i18n="pageTitle">마이 시그니처</div>
  <div class="page-sub" data-i18n="pageSub">등록내역에서 옮겨온 번호와 직접 추가한 번호를 자유롭게 수정·삭제하며 관리합니다. 메모도 남길 수 있습니다.</div>

  <div class="panel coll-panel">
    <h3 data-i18n="collTitle">마이 시그니처</h3>
    <div class="coll-strip" id="collStrip"><div class="loading-note" data-i18n="loading">불러오는 중…</div></div>
    <div class="coll-new-row">
      <input type="text" id="collNewName">
      <button id="collCreateBtn" data-i18n="collCreateBtn">+ 새로 만들기 (500P)</button>
    </div>
  </div>

  <div id="workArea" style="display:none;">
    <div class="panel">
      <h3 data-i18n="addTitle">+ 새 번호 직접 추가</h3>
      <label data-i18n="gameLabel">게임</label>
      <select id="addGame"></select>
      <div class="row3">
        <div><label data-i18n="roundLabel">회차 (선택)</label><input type="number" id="addRound"></div>
        <div><label data-i18n="drawDateLabel">추첨일 (선택)</label><input type="date" id="addDrawDate"></div>
        <div><label data-i18n="memoLabel">메모 (선택)</label><input type="text" id="addMemo"></div>
      </div>
      <label data-i18n="mainLabel">메인 번호 (쉼표로 구분)</label>
      <input type="text" id="addMain" class="mono">
      <label data-i18n="bonusLabel">보너스 번호 (쉼표로 구분, 선택)</label>
      <input type="text" id="addBonus" class="mono">
      <button class="add-btn" id="addBtn" data-i18n="addBtn">추가하기</button>
    </div>

    <div class="toolbar">
      <button class="tb-btn" id="exportExcelBtn" data-i18n="exportExcel">엑셀 다운로드 (100P)</button>
      <button class="tb-btn" id="exportPdfBtn" data-i18n="exportPdf">PDF 생성 (100P)</button>
      <button class="tb-btn" id="deleteSelectedBtn" data-i18n="deleteSelected">선택 삭제</button>
    </div>

    <div class="list-header" id="listHeader"></div>
    <div class="list-wrap" id="listWrap">
      <div class="loading-note" data-i18n="loading">불러오는 중…</div>
    </div>
  </div>
</main>

<div class="confirm-overlay" id="createConfirmModal" style="display:none;">
  <div class="confirm-panel">
    <h3 data-i18n="createConfirmTitle">마이 시그니처를 생성할까요?</h3>
    <div class="confirm-row">
      <span data-i18n="confirmNameLabel">이름</span>
      <strong id="confirmCollName"></strong>
    </div>
    <div class="confirm-row">
      <span data-i18n="confirmCostLabel">생성 비용</span>
      <strong class="cost">500P</strong>
    </div>
    <div class="confirm-row">
      <span data-i18n="confirmBalanceBeforeLabel">현재 보유 포인트</span>
      <strong id="confirmBalanceBefore"></strong>
    </div>
    <div class="confirm-row">
      <span data-i18n="confirmBalanceAfterLabel">생성 후 남는 포인트</span>
      <strong id="confirmBalanceAfter"></strong>
    </div>
    <div class="confirm-note" data-i18n="confirmNote">생성 즉시 500포인트가 차감되며, 취소·환불되지 않습니다.</div>
    <div class="confirm-btn-row">
      <button type="button" id="confirmCancelBtn" data-i18n="confirmCancel">취소</button>
      <button type="button" id="confirmProceedBtn" data-i18n="confirmProceed">생성하기 (500P 차감)</button>
    </div>
  </div>
</div>

<script>
const i18n = {
  ko: {
    navEntries:"내 등록내역", pageTitle:"마이 시그니처",
    navGames:"전체 게임", navGuide:"전략 가이드", navRacetrack:"경마장", navNotice:"공지", liveBoard:"LIVE BOARD",
    pageSub:"등록내역에서 옮겨온 번호와 직접 추가한 번호를 자유롭게 수정·삭제하며 관리합니다. 메모도 남길 수 있습니다.",
    collTitle:"마이 시그니처", collCreateBtn:"+ 새로 만들기 (500P)", collNameNeeded:"컬렉션 이름을 입력해주세요.",
    newBadge:"방금 생성됨", renameTitle:"이름 변경", deleteCollTitle:"삭제",
    renamePrompt:"새 이름을 입력하세요:",
    deleteCollConfirm:function(name, count){ return '"' + name + '" 컬렉션을 삭제할까요? (안의 번호 ' + count + '개도 함께 삭제되며, 되돌릴 수 없습니다)'; },
    collCreateSuccess:function(name){ return '✅ "' + name + '" 마이 시그니처가 생성되었습니다!'; },
    createConfirmTitle:"마이 시그니처를 생성할까요?", confirmNameLabel:"이름", confirmCostLabel:"생성 비용",
    confirmBalanceBeforeLabel:"현재 보유 포인트", confirmBalanceAfterLabel:"생성 후 남는 포인트",
    confirmNote:"생성 즉시 500포인트가 차감되며, 취소·환불되지 않습니다.",

function fmtShortDate(iso){
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return String(d.getFullYear()).slice(2) + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
}

function estimateNextDrawLocalStr(gameId){
  const s = GAME_SCHEDULE[gameId];
  if (!s) return null;
  const next = tkNextDrawDate(s.drawDays, s.h, s.min, s.tz);
  if (!next) return null;
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone: s.tz, year:'2-digit', month:'2-digit', day:'2-digit' }).formatToParts(next);
  const y = (parts.find(p => p.type === 'year') || {}).value;
  const m = (parts.find(p => p.type === 'month') || {}).value;
  const d = (parts.find(p => p.type === 'day') || {}).value;
  if (!y || !m || !d) return null;
  return y + '.' + m + '.' + d;
}

      if (sortKey === key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      else { sortKey = key; sortDir = 'asc'; }
      renderListHeader();
      renderList();

  const checkAll = document.getElementById('checkAllHeader');

    checkAll.addEventListener('change', () => {
      document.querySelectorAll('.wl-check').forEach((c) => { c.checked = checkAll.checked; });
    });

function sortRows(rows){
  if (!sortKey) return rows;
  const dir = sortDir === 'asc' ? 1 : -1;
  return [...rows].sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (av === undefined || av === null) av = '';
    if (bv === undefined || bv === null) bv = '';
    if (av < bv) return -1 * dir;
    if (av > bv) return 1 * dir;
    return 0;
  });
}

async function ensureSession(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return false;
  accessToken = session.access_token;
  currentUserId = session.user.id;
  return true;
}

async function callSignature(payload){
  const resp = await fetch(SIGNATURE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + accessToken },
    body: JSON.stringify(payload),
  });
  const data = await resp.json();
  if (!resp.ok) {
    const err = new Error(data.error || 'Failed');
    err.code = data.code;
    err.shortfall = data.shortfall;
    err.balance = data.balance;
    err.chargeUrl = data.chargeUrl;
    throw err;
  }
  return data;
}

async function loadCollections(){
  const t = i18n[currentLang];
  const strip = document.getElementById('collStrip');
  const ok = await ensureSession();
  if (!ok) { strip.innerHTML = '<div class="empty-note">' + t.loginNeeded + '</div>'; return; }
  try {
    const data = await callSignature({ action: 'list_collections' });
    allCollections = data.collections || [];
    if (currentCollectionId && !allCollections.some(c => c.id === currentCollectionId)) currentCollectionId = null;
    if (!currentCollectionId && allCollections.length > 0) currentCollectionId = allCollections[0].id;
    renderCollections();
    if (currentCollectionId) { document.getElementById('workArea').style.display = 'block'; await loadEntries(); }
    else { document.getElementById('workArea').style.display = 'none'; }
  } catch (e) {
    strip.innerHTML = '<div class="empty-note">' + e.message + '</div>';
  }
}

// 회차(round_no)가 있는 항목은 실제 추첨일(draw_results)을 찾아서 같이 붙여준다.
// 실제 결과가 아직 없으면(미래 회차) 정기 스케줄로 추정한 날짜에 '~'를 붙여서 구분한다.
// round_no 없이 draw_date만 직접 입력해둔 항목은 그 값을 그대로 쓴다.
async function attachDrawDates(){
  const gameGroups = {};
  allRows.forEach((r) => {
    if (!r.round_no) return;
    if (!gameGroups[r.game_id]) gameGroups[r.game_id] = new Set();
    gameGroups[r.game_id].add(r.round_no);
  });
  const drawDateMap = {};
  await Promise.all(Object.keys(gameGroups).map(async (gameId) => {
    const rounds = Array.from(gameGroups[gameId]);
    const { data, error } = await sb.from('draw_results').select('round_no, draw_date').eq('game_id', gameId).in('round_no', rounds);
    if (!error && data) {
      data.forEach((d) => { drawDateMap[gameId + '_' + d.round_no] = d.draw_date; });
    }
  }));
  allRows.forEach((r) => {
    if (r.round_no) {
      const actual = drawDateMap[r.game_id + '_' + r.round_no];
      if (actual) {
        r.draw_date_str = fmtShortDate(actual);
        r.draw_date_is_estimate = false;
      } else if (r.draw_date) {
        r.draw_date_str = fmtShortDate(r.draw_date);
        r.draw_date_is_estimate = false;
      } else {
        const est = estimateNextDrawLocalStr(r.game_id);
        r.draw_date_str = est ? ('~' + est) : null;
        r.draw_date_is_estimate = !!est;
      }
    } else if (r.draw_date) {
      r.draw_date_str = fmtShortDate(r.draw_date);
      r.draw_date_is_estimate = false;
    } else {
      r.draw_date_str = null;
      r.draw_date_is_estimate = false;
    }
  });
}

// 마이 시그니처 항목은 자체적으로 당첨 등수를 갖고 있지 않다(그냥 저장해둔 번호 조합이기 때문).
// 대신 "내 등록내역"(entries 테이블)에서 같은 게임/회차/번호 조합을 찾아 이미 채점된 등수가 있으면 그대로 가져온다.
// 낙첨(0)이나 채점 대기(null)는 표시하지 않고, 당첨 등수(1 이상)가 있는 경우에만 보여준다.
async function attachGradesFromMyEntries(){
  allRows.forEach((r) => { r.grade = null; });
  if (!currentUserId || allRows.length === 0) return;
  const gameIds = [...new Set(allRows.map((r) => r.game_id).filter(Boolean))];
  if (gameIds.length === 0) return;
  const { data, error } = await sb
    .from('entries')
    .select('game_id, round_no, main_numbers, bonus_numbers, grade')
    .eq('user_id', currentUserId)
    .eq('confirmed', true)
    .in('game_id', gameIds)
    .not('grade', 'is', null)
    .gt('grade', 0);
  if (error || !data) return;
  const numKey = (arr) => (arr || []).map(Number).sort((a,b) => a-b).join(',');
  const lookup = {};
  data.forEach((e) => {
    const key = e.game_id + '_' + e.round_no + '_' + numKey(e.main_numbers) + '_' + numKey(e.bonus_numbers);
    lookup[key] = e.grade;
  });
  allRows.forEach((r) => {
    const key = r.game_id + '_' + r.round_no + '_' + numKey(r.main_numbers) + '_' + numKey(r.bonus_numbers);
    if (lookup[key] !== undefined) r.grade = lookup[key];
  });
}

function buildTitle(rows){

  const gameLabel = g ? g[nameKey()] : (currentLang==='ko' ? '전체 게임' : currentLang==='ja' ? '全ゲーム' : 'All Games');
  const today = new Date().toISOString().slice(0,10);
  const suffix = currentLang==='ko' ? '마이시그니처' : currentLang==='ja' ? 'マイシグニチャー' : 'MySignature';
  return gameLabel + ' ' + today + ' ' + suffix;

async function chargeAndFetch(ids){
  const resp = await fetch(EXPORT_CHARGE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + accessToken },
    body: JSON.stringify({ source: 'signature', ids: ids }),
  });
  const data = await resp.json();
  if (!resp.ok) {
    const err = new Error(data.error || 'Failed');
    err.code = data.code;
    err.shortfall = data.shortfall;
    err.balance = data.balance;
    err.chargeUrl = data.chargeUrl;
    throw err;
  }
  return data;
}

document.getElementById('exportPdfBtn').addEventListener('click', async function(){
  const t = i18n[currentLang];

  try {

    const title = buildTitle(data.rows);

    // Build a hidden, print-styled DOM node and render it as an image.
    // This avoids jsPDF's default font (Helvetica), which cannot render
    // Korean/Japanese characters and produces garbled text.
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;left:-99999px;top:0;background:#ffffff;padding:24px;width:760px;font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#111;';
    const h = document.createElement('h2');
    h.textContent = title;
    h.style.cssText = 'margin:0 0 16px 0;font-size:20px;';
    wrap.appendChild(h);

    const table = document.createElement('table');
    table.style.cssText = 'width:100%;border-collapse:collapse;font-size:13px;';
    const theadRow = [t.colGame, t.colRound, t.colDrawDate, t.colMain, t.colBonus, t.colMemo];
    const thead = document.createElement('tr');
    theadRow.forEach(function(label){
      const th = document.createElement('th');
      th.textContent = label;
      th.style.cssText = 'background:#2f6fed;color:#fff;text-align:left;padding:8px 10px;border:1px solid #d0d0d0;';
      thead.appendChild(th);
    });
    table.appendChild(thead);

    data.rows.forEach(function(r, i){
      const g = GAMES.find(function(x){ return x.id === r.game_id; });
      const cells = [
        g ? g[nameKey()] : r.game_id,
        r.round_no ? String(r.round_no) : '-',
        r.draw_date || '-',
        (r.main_numbers||[]).join(', '),
        (r.bonus_numbers||[]).join(', '),
        r.memo || ''
      ];
      const tr = document.createElement('tr');
      tr.style.background = (i % 2 === 0) ? '#f7f7f9' : '#ffffff';
      cells.forEach(function(val){
        const td = document.createElement('td');
        td.textContent = val;
        td.style.cssText = 'padding:8px 10px;border:1px solid #d0d0d0;';
        tr.appendChild(td);
      });
      table.appendChild(tr);
    });
    wrap.appendChild(table);
    document.body.appendChild(wrap);

    const canvas = await html2canvas(wrap, { scale: 2, backgroundColor: '#ffffff' });
    document.body.removeChild(wrap);

    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const margin = 10;
    const usableWidth = pageWidth - margin * 2;
    const imgWidthMm = usableWidth;
    const imgHeightMm = (canvas.height * imgWidthMm) / canvas.width;

    if (imgHeightMm <= pageHeight - margin * 2) {
      doc.addImage(imgData, 'PNG', margin, margin, imgWidthMm, imgHeightMm);
    } else {
      // Slice the tall image across multiple pages.
      const pageContentHeightPx = ((pageHeight - margin * 2) * canvas.width) / imgWidthMm;
      let renderedPx = 0;
      let first = true;
      while (renderedPx < canvas.height) {
        const sliceHeightPx = Math.min(pageContentHeightPx, canvas.height - renderedPx);
        const sliceCanvas = document.createElement('canvas');
        sliceCanvas.width = canvas.width;
        sliceCanvas.height = sliceHeightPx;
        const ctx = sliceCanvas.getContext('2d');
        ctx.drawImage(canvas, 0, renderedPx, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx);
        const sliceData = sliceCanvas.toDataURL('image/png');
        const sliceHeightMm = (sliceHeightPx * imgWidthMm) / canvas.width;
        if (!first) doc.addPage();
        doc.addImage(sliceData, 'PNG', margin, margin, imgWidthMm, sliceHeightMm);
        renderedPx += sliceHeightPx;
        first = false;
      }
    }

    doc.save(title.replace(/\s+/g,'_') + '.pdf');
    alert(t.exportSuccess(data.rows.length));
  } catch (e) {
    showExportError(e);
  } finally {
    btn.disabled = false;
  }
});

const TICKER_WEEKDAY_NUM = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };
function tkZonedTimeToUtc(dateStr, hour, minute, timeZone){
  const naiveUtc = new Date(`${dateStr}T${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}:00Z`);
  const tzDate = new Date(naiveUtc.toLocaleString('en-US', { timeZone }));
  const utcDate = new Date(naiveUtc.toLocaleString('en-US', { timeZone: 'UTC' }));
  const offset = utcDate.getTime() - tzDate.getTime();
  return new Date(naiveUtc.getTime() + offset);
}
function tkNextDrawDate(days, hour, minute, timeZone){
  const now = new Date();
  let best = null;
  for (let addDays = 0; addDays < 8; addDays++){
    const candidate = new Date(now.getTime() + addDays * 86400000);
    const wdName = new Intl.DateTimeFormat('en-US', { timeZone, weekday: 'short' }).format(candidate);
    const wd = TICKER_WEEKDAY_NUM[wdName];
    if (!days.includes(wd)) continue;
    const dateStr = new Intl.DateTimeFormat('en-CA', { timeZone }).format(candidate);
    const drawUtc = tkZonedTimeToUtc(dateStr, hour, minute, timeZone);
    if (drawUtc > now && (!best || drawUtc < best)) best = drawUtc;
  }
  return best;
}
function tkFmtCountdown(target){
  const dayLabel = currentLang === 'ko' ? '일' : currentLang === 'ja' ? '日' : 'd';
  const hourLabel = currentLang === 'ko' ? '시간' : currentLang === 'ja' ? '時間' : 'h';
  const diff = Math.max(0, target - new Date());
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  return d > 0 ? `${d}${dayLabel} ${h}${hourLabel}` : `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

  const nameKey = currentLang === 'ko' ? 'nameKo' : currentLang === 'ja' ? 'nameJa' : 'nameEn';
  const items = TICKER_GAMES.map(g => `

      <span class="cd mono" data-tcd="${g.id}">${tkFmtCountdown(g.next)}</span>
    </div>`).join('');
  const track = document.getElementById('tickerTrack');
  if (track) track.innerHTML = items + items;
}
setInterval(() => {
  document.querySelectorAll('[data-tcd]').forEach(el => {
    const g = TICKER_GAMES.find(x => x.id === el.dataset.tcd);
    if (!g) return;
    if (new Date() >= g.next) g.next = tkNextDrawDate(g.days, g.drawHour, g.drawMinute, g.tz);
    el.textContent = tkFmtCountdown(g.next);
  });
}, 1000);

applyLang(currentLang);
loadCollections();
</script>

<script src="auth-widget.js"></script>
</body>
</html>
