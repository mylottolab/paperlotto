<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PaperLotto — Points</title>
<!-- =====================================================================
     🔴 2026-10-16 신설 — 아이폰 앱 전용 포인트 충전 (애플 인앱 결제)
     애플 규정상 아이폰 앱 안에서는 포인트를 애플 결제로만 팔 수 있습니다.
     웹 · 안드로이드의 PayPal · 카드 · 무통장 충전은 그대로이고, 아이폰 앱만 이 화면으로 옵니다.
     흐름: 상품 누르기 → 앱(StoreKit) 결제창 → 결제 끝 → 서버(Edge Function apple-iap)가
           애플에 직접 확인 후 point_ledger 에 적립 → 앱에 "정리" 알림.   ₩1 = 1P, 소멸 없음.
     ===================================================================== -->
<script src="paperlotto_lang.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1c2130;--surface:#252b3d;--border:#363d55;--text:#f1ead8;--dim:#a7adc7;--faint:#6b7195;--gold:#e0aa4e;--green:#5fbf86;--red:#e07a5c}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 40px}
header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
header a{color:var(--dim);font-size:13px;text-decoration:none}
main{max-width:520px;margin:0 auto;padding:20px 16px}
h1{font-family:Georgia,serif;font-size:22px;margin-bottom:6px}
.sub{font-size:12.5px;color:var(--dim);line-height:1.6;margin-bottom:16px}
.bal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.bal .n{font-size:22px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.bal .l{font-size:12px;color:var(--dim)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pk{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:16px 14px;text-align:left;cursor:pointer;color:var(--text);font-family:inherit}
.pk:active{transform:scale(.98)}
.pk:disabled{opacity:.5}
.pk .p{font-size:20px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.pk .w{font-size:12.5px;color:var(--dim);margin-top:4px}
.note{font-size:11.5px;color:var(--faint);line-height:1.75;margin-top:16px}
.msg{min-height:22px;margin:12px 0;font-size:13px;line-height:1.6}
.msg.err{color:var(--red)} .msg.ok{color:var(--green)}
.box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;text-align:center;font-size:13.5px;line-height:1.7;color:var(--dim)}
.box a{display:inline-block;margin-top:12px;background:var(--gold);color:#1c2130;font-weight:800;padding:10px 20px;border-radius:9px;text-decoration:none}
</style>
</head>
<body>
<header><a href="index.html" id="back">← Home</a></header>
<main>
  <h1 id="ttl">Points</h1>
  <p class="sub" id="sub"></p>
  <div id="area"></div>
  <div class="msg" id="msg"></div>
  <p class="note" id="note"></p>
</main>
<script>
var SUPABASE_URL = 'https://wzrqaozlbfyejsbvnrxk.supabase.co';
var KEY = 'sb_publishable_3KrYMzwrVlbYr-e9d8UiLA_KgvSs8tC';
var FN = SUPABASE_URL + '/functions/v1/apple-iap';
var sb = window.supabase.createClient(SUPABASE_URL, KEY);

var T = {
  ko: { back:'← 홈', ttl:'포인트 충전', sub:'App Store 결제로 포인트를 충전합니다. 1원 = 1P, 충전한 포인트는 사라지지 않습니다.',
        note:'· 결제는 Apple ID 로 처리되며, 영수증은 Apple 에서 메일로 보내 드립니다.<br>· 결제가 끝났는데 포인트가 바로 보이지 않으면 이 화면을 다시 열어 주세요. 확인이 끝나지 않은 결제는 자동으로 다시 확인합니다.<br>· 포인트는 현금으로 바꾸거나 다른 사람에게 줄 수 없습니다. 환불은 Apple 의 환불 절차를 따릅니다.<br>· PaperLotto 는 복권을 판매하지 않으며 어떤 형태의 당첨금도 지급하지 않습니다. 포인트는 앱 안의 기능 이용에만 쓰입니다.',
        my:'내 포인트', webOnly:'이 화면은 아이폰 앱 전용입니다.', webGo:'충전 화면으로', needLogin:'포인트를 충전하려면 먼저 로그인해 주세요.', login:'로그인',
        noItems:'상품을 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.', relogin:'다시 로그인해 주세요.', acctFail:'계정을 확인하지 못했습니다.',
        opening:'App Store 결제창을 여는 중…', net:'연결 오류입니다.', cancel:'결제를 취소했습니다.', pending:'결제 승인을 기다리는 중입니다(보호자 승인 등). 승인되면 자동으로 들어옵니다.',
        payErr:'결제 오류', checking:'결제 확인 중…', loginToGet:'로그인 후 이 화면을 다시 열면 포인트가 들어옵니다.', refunded:'환불된 결제라 포인트를 넣지 않았습니다.',
        already:'이미 충전된 결제입니다.', added:'P 충전되었습니다.', other:'다른 계정으로 산 결제입니다.', fail:'확인하지 못했습니다.', retry:' 화면을 다시 열면 다시 확인합니다.' },
  en: { back:'← Home', ttl:'Buy points', sub:'Points are bought with App Store payment. ₩1 = 1P, and purchased points never expire.',
        note:'· Payment is handled by your Apple ID; Apple emails the receipt.<br>· If points do not appear right away, reopen this page — unfinished purchases are checked again automatically.<br>· Points cannot be exchanged for cash or transferred. Refunds follow Apple\'s refund process.<br>· PaperLotto does not sell lottery tickets and pays no prizes of any kind. Points are only used for features inside the app.',
        my:'My points', webOnly:'This page is for the iPhone app.', webGo:'Charge page', needLogin:'Please log in to buy points.', login:'Log in',
        noItems:'Could not load products. Please try again shortly.', relogin:'Please log in again.', acctFail:'Could not verify your account.',
        opening:'Opening App Store payment…', net:'Network error.', cancel:'Payment cancelled.', pending:'Waiting for approval (e.g. Ask to Buy). Points arrive automatically when approved.',
        payErr:'Payment error', checking:'Confirming payment…', loginToGet:'Log in and reopen this page to receive the points.', refunded:'This purchase was refunded, so no points were added.',
        already:'This purchase was already credited.', added:'P added.', other:'This purchase belongs to another account.', fail:'Could not confirm.', retry:' Reopen this page to retry.' },
  ja: { back:'← ホーム', ttl:'ポイントチャージ', sub:'App Store決済でポイントをチャージします。₩1 = 1P、チャージしたポイントは失効しません。',
        note:'・決済はApple IDで処理され、領収書はAppleからメールで届きます。<br>・決済後すぐにポイントが表示されない場合は、この画面を開き直してください。未確認の決済は自動で再確認します。<br>・ポイントは現金への交換や譲渡はできません。返金はAppleの手続きに従います。<br>・PaperLottoは宝くじを販売せず、いかなる賞金も支払いません。ポイントはアプリ内の機能にのみ使われます。',
        my:'保有ポイント', webOnly:'この画面はiPhoneアプリ専用です。', webGo:'チャージ画面へ', needLogin:'ポイントをチャージするにはログインしてください。', login:'ログイン',
        noItems:'商品を読み込めませんでした。しばらくしてから開き直してください。', relogin:'もう一度ログインしてください。', acctFail:'アカウントを確認できませんでした。',
        opening:'App Store決済を開いています…', net:'接続エラーです。', cancel:'決済をキャンセルしました。', pending:'承認待ちです（保護者の承認など）。承認されると自動で反映されます。',
        payErr:'決済エラー', checking:'決済を確認中…', loginToGet:'ログイン後にこの画面を開き直すとポイントが反映されます。', refunded:'返金された決済のため、ポイントは付与されませんでした。',
        already:'すでにチャージ済みの決済です。', added:'P チャージしました。', other:'別のアカウントで購入された決済です。', fail:'確認できませんでした。', retry:' 画面を開き直すと再確認します。' }
};
var lang = window.getPaperLottoLang ? getPaperLottoLang() : 'en';
var t = T[lang] || T.en;
document.documentElement.lang = lang;
document.getElementById('back').textContent = t.back;
document.getElementById('ttl').textContent = t.ttl;
document.getElementById('sub').textContent = t.sub;
document.getElementById('note').innerHTML = t.note;

var area = document.getElementById('area'), msg = document.getElementById('msg');
function say(s, cls){ msg.textContent = s || ''; msg.className = 'msg ' + (cls || ''); }
var native = window.MLLNative;
var busy = {};

async function token(){
  var r = await sb.auth.getSession();
  return r.data && r.data.session ? r.data.session.access_token : null;
}
async function call(action, extra, tok){
  var r = await fetch(FN, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': KEY, 'Authorization': 'Bearer ' + (tok || KEY) },
    body: JSON.stringify(Object.assign({ action: action }, extra || {}))
  });
  var d = await r.json().catch(function(){ return {}; });
  return { r: r, d: d };
}
async function loadBalance(){
  var tok = await token(); if (!tok) return;
  try {
    var r = await fetch(SUPABASE_URL + '/functions/v1/points-balance', { headers: { Authorization: 'Bearer ' + tok, apikey: KEY } });
    if (r.ok) { var b = await r.json(); document.getElementById('balN').textContent = Number(b.total || 0).toLocaleString() + 'P'; }
  } catch (e) {}
}
async function render(){
  if (!native) {
    area.innerHTML = '<div class="box">' + t.webOnly + '<br><a href="paperlotto_recharge_mockup.html">' + t.webGo + '</a></div>';
    return;
  }
  var tok = await token();
  if (!tok) {
    area.innerHTML = '<div class="box">' + t.needLogin + '<br><a href="paperlotto_login_connected.html?redirect=paperlotto_points_ios.html">' + t.login + '</a></div>';
    return;
  }
  var items = [];
  try { items = (await call('products')).d.items || []; } catch (e) {}
  if (!items.length) { area.innerHTML = '<div class="box">' + t.noItems + '</div>'; return; }
  area.innerHTML = '<div class="bal"><div class="l">' + t.my + '</div><div class="n" id="balN">–</div></div>' +
    '<div class="grid">' + items.map(function(p){
      return '<button class="pk" type="button" data-id="' + p.id + '"><div class="p">' + p.points.toLocaleString() + 'P</div>' +
        '<div class="w">₩' + p.krw.toLocaleString() + '</div></button>';
    }).join('') + '</div>';
  area.querySelectorAll('.pk').forEach(function(b){ b.addEventListener('click', function(){ buy(b.getAttribute('data-id')); }); });
  loadBalance();
  try { native.flush(); } catch (e) {}   // 지난번에 끝내지 못한 결제를 다시 받습니다
}
async function buy(id){
  var tok = await token();
  if (!tok) { say(t.relogin, 'err'); return; }
  try {
    var res = await call('account', {}, tok);
    if (!res.r.ok || !res.d.account) { say(res.d.error || t.acctFail, 'err'); return; }
    document.querySelectorAll('.pk').forEach(function(b){ b.disabled = true; });
    say(t.opening);
    native.buy(id, res.d.account);
  } catch (e) { say(t.net, 'err'); }
}
function unlock(){ document.querySelectorAll('.pk').forEach(function(b){ b.disabled = false; }); }

// 앱(StoreKit)에서 오는 소식
window.mllStoreEvent = async function(ev){
  if (!ev) return;
  if (ev.kind === 'storeCanceled') { unlock(); say(t.cancel); return; }
  if (ev.kind === 'storePending') { unlock(); say(t.pending); return; }
  if (ev.kind === 'storeError') { unlock(); say(ev.a || t.payErr, 'err'); return; }
  if (ev.kind !== 'storePurchase') return;
  var tx = ev.a;
  if (busy[tx]) return; busy[tx] = true;
  say(t.checking);
  try {
    var tok = await token();
    if (!tok) { say(t.loginToGet, 'err'); return; }
    var res = await call('verify', { transactionId: tx }, tok);
    var d = res.d;
    if (res.r.ok && d.ok) {
      try { native.finish(tx); } catch (e) {}
      if (d.revoked) say(t.refunded);
      else say(d.already ? t.already : ('✅ ' + Number(d.points || 0).toLocaleString() + t.added), 'ok');
      loadBalance();
    } else if (res.r.status === 403) {
      try { native.finish(tx); } catch (e) {}   // 다른 계정 결제 — 이 계정에는 넣지 않고 정리
      say(t.other, 'err');
    } else {
      say((d.error || t.fail) + t.retry, 'err');
    }
  } catch (e) {
    say(t.net + t.retry, 'err');
  } finally { busy[tx] = false; unlock(); }
};
render();
</script>
</body>
</html>
