*{box-sizing:border-box;}
body{ margin:0; background:var(--board); color:var(--text-hi); min-height:100vh; font-family:'Inter',sans-serif; word-break:keep-all; }

a{ color:inherit; }

header{

.brand{ display:flex; align-items:center; gap:10px; text-decoration:none; }
.brand-mark{ width:28px; height:28px; border-radius:6px; background:linear-gradient(135deg,var(--gold-bright),var(--gold)); display:flex; align-items:center; justify-content:center; color:var(--ink); font-weight:700; font-family:'Fraunces',serif; transform:rotate(-4deg); }
.brand-name{ font-size:16px; font-weight:600; color:var(--text-hi); }
.brand-name em{ font-style:normal; color:var(--gold-bright); }
.hdr-right{ display:flex; align-items:center; gap:10px; }
.back-link{ font-size:12.5px; color:var(--text-mid); text-decoration:none; }
.back-link:hover{ color:var(--gold-bright); }
.lang-toggle{ display:flex; border:1px solid var(--board-line); border-radius:20px; overflow:hidden; }
.lang-toggle button{ border:none; background:transparent; color:var(--text-dim); font-size:11.5px; font-weight:600; padding:6px 11px; cursor:pointer; font-family:'Inter',sans-serif; }

.page-sub{ font-size:12.5px; color:var(--text-mid); line-height:1.6; margin-bottom:22px; max-width:640px; }

.control-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }

.control-label{ font-size:12px; font-weight:700; color:var(--ink-dim); min-width:70px; }
select#gameSelect{ flex:1; min-width:220px; padding:10px 12px; border:1.5px solid #d9d1ba; border-radius:8px; font-size:13.5px; font-family:inherit; background:#fff; color:var(--ink); }

.range-btn{ padding:9px 16px; border:none; border-radius:8px; background:var(--ink); color:var(--paper); font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap; }
.range-btn:hover{ background:#2a3145; }
.range-btn:disabled{ opacity:0.55; cursor:not-allowed; }
.range-note{ font-size:11px; color:var(--ink-dim); }
.range-note b{ color:var(--gold); }
.range-status{ font-size:11.5px; margin-top:8px; width:100%; }
.range-status.ok{ color:var(--ok); }
.range-status.err{ color:var(--err); }

.stat-card{ background:var(--paper); color:var(--ink); border-radius:14px; padding:22px 24px; margin-bottom:16px; }
.stat-card h3{ font-size:14.5px; margin-bottom:14px; display:flex; align-items:center; gap:6px; }
.stat-table{ width:100%; border-collapse:collapse; font-size:12.5px; }

.stat-table td{ padding:8px 10px; border-bottom:1px solid #ece4cf; }
.stat-table tr.total td{ font-weight:700; border-top:1.5px solid #d9d1ba; border-bottom:none; }
.stat-table td.num{ text-align:right; font-family:'IBM Plex Mono',monospace; }

.freq-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:6px; }
.freq-pip{ display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--paper-2); border-radius:7px; padding:6px 10px; font-family:'IBM Plex Mono',monospace; font-size:12px; }

.loading-state{ text-align:center; color:var(--text-mid); font-size:13px; padding:50px 0; }

async function fetchDraws(gameId, rounds){
  var res = await sb.from('draw_results')
    .select('main_numbers, bonus_numbers', { count:'exact' })
    .eq('game_id', gameId)
    .order('round_no', { ascending:false })
    .limit(rounds);
  if (res.error) throw res.error;
  return { rows: res.data || [], totalAvailable: res.count !== null && res.count !== undefined ? res.count : (res.data ? res.data.length : 0) };
}

function computeOddEven(draws, k){
  var tally = {};
  for (var i=0;i<=k;i++) tally[i+':'+(k-i)] = 0;
  draws.forEach(function(arr){
    var oddCount = arr.filter(function(n){ return n % 2 === 1; }).length;
    var key = oddCount + ':' + (arr.length - oddCount);
    if (tally[key] === undefined) tally[key] = 0;
    tally[key]++;
  });
  var total = draws.length;
  return Object.entries(tally).map(function(e){
    return { ratio: e[0], count: e[1], pct: total ? Math.round(e[1]/total*1000)/10 : 0 };
  }).sort(function(a,b){ return Number(b.ratio.split(':')[0]) - Number(a.ratio.split(':')[0]); });
}

function sumRangeCalc(a,b){ var s=0; for (var i=a;i<=b;i++) s+=i; return s; }

function computeSumDistribution(draws, range, k){
  var minSum = sumRangeCalc(range[0], range[0]+k-1);
  var maxSum = sumRangeCalc(range[1]-k+1, range[1]);
  var bucketWidth = Math.ceil((maxSum - minSum + 1) / 5);
  var buckets = [];
  for (var i=0;i<5;i++){
    var lo = minSum + i*bucketWidth;
    var hi = (i===4) ? maxSum : (minSum + (i+1)*bucketWidth - 1);
    buckets.push({ lo:lo, hi:hi, count:0 });
  }
  draws.forEach(function(arr){
    var s = arr.reduce(function(a,b){return a+b;},0);
    var b = buckets.find(function(b){ return s >= b.lo && s <= b.hi; }) || buckets[buckets.length-1];
    b.count++;
  });
  var total = draws.length;
  return buckets.map(function(b){ return { label: b.lo + '-' + b.hi, count:b.count, pct: total ? Math.round(b.count/total*1000)/10 : 0 }; });
}

function computeConsecutive(draws, k){
  var tally = {}; tally['none'] = 0;
  for (var n=2;n<=k;n++) tally[n] = 0;
  draws.forEach(function(arr){
    var sorted = arr.slice().sort(function(a,b){return a-b;});
    var longest = 1, cur = 1;
    for (var i=1;i<sorted.length;i++){
      if (sorted[i] === sorted[i-1]+1) { cur++; longest = Math.max(longest, cur); }
      else cur = 1;
    }
    if (longest < 2) tally['none']++;
    else tally[longest] = (tally[longest]||0) + 1;
  });
  var total = draws.length;
  var rows = [{ key:'none', count:tally['none'], pct: total ? Math.round(tally['none']/total*1000)/10 : 0 }];
  for (var n2=2;n2<=k;n2++) rows.push({ key:n2, count:tally[n2]||0, pct: total ? Math.round((tally[n2]||0)/total*1000)/10 : 0 });
  return rows;
}

function computeFreq(nums){
  var freq = {};
  nums.forEach(function(n){ freq[n] = (freq[n]||0)+1; });
  return Object.entries(freq).map(function(e){ return { num:Number(e[0]), count:e[1] }; }).sort(function(a,b){ return b.count-a.count || a.num-b.num; });
}

function computeStartNumbers(draws){
  var freq = {};
  draws.forEach(function(arr){ var min = Math.min.apply(null, arr); freq[min] = (freq[min]||0)+1; });
  return Object.entries(freq).map(function(e){ return { num:Number(e[0]), count:e[1] }; }).sort(function(a,b){ return a.num-b.num; });
}

    '<tr class="total"><td>' + t().colTotal + '</td><td class="num">' + total.toLocaleString() + '</td><td class="num">100.0%</td></tr>' +

}

async function renderStats(){
  var body = document.getElementById('statsBody');
  body.innerHTML = '<div class="loading-state">' + t().loading + '</div>';
  var g = curGame();
  try {
    var data;
    if (cachedRows && cachedRows.gameId === g.id && cachedRows.rounds === currentRounds) {
      data = cachedRows;
    } else {
      var res = await fetchDraws(g.id, currentRounds);
      data = { gameId:g.id, rounds:currentRounds, rows:res.rows, totalAvailable:res.totalAvailable };
      cachedRows = data;
    }
    var rows = data.rows;
    if (!rows.length) { body.innerHTML = '<div class="loading-state">' + t().errorLoad + '</div>'; return; }

    var mainDraws = rows.map(function(r){ return r.main_numbers || []; });
    var mainAll = mainDraws.flat();

    var combinedForFreqOE = mainDraws;
    var combinedAllForFreqOE = mainAll;
    if (g.bonusDrum === 'same') {
      combinedForFreqOE = rows.map(function(r){ return (r.main_numbers||[]).concat(r.bonus_numbers||[]); });
      combinedAllForFreqOE = combinedForFreqOE.flat();
    }

    var oddEvenRows = computeOddEven(combinedForFreqOE.length ? combinedForFreqOE : mainDraws, combinedForFreqOE[0] ? combinedForFreqOE[0].length : g.mainCount);
    var sumRows = computeSumDistribution(mainDraws, g.mainRange, g.mainCount);
    var consecRows = computeConsecutive(mainDraws, g.mainCount);
    var freqRows = computeFreq(combinedAllForFreqOE);
    var startRows = computeStartNumbers(mainDraws);

    var bonusHtml = '';
    if (g.bonusDrum === 'separate') {
      var bonusAll = rows.map(function(r){ return r.bonus_numbers || []; }).flat();
      var bonusDraws = rows.map(function(r){ return r.bonus_numbers || []; });
      var bonusFreqRows = computeFreq(bonusAll);
      var bonusOE = computeOddEven(bonusDraws, bonusDraws[0] ? bonusDraws[0].length : 1);
      var bName = bonusLabel(g);
      bonusHtml =
        '<div class="bonus-section">' +
          '<div class="bonus-section-label">' + t().bonusSectionLabel(bName) + '</div>' +
          '<div class="stat-card"><h3>' + t().bonusFreqTitle(bName) + '</h3>' + freqGridHtml(bonusFreqRows) + '</div>' +
          '<div class="stat-card"><h3>' + t().bonusOddEvenTitle(bName) + '</h3>' + oddEvenTableHtml(bonusOE) + '</div>' +
        '</div>';
    }

    body.innerHTML =
      '<div style="font-size:11.5px;color:var(--text-dim);margin-bottom:14px;">' + t().availLabel(data.totalAvailable) + '</div>' +
      '<div class="stat-card"><h3>' + t().oddEvenTitle + '</h3>' + oddEvenTableHtml(oddEvenRows) + '</div>' +
      '<div class="stat-card"><h3>' + t().sumTitle(g.mainCount) + '</h3>' + sumTableHtml(sumRows) + '</div>' +
      '<div class="stat-card"><h3>' + t().consecTitle + '</h3>' + consecTableHtml(consecRows) + '</div>' +
      '<div class="stat-card"><h3>' + t().freqTitle + '</h3>' + freqGridHtml(freqRows) + '</div>' +
      '<div class="stat-card"><h3>' + t().startTitle + '</h3>' + freqGridHtml(startRows) + '</div>' +
      bonusHtml;
  } catch (e) {
    console.error('[round-stats]', e);
    body.innerHTML = '<div class="loading-state">' + t().errorLoad + '</div>';
  }
}

document.getElementById('rangeApplyBtn').addEventListener('click', async function(){
  var input = document.getElementById('rangeInput');
  var requested = Math.max(10, parseInt(input.value) || DEFAULT_ROUNDS);
  var statusEl = document.getElementById('rangeStatus');
  statusEl.textContent = ''; statusEl.className = 'range-status';

  if (requested === currentRounds) return;

  if (requested === DEFAULT_ROUNDS) {
    currentRounds = DEFAULT_ROUNDS;
    cachedRows = null;
    renderStats();
    return;
  }

  var sessionRes = await sb.auth.getSession();
  var session = sessionRes.data.session;
  if (!session) {
    statusEl.textContent = t().rangeErrLogin;
    statusEl.className = 'range-status err';
    return;
  }
  if (!confirm(t().rangeConfirm(requested, CUSTOM_RANGE_DISPLAY_COST))) return;

  var btn = document.getElementById('rangeApplyBtn');
  btn.disabled = true;
  statusEl.textContent = t().rangeCharging;
  statusEl.className = 'range-status';
  try {
    var resp = await fetch(CHARGE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
      body: JSON.stringify({ actionKey: CUSTOM_RANGE_ACTION_KEY, refId: currentGameId }),
    });
    var data = await resp.json();
    if (!resp.ok) {
      if (resp.status === 402) statusEl.textContent = t().rangeErrInsufficient(data.shortfall || 0);
      else statusEl.textContent = data.error || t().rangeErrGeneric;
      statusEl.className = 'range-status err';
      return;
    }
    statusEl.textContent = t().rangeCharged(data.charged);
    statusEl.className = 'range-status ok';
    if (window.refreshAuthBalance) window.refreshAuthBalance();

    currentRounds = requested;
    cachedRows = null;
    await renderStats();

    if (cachedRows && cachedRows.totalAvailable < requested) {
      statusEl.textContent += ' ' + t().rangeErrTooMany(cachedRows.totalAvailable);
    }
  } catch (e) {
    statusEl.textContent = t().rangeErrGeneric;
    statusEl.className = 'range-status err';
  } finally {
    btn.disabled = false;
  }
});

renderGameSelect();
document.getElementById('gameSelect').value = currentGameId;
updateRangeNote();
applyLang(currentLang);
