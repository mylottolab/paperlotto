<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PaperLotto — 새 비밀번호</title>
<!-- 🔴 2026-10-16 신설 — 비밀번호 재설정
     로그인 화면 "비밀번호를 잊으셨나요?" → 메일 링크 → 여기(Supabase 가 주소에 복구 정보를 실어 보냄) → 새 비밀번호 저장.
     ⚠ Supabase → Authentication → URL Configuration → Redirect URLs 에
       https://paperlotto.com/paperlotto_reset_password.html 이 있어야 합니다. -->
<script src="paperlotto_lang.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1c2130;color:#f1ead8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:400px;background:#f6f1e6;color:#1c2130;border-radius:16px;padding:28px 24px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.brand{font-family:Georgia,serif;font-size:22px;font-weight:700;margin-bottom:6px}
.brand span{color:#b8862e}
h1{font-size:17px;margin:14px 0 6px}
p.sub{font-size:13px;color:#5b6074;line-height:1.6;margin-bottom:16px}
label{display:block;font-size:12.5px;font-weight:600;margin:12px 0 6px}
input{width:100%;padding:12px;border:1px solid #d6cdb8;border-radius:9px;font-size:15px;background:#fff}
button{width:100%;margin-top:18px;padding:13px;border:none;border-radius:10px;background:#b8862e;color:#1c2130;font-size:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
.msg{display:none;margin-top:14px;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.55}
.msg.err{display:block;background:rgba(198,90,46,.12);color:#a8451f}
.msg.ok{display:block;background:rgba(58,140,90,.12);color:#2f7a4d}
a{color:#8a5b1c}
</style>
</head>
<body>
<div class="card">
  <div class="brand">Paper<span>Lotto</span></div>
  <h1 id="ttl">새 비밀번호 정하기</h1>
  <p class="sub" id="sub">새로 쓸 비밀번호를 두 번 입력해 주세요 (8자 이상).</p>
  <div id="form">
    <label for="pw1" id="l1">새 비밀번호</label>
    <input type="password" id="pw1" autocomplete="new-password">
    <label for="pw2" id="l2">한 번 더</label>
    <input type="password" id="pw2" autocomplete="new-password">
    <button type="button" id="save">저장</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script>
var T = {
  ko: { ttl:'새 비밀번호 정하기', sub:'새로 쓸 비밀번호를 두 번 입력해 주세요 (8자 이상).', l1:'새 비밀번호', l2:'한 번 더', save:'저장',
        short:'비밀번호는 8자 이상이어야 합니다.', diff:'두 비밀번호가 서로 다릅니다.', wait:'링크를 확인하는 중입니다… 잠시 뒤 다시 눌러 주세요.',
        bad:'링크가 만료되었거나 이미 사용되었습니다. 로그인 화면에서 "비밀번호를 잊으셨나요?"를 다시 눌러 주세요.',
        ok:'비밀번호를 바꿨습니다. 새 비밀번호로 로그인해 주세요.', go:'로그인 화면으로', fail:'저장하지 못했습니다: ' },
  en: { ttl:'Set a new password', sub:'Enter your new password twice (at least 8 characters).', l1:'New password', l2:'Once more', save:'Save',
        short:'Password must be at least 8 characters.', diff:'The two passwords do not match.', wait:'Checking the link… please try again in a moment.',
        bad:'This link has expired or was already used. Please tap "Forgot your password?" on the login screen again.',
        ok:'Your password has been changed. Please log in with the new password.', go:'Go to login', fail:'Could not save: ' },
  ja: { ttl:'新しいパスワードの設定', sub:'新しいパスワードを2回入力してください（8文字以上）。', l1:'新しいパスワード', l2:'もう一度', save:'保存',
        short:'パスワードは8文字以上で入力してください。', diff:'2つのパスワードが一致しません。', wait:'リンクを確認しています… 少し後でもう一度押してください。',
        bad:'リンクの有効期限が切れたか、すでに使用されています。ログイン画面で「パスワードをお忘れですか？」をもう一度押してください。',
        ok:'パスワードを変更しました。新しいパスワードでログインしてください。', go:'ログイン画面へ', fail:'保存できませんでした: ' }
};
var lang = (window.getPaperLottoLang ? getPaperLottoLang() : 'en'); var t = T[lang] || T.en;
document.documentElement.lang = lang;
['ttl','sub','l1','l2'].forEach(function(k){ document.getElementById(k).textContent = t[k]; });
document.getElementById('save').textContent = t.save;

var sb = window.supabase.createClient('https://wzrqaozlbfyejsbvnrxk.supabase.co', 'sb_publishable_3KrYMzwrVlbYr-e9d8UiLA_KgvSs8tC');
var ready = false;
var msg = document.getElementById('msg');
function say(s, ok){ msg.textContent = s; msg.className = 'msg ' + (ok ? 'ok' : 'err'); }

// 메일 링크로 들어오면 supabase-js 가 주소의 복구 정보를 읽어 잠깐 로그인 상태를 만듭니다
sb.auth.onAuthStateChange(function(ev, session){ if (session) ready = true; });
sb.auth.getSession().then(function(r){ if (r.data && r.data.session) ready = true; });
if (/error_code=|error=/.test(location.hash + location.search)) say(t.bad, false);

document.getElementById('save').addEventListener('click', async function(){
  var a = document.getElementById('pw1').value, b = document.getElementById('pw2').value;
  if (a.length < 8) { say(t.short); return; }
  if (a !== b) { say(t.diff); return; }
  if (!ready) {
    var r = await sb.auth.getSession();
    if (!(r.data && r.data.session)) { say(t.bad); return; }
  }
  this.disabled = true;
  var res = await sb.auth.updateUser({ password: a });
  this.disabled = false;
  if (res.error) { say(t.fail + res.error.message); return; }
  await sb.auth.signOut();
  document.getElementById('form').style.display = 'none';
  msg.className = 'msg ok';
  msg.innerHTML = '';
  msg.appendChild(document.createTextNode(t.ok + ' '));
  var a2 = document.createElement('a'); a2.href = 'paperlotto_login_connected.html'; a2.textContent = t.go; msg.appendChild(a2);
});
</script>
</body>
</html>
